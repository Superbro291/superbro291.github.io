ay require. However, such shall not conflict with applicable standards or policies of the I.B.E.W. or to which it is a party. After such an apprentice has worked one (1) year in the jurisdiction of the L.U., they shall be admitted into the I.B.E.W. through the L.U. without further action by the L.U. Apprentices, helpers, and groundmen may or may not have a voice and vote at L.U. meetings or elections as the L.U. decides and as provided in the L.U. bylaws. No apprentice shall be eligible to hold any office in the L.U., except that a member who was previously eligible to hold office ART. 15","46"],["in the L.U. shall remain eligible if they entered an apprenticeship program for the purpose of upgrading their classification.\nSec. 15. Each L.U. shall have a safety and health committee which shall: investigate and report serious accidents and fatalities; cooperate with the I.O. on safety and health matters; promote safety and health; and cooperate with safety and health organizations as determined by the L.U. and as directed by the I.O. Each L.U. shall investigate and report to the I.O. all serious lost-time accidents and fatalities. Reports shall be submitted using the web-based, electronic version of Form 173, I.B.E.W. Report of Occupational Injury, Illness or Fatality. Nothing in this section, or in the activities of the safety and health committee, is intended to create any right or obligation enforceable by individual members or employees against the L.U., the I.B.E.W., or members of the committee.\nSec. 16. Each L.U. shall establish the amount of its admission fee subject to approval of the I.P. Such fees must be stated in the L.U. bylaws; and in case of a dispute, the fees recorded in the bylaws shall be conclusive of the correct amount.\nSec. 17. In no case shall a L.U. charge any member of the I.B.E.W. an examination fee.\nSec. 18. No L.U. shall send out, or approve the sending out of, financial appeals of any kind without first having consent of the I.P. No L.U. shall recognize or pass upon any financial appeals, etc., it may receive without such appeals having received approval of the I.P.\nSec. 19. Whenever the I.P. deems it necessary to protect or advance the interests of a L.U. and the I.B.E.W., or to organize and protect its jurisdiction, the I.P. may require the L.U. to employ a sufficient number of representatives to cover the jurisdiction or territory involved. 47","ART. 15"],["Sec. 20. Railroad L.U.’s shall join Railroad System Federations and System Councils where such are formed. Railroad L.U.’s must contribute to the support of and conform to the laws of Railroad System Councils where such are formed. Railroad L.U.’s shall cooperate in the manner directed by the I.P.\nSec. 21. L.U.’s outside the railroad industry may form System Councils for bargaining purposes, with approval of the I.P., and shall do so when directed by the I.P. Where formed, the L.U.’s affected or involved shall affiliate, and remain so, and shall pay for the support of, and conform to the approved bylaws of, such System Councils. The I.S.T. shall grant a charter to such System Council when authorized by the I.P. The type of work and the territory or jurisdiction covered by the charter must be defined in the approved bylaws. Each delegate to the System Council shall be elected in the same manner as are the officers of the L.U. the delegate represents. Such System Councils, and their officers and representatives, shall be subject to and be governed by the same rules and laws (where such apply to them) as appear in this Constitution for L.U.’s.\nSec. 22. No L.U. shall withdraw from the I.B.E.W. or dissolve as long as five (5) members in good standing object thereto. Before withdrawal, written notice must be given to the I.P., and all books, papers, charters, funds, and all property are to be forwarded to the I.S.T.\nSec. 23. L.U.’s, Railroad System Councils, or System Councils whose charters have been revoked or suspended for violation of this Constitution, or for noncompliance with decisions rendered by proper International authority, shall have no ART. 15","48"],["right or power to take any action, except actions necessary to comply with the Constitution or decisions rendered by proper I.B.E.W. authority. After such action has been taken, no further action can be taken until notice from the I.P. is received that the revocation or suspension has been terminated.\nSec. 24. No L.U., or its officers, employees, or representatives, is authorized to act on behalf of the I.B.E.W. or shall be deemed an agent of the I.B.E.W., except upon specific authorization granted by the I.P.\nSec. 25. The Examining Board shall supervise the examination of all applicants for membership to determine their qualifications for the trade, except for those selected as apprentices under provisions of the collective bargaining agreement. They shall review such qualifications of members as provided in\nArticle XIX of this Constitution. The Board shall meet at least quarterly to supervise the examination of applicants when there are applicants to be examined. The Board shall retain all records of examinations given for at least two (2) years. The report on the results of all examinations shall be furnished to the Executive Board and the L.U. by the Examining Board. Parliamentary Rules\n1. The chair may save time in deciding certain questions by asking if there are any objections. If there are none, the chair shall declare an action adopted.\n2. The chair shall not allow any member of the L.U. to speak more than once on the same subject until all members desiring the floor have spoken, and not more than twice, and not more than seven (7) minutes at any one time, except those making reports. 49","ART. 15"],["3. Sectarian discussions shall not be permitted under any circumstances.\n4. When members desire all talk or debate stopped and a vote taken, they may call for the previous question. When this is done it shall be put to a vote at once in this form: “Shall all debate be closed and the main question voted upon?” If this carries by a majority vote, then a vote shall be taken at once on the question before the meeting.\n5. An appeal may be taken at the meeting on any ruling of the chair, but not when a question of law is involved. When an appeal is taken to the meeting, the chair shall state it in these words: “Shall the decision of your chair be upheld?” The member making the appeal shall then state their grounds, and the chair shall give the reason for the decision. The vote shall then be taken without further debate.\n6. A question can be reconsidered only at the same meeting or at the next regular meeting. If reconsidered at the same meeting, a majority vote is sufficient. If reconsidered at the next meeting, a two-thirds (2/3) vote is required. A motion to reconsider must be made and seconded by two (2) members who voted with the majority.\n7. A motion can be amended only twice.\n8. If a motion has been amended, then the amendment shall be voted upon first. If more than one (1) amendment has been offered, then the vote shall be first on the amendment to the amendment; next on the amendment to the motion; and last on the original motion. ART. 15","50"],["9. Motions to lay on the table, or to read a paper or document, or to adjourn, are not debatable.\n10. All resolutions and resignations must be submitted in writing.\n11. All other parliamentary questions not decided in these rules shall be decided by Robert’s Rules of Order Newly Revised.","ARTICLE XVI","OFFICERS OF LOCAL UNIONS","Sec. 1. Each L.U. shall have a president, vice president, recording secretary, financial secretary, treasurer, and Executive Board of not more than seven (7) nor less than three\n(3) members, provided that where deemed necessary for better representation in the L.U., the Executive Board may, with the consent of the I.P., have more than seven (7) members and, if the L.U. so decides, an Examining Board of not more than five (5) nor less than three (3) members. The members of the Examining Board are elected; however, they are not considered L.U. operating officers.\nSec. 2. L.U.’s requiring a local business representative or representatives shall elect one (1) person to be known as a business manager. The business manager shall appoint any and all other representatives or assistants. These shall work directly under the business manager and be subject to the business manager’s authority. The business manager may discharge them at any time. When a representative or assistant is discharged by the business manager, they shall not be reemployed or paid by the L.U. in any capacity during the term of office of such business manager without such business manager’s consent. However, this does not disqualify any dis51","ART. 16"],["charged assistant or representative from running for office at the next election. The business manager shall be the principal officer of the L.U., and all other L.U. officers shall cooperate with the business manager and shall not work in conflict with the business manager.\nSec. 3. Each L.U. shall also have a press secretary, registrar, and as many inspectors and door foremen as the L.U. president deems necessary. These shall not be considered officers and shall be appointed by the president. They shall perform such duties as the president directs. The president may remove any of them and appoint others at any time.\nSec. 4. No other local offices shall be created without consent of the I.P.\nSec. 5. No L.U. shall combine the offices of financial secretary and treasurer or combine any of the offices of president, treasurer, and recording secretary, unless by special dispensation from the I.P.\nSec. 6. In each L.U. whose members participate in the Pension Benefit Fund, no member shall be eligible to serve as F.S. unless such member is also a participant in the Pension Benefit Fund, unless this requirement is waived by the I.P.\nSec. 7. No L.U. shall allow dues to officers or appointees for services rendered, but the L.U. may fix such salaries for them as it decides.\nSec. 8. The officers shall serve three (3) or four (4) year terms as the L.U. bylaws may provide, or until their successors are qualified.\nSec. 9. Nominations for officers shall be held in the month of May of election years as provided in the L.U. bylaws. However, the I.P. may grant special dispensation to hold the nominaART. 16","52"],["tions in a different month when the I.P. is satisfied good cause is shown. Where such change is to continue, the month shall be stated in the L.U.’s bylaws. Any member nominated can withdraw their name any time prior to the election, either by announcement at the meeting of the L.U. or by notifying the L.U. president in writing.\nSec. 10. No member shall be nominated for office unless they are present or signify their willingness in writing, nor shall a member be eligible for any office unless they have been a member in continuous good standing at least two (2) years in the L.U. immediately prior to nomination, provided the L.U. has been in existence for this length of time. When it is impracticable or impossible for a L.U. to elect officers with the required standing, the I.P. may grant special dispensation. A member must be in good standing between the time of nomination and installation and, if elected, must remain in good standing while serving in office, unless the I.P. grants special dispensation when circumstances warrant, such as a clerical error or emergencies beyond the control of the member, preventing the timely payment of dues. The two (2) year membership requirement shall not be applicable to members of L.U.’s affiliated with System Councils who are employed by a single employer and who transfer between L.U.’s within a System Council, provided, however, that any such member must have been a member in continuous good standing for two (2) years in at least one of the L.U.’s affiliated with the System Council involved.\nSec. 11. The L.U. shall decide the manner in which the nominations and elections shall be held, and such shall be stated in the L.U. bylaws. This shall not conflict with the I.B.E.W. Constitution. There shall be one (1) judge, who shall be selected by the method stated in the L.U. bylaws, and who 53","ART. 16"],["shall be selected a minimum of sixty (60) days prior to the date on which the L.U. sends its notice of nominations and elections. There shall be as many tellers as necessary, who shall be selected by the method stated in the L.U. bylaws. The election judge and tellers must have been members in continuous good standing in the L.U. at least two (2) years immediately prior to nominations, provided the L.U. has been in existence for this length of time. Election observers must be members eligible to vote in the election.\nSec. 12. Elections of officers shall be held in the month of June of election years as provided in the L.U. bylaws. However, the I.P. may grant special dispensation to hold the elections in a different month and to extend the time for conducting the elections when the I.P. is satisfied good cause is shown. Where such change is to continue, the month shall be stated in the L.U.’s bylaws. Each L.U. shall set a definite date and time for the elections. All elections shall be decided for the candidate receiving the most votes, unless the L.U. bylaws provide otherwise. However, election to the L.U. Executive Board or Examining Board shall be decided for the candidates receiving the most votes. Where a majority of the votes cast is required and no candidate receives such majority, a runoff election will be held between the two (2) candidates receiving the highest number of votes. The time for holding a runoff election shall be stated in the L.U. bylaws, where a majority vote is required.\nSec. 13. The installation of officers shall occur at the first meeting held in July following the elections. However, the I.P. may grant special dispensation for a different time for the installation of officers when the I.P. is satisfied good cause is shown. When such dispensation is granted, the time shall be stated in the L.U.’s bylaws. ART. 16","54"],["Sec. 14. Any officer failing to discharge the duties of their office for two (2) consecutive meetings, unless satisfactory excuse is given in writing, shall have their office or position declared vacant by the L.U. president, and the Executive Board shall then fill such vacancy until the next regular election.\nSec. 15. When it is decided by proper authority, and in accordance with these laws, that any L.U. officer shall be suspended or removed from office, then the L.U. president shall at once declare such office vacant. If this applies to the president, then the vice president shall declare the office vacant.\nSec. 16. Vacancies occurring in any L.U. office or the Examining Board shall be filled by the L.U. Executive Board until the next regular election, within fifteen (15) calendar days of the vacancy, except when filled by the I.P. The eligibility requirements for election to the office shall apply. Vacancies in the position of press secretary, registrar, door foreman, or inspector shall be filled by the L.U. president within fifteen\n(15) calendar days of the vacancy.\nSec. 17. During the temporary absence of any officer, the president shall appoint a member to serve pro tem. In the absence of the president, the vice president shall automatically perform the president’s duties. In the absence of both the president and the vice president, the recording secretary shall call the L.U. meeting to order and the L.U. shall name a temporary chair. (This does not apply to the business manager.)\nSec. 18. All officers, at the expiration of their terms of office, shall deliver to their successors all books, papers, money, and other property in their possession belonging to the I.B.E.W. or the L.U. and shall not be relieved from their bond or obligation until this has been done.\nSec. 19. All officers, appointees, or employees shall turn over all books, papers, and property of the L.U. in their pos55","ART. 16"],["session to the I.P. or the designated representative of the I.P. upon their demand.\nSec. 20. No officer of a L.U., Railroad System Council, or System Council shall improperly use, or allow anyone to improperly use, the mailing list of members to communicate with them regarding union politics or candidates for union office. Any officer having such a list shall be held personally liable for its misuse.","ARTICLE XVII President","DUTIES OF LOCAL UNION OFFICERS","Sec. 1. The L.U. president shall be held responsible for the strict enforcement of this Constitution and the rules herein and the L.U. bylaws. The president shall be held personally liable and subject to penalty by the I.P. for failure to conduct orderly meetings or failure to carry out the responsibilities and duties imposed upon the president herein. The president is empowered and shall do as follows:\n(a) Preside at all meetings of the L.U. and see that each meeting is promptly adjourned not later than 11 p.m. prevailing time. When the president deems it necessary to preserve order, the president shall appoint members to aid in doing so and in carrying out the president’s rulings.\n(b) Promptly remove from the meeting room any intoxicated member, any disturber, or anyone not conducting themselves in an orderly way, or anyone who disturbs the harmony or peace of the meeting, or who fails promptly to abide by the president’s rulings or the action of the meeting. The president ART. 17","56"],["shall suspend from attendance at any meeting any member who commits any of these offenses, for the balance of such meeting, and shall see to it that such member shall not be allowed to reenter the meeting for the remainder of the meeting. The president may repeat the sentence of suspension at any subsequent meeting at which an offender persists in such conduct.\n(c) Decide all questions of order according to the parliamentary rules stated herein, and have the deciding vote in case of a tie, and see that all assessments are paid and all penalties enforced.\n(d) Appoint all committees; act as an ex-officio member of all committees; appoint all delegates to central, trades, and political councils or bodies with which the L.U. is affiliated. Where the L.U. has a business manager, then the business manager and any assistants shall be named by the president as delegates to the Building and Construction Trades Council and to the Metal Trades Council; and the president shall appoint the registrar as delegate to conferences of bodies on political education and activity with which the L.U. is affiliated. The president shall consult and cooperate with the business manager (where the L.U. has one) on all appointments.\n(e) See that all committees perform the duties assigned to them within a reasonable time and promptly remove any committee member not performing their duties and appoint another. The president shall see that the registrar promotes political education and activity as determined by the L.U.; keeps such records as are found to be necessary to encourage all members to register and vote; and keeps the membership informed on candidates worthy of support and pending legis57","ART. 17"],["lation of vital importance to the country, the community, and the members of the L.U.\n(f) Either appoint an auditing committee of three members, or the president or the L.U. Executive Board, as the L.U. decides, shall employ a public accountant to reconcile the books and accounts of the L.U. every three (3) months. The president shall inspect the bank book or books of the treasurer to see that L.U. moneys turned over to the treasurer have been properly and promptly deposited in the name of the L.U. In addition, the president shall employ a certified public accountant to perform an annual independent audit of the books and accounts of the L.U., in accordance with U.S. generally accepted auditing standards or their international equivalent; provided, however, should the L.U. believe it would be cost prohibitive to conduct such an annual independent audit, the L.U. can request a waiver from the I.S.T.\n(g) See that all funds of the L.U. are deposited in a reputable bank or banks in the name of the L.U., subject to withdrawal by check signed in the name of the L.U. and countersigned by the president and treasurer, and see that no disbursements are made except on an order countersigned by the R.S. and the president after action of the L.U. However, no action of the L.U. is necessary to pay regular or standing bills such as rent, salaries, and payments due the I.S.T.\n(h) Notify in writing any bank, or all banks, in which the L.U. makes deposits, that the L.U. empowers the I.P. to stop withdrawal of any L.U. funds when in the judgment of the I.P. such action is necessary to protect the L.U. and its members. The president shall notify such bank or banks that they are to honor and abide by any notice from the I.P. to stop withdrawals should the occasion arise. The president shall send to the ART. 17","58"],["I.S.T. a copy of such letter or notice to any bank or banks to be made a matter of record.\n(i) See that the amount of bonds on the L.U. officers and employees is sufficient to protect the L.U. against any loss. The minimum bond shall be five-thousand dollars ($5,000), and the bonds are to be made through the I.O.\n(j) Cooperate with the business manager of the L.U., if the L.U. has one, and shall not work in conflict with the business manager. Where the L.U. has no business manager, the duties normally performed by the business manager shall be performed by the president, who is then both president/business manager, except where the L.U. is affiliated with a Railroad System Council or has a general chair. The president shall keep accurate statistics, or see to it that such statistics as required by the I.P. are kept by the F.S. or person designated, and shall cooperate fully with the Research Department of the I.B.E.W. The president shall perform such other duties as are prescribed herein, or that may be assigned by the L.U. when such duties are not in conflict with this Constitution and these rules. Vice President\nSec. 2. The vice president shall assist the president in the discharge of the president’s duties and shall fill the president’s place in case of the president’s absence and perform such other duties as are required by this Constitution and the bylaws of the L.U. Recording Secretary\nSec. 3. The R.S. shall keep correct minutes of each meeting of the L.U.; answer all correspondence in accordance with 59","ART. 17"],["instructions given by the L.U. or the president; make out all orders on the treasurer for the payment of authorized bills; notify the I.S.T. of all changes in officers, giving names and addresses; and perform such other duties as are directed by the president or required by this Constitution and the bylaws of the L.U. Financial Secretary\nSec. 4. The F.S. shall keep such books and records, and issue such receipts, as are required or approved by the I.S.T. The F.S. may, when necessary and when approved by the L.U., employ an assistant or assistants. The F.S. shall be responsible for all moneys collected by the L.U. until such funds are turned over to the treasurer or deposited in the L.U.’s bank account without delay. When the F.S. deposits any L.U. funds, they shall furnish the treasurer with the bank record of all such deposits not later than the close of the month. The F.S. shall make known to the L.U. the receipts received at such time as the L.U. decides. They shall electronically transfer to the I.S.T. the per capita report, and the money due, by the tenth (10th) of the month, unless special arrangements with the I.S.T. are made. (The L.U. shall be responsible to the I.S.T. for such payments.) If the F.S. fails to do this as required, the L.U. may be assessed an amount determined appropriate by a policy developed by the I.S.T. The F.S. shall keep a record of each member, the full name and address, and notify the I.S.T. of all suspended or expelled members.\nSec. 5. The F.S. of each railroad L.U. shall also collect all moneys and fees due Railroad System Councils, and forward these to the council secretary on or before the tenth (10th) of the month. The F.S. shall make reports on official forms provided by the I.S.T., sending one to the council secretary, ART. 17","60"],["one to the I.S.T., and keeping one for the L.U. records. The F.S. shall also send on or before the tenth (10th) of the month a list giving the complete standing of members, showing members admitted, those leaving with Traveling Cards, suspended, expelled, or dropped from the rolls, and those not working.\nSec. 6. The F.S. shall submit their books and records for inspection or audit when called upon by the I.P., the I.S.T., the L.U. president, or Executive Board. Treasurer\nSec. 7. The treasurer shall receive from the F.S. all moneys collected or the bank record of money deposited in the L.U.’s bank account and give proper receipt for the same. The treasurer shall deposit all L.U. moneys turned over to them by the F.S. in a bank or banks designated by the L.U. in the name of the L.U. The treasurer shall make no disbursements without sanction of the L.U., except for payments of regular or standing bills such as rent, salaries, and payments to the I.S.T., which do not require a vote of the L.U., and upon an order or warrant signed by the president and the R.S. The treasurer shall make an itemized statement to the L.U. as and when required by the L.U. or the president. The treasurer shall submit their books and records for inspection or audit when called upon by the I.P., the I.S.T., the L.U. president, or Executive Board. Business Manager (where a L.U. has one)\nSec. 8. The business manager shall be the principal officer of the L.U. and shall be held responsible to the L.U. and to the I.P. for results in organizing their jurisdiction, for establishing friendly relations with employers, and for protecting the jurisdiction of the I.B.E.W. It shall be the business manager’s responsibility to keep accurate statistics, or to see that such 61","ART. 17"],["statistics as required by the I.P. are kept, and shall cooperate fully with the Research Department of the I.B.E.W. The business manager or their designee shall serve as a permanent member of the negotiating committee and serve as a trustee on all trust funds of the L.U. provided for in the collective bargaining agreements. The business manager shall attend all meetings of the L.U. Executive Board and have a voice but no vote. The business manager shall have such authority and perform such other duties as are provided in this Constitution or may be provided for in the L.U. bylaws. Executive Board\nSec. 9. The L.U. Executive Board shall meet between regular meetings of the L.U. It shall have the power to take any action that the L.U. can take, and which should be taken prior to the next regular meeting of the L.U. Matters referred to the board by the business manager, or any of their assistants or the general chair of a Railroad System Council, shall take precedence over all other matters before the board.\nSec. 10. A quorum of the board shall consist of the majority of its members.\nSec. 11. The board shall see that all members, officers, or others who are not entitled to remain in the board meetings, shall retire after they have been heard and submitted their business to the board. When a board member is directly interested or involved in any case before the board, they shall retire.\nSec. 12. The Executive Board shall act as the trial board; hear all charges; and try all members, except officers and representatives of L.U.’s, Railroad System Councils, and System Councils, for any violation of this Constitution, or the bylaws and working rules of the L.U. (See Article XXV.) ART. 17","62"],["No board member shall sit in a case that affects their own employer or that involves a member working for the same employer. In such case, the board member shall be disqualified and the president of the L.U. shall appoint a substitute or substitutes. If the president is a member of the board and is disqualified, then the vice president shall appoint a substitute or substitutes. If the vice president is also disqualified, then the substitute or substitutes shall be named by the remaining board members. The portion of this paragraph that refers to an employer shall not apply to those L.U.’s where at least seventy-five percent (75%) of the membership is in the employ of one employer. The board may reopen and reconsider any case or cases, when it feels the facts or circumstances justify doing so, any time within thirty (30) days from the date the decision was rendered, and it shall do so when directed by the I.V.P. or I.P.\nSec. 13. The board shall submit a report of its actions and findings to each regular meeting of the L.U. for approval, except that no approval or disapproval is to be made or action taken by the L.U., nor is any discussion to be allowed when the board reports on the cases of members charged with violations of this Constitution or the bylaws and working rules of the L.U.\nSec. 14. The Executive Board shall cooperate fully with other officers and the representatives of the L.U. to the end that the interests of the L.U. and its members may be properly protected and advanced. The board shall perform such other duties as are outlined in this Constitution or as may be provided for in the bylaws of the L.U.","63","ART. 17"],["ARTICLE XVIII","DUES–ASSESSMENTS–FUNDS","Sec. 1. L.U.’s shall collect dues from members either monthly or quarterly in advance. The L.U. monthly dues shall be not less than fifty cents ($.50) in addition to applicable per capita tax and assessments due the I.O.\nSec. 2. All assessments imposed shall be charged by the F.S. against the member as regular dues and must be paid within the time required to protect the member’s continuous good standing and benefits.\nSec. 3. No assessment shall be levied by the L.U. except by a majority vote of the members present, and no assessment can be ordered upon the night of its introduction, but must be laid over for at least two (2) weeks for consideration.\nSec. 4. All disbursements must be on an order drawn by the treasurer signed by the president and recording secretary. However, no action of the L.U. is necessary for payment of regular or standing bills such as rent, salaries, and payments to the I.S.T.\nSec. 5. The funds and property of a L.U. shall be used only for such purposes as are approved by the I.P., or as are specified in this Constitution and as may be necessary to transact, properly manage, and conduct its business.\nSec. 6. The funds and property cannot be divided among the members individually, except in the form of such benefits as may be provided by the L.U. after approval of the I.P.\nSec. 7. The funds and property are for the legitimate purposes of the L.U. while five (5) members remain therein. Should a L.U. finally dissolve, its charter, books, papers, and funds shall at once be forwarded to the I.S.T. ART. 18","64"],["ARTICLE XIX","QUALIFICATIONS OF MEMBERS","Sec. 1. Any worker coming under the I.B.E.W.’s jurisdiction, of good character and not less than sixteen (16) years of age, is eligible for membership, provided they pass a satisfactory examination when required to do so by the L.U.\nSec. 2. If, after being admitted to membership, it is later found upon investigation that a member is not sufficiently acquainted with the branch or type of work on which they are engaged to earn or command the established wages, then a L.U. can, through its Executive or Examining Board or a specially appointed committee, require such member to revert to the proper apprentice grade and pay rate, to attend electrical study classes, or devote time toward becoming a competent, properly informed electrical mechanic or employee.","ARTICLE XX","ADMISSION OF MEMBERS","Sec. 1. No L.U. can admit an applicant who does not reside in, or who is not employed at the trade, in the jurisdiction of the L.U., unless the L.U. is directed to admit them by the I.P. No L.U. can admit any applicant who formerly was a member of the I.B.E.W., or who was suspended or expelled by, or indebted to any L.U., without consent of the I.S.T. and without first consulting the last L.U. of which the applicant was a member in regard to their character and record. The I.P. shall decide any case in dispute. No L.U. can admit any applicant for membership who is a member of another L.U. except as a traveler under the provisions of Article XXIII. No person may be a member of more than one L.U. at any one time. 65","ART. 19 & ART. 20"],["Sec. 2. Each applicant for membership shall fill out an application blank furnished or approved by the I.S.T. and answer all questions. The original application or a copy must be sent to the I.S.T.\nSec. 3. The acceptance of an application for membership, and the admission of the applicant into any L.U. of the I.B.E.W., constitutes a contract between the member, the L.U., and the I.B.E.W., and between such member and all other members of the I.B.E.W.\nSec. 4. Each applicant admitted, shall, in the presence of members of the I.B.E.W., repeat and sign the following obligation: “I, (name), in the presence of members of the International Brotherhood of Electrical Workers, promise and agree to conform to and abide by the Constitution and laws of the I.B.E.W. and its L.U.’s. I will further the purposes for which the I.B.E.W. is instituted. I will bear true allegiance to it and will not sacrifice its interest in any manner.” When impractical because conditions do not allow for the applicant to take the oath in the presence of members of the I.B.E.W., and with approval of the I.P., the oath may be taken in written form as follows: “I, (name), promise and agree to conform to and abide by the Constitution and laws of the I.B.E.W. and its L.U.’s. I will further the purposes for which the I.B.E.W. is instituted. I will bear true allegiance to it and will not sacrifice its interest in any manner.”\nSec. 5. The obligation card signed by the applicant shall be sent to the I.S.T. The L.U. shall have each applicant, except as provided in Sections 4 and 10 of this article, take the obligation before ART. 20","66"],["a regular meeting or outside the regular meeting in the presence of the president or the vice president or the business manager or the business manager’s designated representative or the recording secretary.\nSec. 6. Each applicant shall pay the admission fee fixed by the bylaws of the L.U. to which they apply, or such fee as approved by the I.P. and ten percent (10%) or more of such fee must accompany the application. Admission must be completed within ninety (90) days after application is made.\nSec. 7. The names of all applicants shall be read or posted at a regular meeting of the L.U. The president shall appoint a committee to pass and report upon the applications, or the Executive Board may perform this function as the L.U. may decide.\nSec. 8. If the applicant or applicants are reported upon favorably, a ballot or vote may be taken as the L.U. may decide, except as provided in Article XV. If an applicant(s) is rejected, their name(s) shall not again be proposed for membership for six (6) months, and the admission fee shall be returned to the applicant. If an applicant is rejected for membership and the reasons for rejection are found to be without just cause, the L.U. shall be directed by the I.P. to immediately accept the applicant into membership.\nSec. 9. Any candidate failing to present themselves for admission within one (1) month after their election and notification thereof, unless they give good and sufficient reasons, forfeits their admission fee and cannot again be proposed for six (6) months.\nSec. 10. Any worker or employee coming under the I.B.E.W.’s jurisdiction and residing where there is no L.U., who can qualify according to this Constitution, may become 67","ART. 20"],["a member by filling out a regular application and sending it to the L.U. having jurisdiction; and, if accepted, shall sign the obligation card and send it to the L.U. The I.S.T. may accept such an applicant directly if the I.S.T. feels there are good reasons for doing so.\nSec. 11. In the case of an organizing campaign, Sections 7, 8, and 9 of this article may be waived by the I.P.\nSec. 12. An applicant admitted into membership in any L.U., who later seeks to resign their membership, must resign in writing via delivery to the L.U. mailing address and addressed to the attention of the president or recording secretary of the L.U.","ARTICLE XXI","MEMBERS IN ARREARS","Sec. 1. No member is entitled to notice of the monthly or quarterly dues of their L.U., nor of arrearages, but must take notice when payments are due.\nSec. 2. When a member’s working card has expired, they at once, without notice, stand suspended from all L.U. benefits.\nSec. 3. Any member indebted to their L.U. for three (3) months’ dues, or having any past due indebtedness to the I.B.E.W. for per capita tax or assessments, shall stand suspended, and the L.U. may refuse to accept dues from any member who is indebted to it. Such member cannot be reinstated until all indebtedness has been paid, unless waived by the L.U. However, dues cannot be waived. (However, when any “BA” member is working under an agreement requiring monthly payment of dues, a grace period of only twenty-one (21) days—after the first of the month folART. 21","68"],["lowing the indebtedness—shall be allowed unless the grace period is extended by the L.U. involved.)\nSec. 4. Any member indebted to their L.U. for six (6) months’ full dues shall be dropped from membership by the F.S. and cannot become a member in good standing again in the I.B.E.W. except by joining as a new member. (However, when any “BA” member is working under an agreement requiring monthly payment of dues, a grace period of only twenty-one (21) days—after the first of the month following the indebtedness—shall be allowed before being dropped from membership, unless the grace period is extended by the L.U. involved.)\nSec. 5. A member who has been assessed by a L.U. trial board, who is appealing the assessment and making the required monthly payments in accordance with Article XXV,\nSection 13, retains good standing status until the appeal process in Article XXV has been exhausted.\nSec. 6. Members who are suspended forfeit all rights and previous standing in the I.B.E.W., including any pension or death benefits payable from the Pension Benefit Fund.","ARTICLE XXII","REINSTATEMENT OF MEMBERS","Sec. 1. Any member suspended for being in arrears for three (3) months, but less than six (6) months, may apply for reinstatement.\nSec. 2. Any member in arrears, if eligible for reinstatement, shall pay their L.U. all arrearages and assessments, and reinstatement fees. “A” members shall pay a reinstatement fee of ten dollars ($10.00) and “BA” members shall pay a reinstate69","ART. 22"],["ment fee of three dollars ($3.00). Half of all such fees are to be sent to the I.S.T. In addition, all “A” members shall pay a pension reinstatement fee of twenty dollars ($20.00), all of which shall be forwarded to the I.S.T. for the Pension Benefit Fund. Reinstated members shall retain their former card number. Any reinstated applicant shall be subject to the limitations imposed by this Constitution.\nSec. 3. A reinstated member shall not be entitled to any L.U. benefits until six (6) months after reinstatement.\nSec. 4. Reinstated members’ standing in the I.O. shall be the same as that of new members except as provided in Section 5 of this article.\nSec. 5. For pension purposes only, an “A” member suspended because of an arrearage in dues who is reinstated pursuant to the provisions of the Constitution, shall be restored to the continuous good standing enjoyed prior to suspension.","ARTICLE XXIII","TRAVELING CARDS","Sec. 1. Any member working in a different L.U.’s jurisdiction shall be admitted to its meeting, provided that the member presents their official receipt for dues showing they are a member in good standing and they identify themselves as the rightful owner of such receipt, but such member will have no voice or vote at such meeting, except as required by law. Any member visiting a different L.U. may be admitted to its meeting at the option of the L.U., provided that they present their official receipt for dues showing they are a member in good standing and identify themselves as the rightful owner of such receipt, but they will have no voice or vote at such meeting. ART. 23","70"],["Sec. 2. Any member desiring to transfer their membership may apply to the F.S. for a Traveling Card for a stated time not to exceed three (3) months. This card shall be null and void unless deposited in some L.U. or renewed by the L.U. granting it on or before the date of its expiration. No fraction of a month shall be recognized, and all cards must date from the first day of the month and expire on the last day of the month.\nSec. 3. If a member is in continuous good standing and not under charges, the F.S. shall grant the card without a vote of the L.U. upon payment of all dues in advance for the full time for which the card is granted.\nSec. 4. The L.U. issuing the card shall pay the I.S.T. the per capita tax for the time the card holds good. The L.U. shall be held liable for any unpaid per capita tax, premiums, assessments, or other items due the I.O. and that the F.S. neglected to collect.\nSec. 5. Traveling Cards may not be deposited in any L.U. that does not include the type of membership for which the card was issued, unless the member transfers to a type of membership covered by the L.U. In such case, the member shall be given credit for the last initiation fee they paid. Nor may a Traveling Card be deposited in a L.U. by a member of another L.U. wishing to transfer their membership until and unless that member has been accepted by the L.U. into which they wish to transfer. Each L.U. shall have full autonomy to accept or reject all requests for transfers (except as provided in Section 10).\nSec. 6. No member shall work in the jurisdiction of another L.U. until their Traveling Card has been accepted, or they receive a working card, except by consent of the I.P. in special cases, and except in cases where L.U.’s allow their members to work by agreement or understanding in the jurisdiction of each other. 71","ART. 23"],["Any member violating this provision is subject to assessment at the discretion of that L.U., but the assessment shall not exceed the wages earned by such member while the violation continued. However, any member violating the working rules of another L.U. shall be subject to such punishment as decided by the L.U.\nSec. 7. When a member is away and sends dues to their home L.U., the F.S. of the home L.U. shall notify the L.U. of the same branch of the trade in whose jurisdiction the member is located, giving the member’s name, address, and card number.\nSec. 8. A member not having five (5) years continuous good standing in the I.B.E.W. shall pay any difference in admission or initiation fee to the L.U. to which they apply. No L.U. shall require a member to pay any such difference at a greater rate than one dollar ($1.00) a day for each day they work. The L.U. may require the member to pass its examination.\nSec. 9. No member of the same branch of trade with five\n(5) years or more continuous good standing shall be required to take any examination or pay any difference in admission fee, except when they change their classification within the same branch, if the L.U. so decides. (This applies within a L.U. or when transferring to another L.U.) No member with five\n(5) years or more continuous good standing—transferring to a different branch of the trade—shall be required to pay any difference in admission fee. However, the member shall pass a practical examination if the L.U. so decides.\nSec. 10. No L.U. shall refuse to accept promptly the card of and readmit any member into their home L.U. provided they have maintained continuous good standing in the I.B.E.W. while absent from the L.U. The L.U. where a member was originally admitted into the I.B.E.W. shall be considered their home L.U. Where a L.U. or any part thereof has been amalART. 23","72"],["gamated into another L.U., that L.U. shall be considered the home L.U. When the member has changed their classification during this absence, their home L.U. is required to accept their card and change their classification back to the same classification they had when they left their home L.U. No L.U. shall collect any difference in admission fee from a member who was admitted by the L.U. and who has maintained continuous good standing in the I.B.E.W. during their absence from the L.U., except in cases where the L.U. permits a change of classification on their return to the L.U., and the L.U. has established a difference in fees between the two (2) classifications.\nSec. 11. The member’s dues shall begin the first of the month after acceptance of their card. Any dues paid in advance of this date shall be returned to them by their former L.U. less the per capita tax.\nSec. 12. Any member leaving the jurisdiction of a L.U. owing just debts to it shall be required to pay up to the rate of not less than one dollar ($1.00) for each day worked and shall pay up within six (6) months of notice or be dropped from membership. The indebtedness shall be collected by the F.S. of the L.U. in which the member has deposited their card. In no case shall a new Traveling Card be issued to such member until their indebtedness is paid.\nSec. 13. A member admitted on a Traveling Card shall not vote on questions of agreement, trouble, or wages, until six (6) months after their card has been accepted, nor shall they be permitted to vote in the L.U. election unless they have been a member in that L.U. sixty (60) days prior to the election. 73","ART. 23"],["This section shall not be applicable to members of L.U.’s affiliated with Railroad System Councils or System Councils who are employed by a single employer and who transfer between L.U.’s within the council, provided, however, any such member must have been a member in continuous good standing in one of the L.U.’s affiliated with such council for six (6) months or sixty (60) days as specified above.","ARTICLE XXIV","WITHDRAWAL CARDS— PARTICIPATING AND HONORARY","Sec. 1. Any member who becomes an electrical employer, a partner in an electrical employing concern, a general manager, or any other managerial position, or who retires from the trade, may apply to the F.S. for a withdrawal card. It shall require a majority vote at a meeting to grant such card. But the L.U. has the right to require such a member to take out a withdrawal card if it so decides.\nSec. 2. Any member receiving a Participating Withdrawal Card and desiring to maintain their standing in the I.B.E.W. shall deposit the duplicate portion of the withdrawal card in the I.O. and pay their per capita tax in advance to the I.S.T., as well as any I.O. assessments, and they shall be entitled to all benefits of the I.B.E.W. as long as they comply with its laws and maintain their continuous good standing. The Participating Withdrawal Card shall not entitle the holder to any L.U. benefits or admittance to any L.U. meeting. Upon returning to the trade, the recipient of this card shall deposit it in the L.U. which issued it. No member on participating withdrawal is entitled to notice of any payments due the I.O.\nSec. 3. Any member not desiring to maintain their standing who retires from the trade or is unemployed, or in such ART. 24","74"],["other cases as may be decided by the L.U., may be issued an Honorary Withdrawal Card provided dues are paid for the previous month or the current month if the application is made after the fifteenth (15th) of such month. Upon returning to the trade, or again becoming employed, and having complied with this article, the member shall deposit their withdrawal card in the L.U. that issued it and continue membership by paying the current month dues. No new initiation fee is necessary, except that any “A” member shall pay the two dollar ($2.00) fee as required in Article IX,\nSection 5.\nSec. 4. “BA” members not employed under the jurisdiction of the L.U. for at least a month can be shown as on honorary withdrawal without actual issuance of the card, unless the L.U. bylaws provide otherwise. Officers of the L.U. are not entitled to withdrawal status without forfeiture of their office. However, a “BA” member, shown as on honorary withdrawal or having an Honorary Withdrawal Card not exceeding two\n(2) months, may retain continuous good standing in the L.U., and eligibility for L.U. office and as delegate to the I.C., by paying dues for the months of unemployment before becoming indebted to their L.U. for three (3) months’ dues had they been employed.\nSec. 5. The validity of any withdrawal card shall be dependent upon the good conduct of the member. It can be annulled by any L.U. or by the I.P. for violation of the laws of the I.B.E.W., or the bylaws and rules of any L.U., or for working with or employing nonmembers of the I.B.E.W. to perform electrical work, or for any action of the holder detrimental to the interests of the I.B.E.W. Membership in the I.B.E.W. is automatically terminated upon annulment of any withdrawal card. 75","ART. 24"],["A member on withdrawal may be subject to charges, trial, and appropriate penalty in accordance with provisions of this Constitution.","ARTICLE XXV","MISCONDUCT, OFFENSES, AND PENALTIES","Sec. 1. Any member may be penalized for committing any one or more of the following offenses:\n(a) Violation of any provision of this Constitution and the rules herein, or the bylaws, working agreements, or rules of a L.U.\n(b) Having knowledge of the violation of any provision of this Constitution, or the bylaws or rules of a L.U., yet failing to file charges against the offender or to notify the proper officers of the L.U.\n(c) Obtaining membership through fraudulent means or by misrepresentation, either on the part of the member or others interested.\n(d) Engaging in activities designed to bring about a withdrawal or secession from the I.B.E.W. of any L.U. or of any member or group of members, or to cause dual unionism or schism within the I.B.E.W.\n(e) Engaging in any act or acts that are contrary to the member’s responsibility toward the I.B.E.W., or any of its L.U.’s, as an institution, or which interfere with the performance by the I.B.E.W. or a L.U. with its legal or contractual obligations.\n(f) Working for, or on behalf of, any employer, employer supported organization, or other union, or the representatives of any of the foregoing, whose position is adverse or detrimental to the I.B.E.W. ART. 25","76"],["(g) Wronging a member of the I.B.E.W. by any act or acts (other than the expression of views or opinions) causing them physical or economic harm.\n(h) Entering or being present at any meeting of a L.U., or its Executive Board, or any committee meeting while intoxicated, or drinking intoxicants in or near any such meeting, or carrying intoxicants into such meeting.\n(i) Disturbing the peace or harmony of any L.U. meeting or meeting of its Executive Board, using abusive language, creating or participating in any disturbance, drinking intoxicants, or being intoxicated, in or around the office or headquarters of a L.U.\n(j) Making known the business of a L.U., directly or indirectly, to any employer, employer supported organization, or other union, or to the representatives of any of the foregoing.\n(k) Fraudulently receiving or misappropriating any moneys of a L.U. or the I.B.E.W.\n(l) Causing or engaging in unauthorized work stoppages or strikes or other violation of the laws and rules of the I.B.E.W. or its L.U.’s.\n(m) Willfully committing fraud in connection with voting for candidates for L.U. office, or for delegates to conventions. (It shall not be considered an offense when a L.U. mails out or posts in a conspicuous place a sample of the official ballot to be used in any L.U. election. However, the sample shall not carry any markings of any kind except that the word “SAMPLE” shall appear prominently across the face of the ballot. The sample shall otherwise be an exact duplicate of the official ballot to be used.) 77","ART. 25"],["(1) Notwithstanding the above, and in addition to the sample ballot, a L.U. may distribute an official publication which shall list all candidates for L.U. office, together with a factual record of activities within the L.U., committee assignments performed, offices held and experience gained for and on behalf of the L.U. This publication shall be prepared under the supervision of the duly designated L.U. Election Board.\n(2) The distribution of this official L.U. publication, properly prepared as set forth above, shall not be in violation of\nArticle XVI, Section 20.\n(n) Soliciting advertising for yearbooks, programs, etc., when the name of a L.U. or the I.B.E.W., or the names or pictures of L.U. or International Officers appear in such matter without consent of the I.P. Any member, any officer, or representative of any L.U., or other organization coming under the I.B.E.W.’s jurisdiction, shall be held liable for allowing individuals or agencies to solicit such advertising without consent of the I.P. or for in any way violating this provision.\n(o) Failure to install or do their work in a safe, workmanlike manner, or leaving work in a condition that may endanger the lives or property of others, or proving unable or unfit mentally, to learn properly their trade.\n(p) Causing a stoppage of work because of any alleged grievance or dispute without having consent of the L.U. or its proper officers.\n(q) Working for any individual or company declared in difficulty with a L.U. or the I.B.E.W., in accordance with this Constitution.\n(r) Willfully committing fraud in connection with obtaining or furnishing credentials for delegates to the I.C. or being connected with any fraud in voting during the I.C. ART. 25","78"],["(s) Allowing another person to use, or altering in any manner, their membership card, receipt, or other evidence of membership in the I.B.E.W.\n(t) Engaging in any conduct that is harassing, bullying, or discriminatory against any member, while in the workplace or performing work duties, or at union facilities or functions, because of the member’s race, color, religion, age, creed, national origin, sex, gender including gender identity or expression, sexual orientation, veteran status, disability or other legally protected class, provided that if an employer is investigating such conduct, notwithstanding any other provision in this article, the processing of charges filed under this subsection be held in abeyance until the conclusion of the employer’s investigation. Any member convicted of any one or more of the above named offenses may be assessed or suspended, or both, or expelled. If an officer or representative of a L.U. is convicted of any one or more of the above named offenses, they may be removed from office or position, or assessed or suspended, or both, or expelled. If a member, or officer or representative of a L.U., is assessed and fails to pay the assessment, a lawsuit may be filed to collect the unpaid assessment. Charges and Trials\nSec. 2. All charges, except against officers and representatives of L.U.’s, shall be heard and tried by the L.U. Executive Board, which shall act as the trial board in accordance with\nArticle XVII. A majority vote of the board shall be sufficient for decision and sentence. 79","ART. 25"],["(This section shall not be construed to conflict with the power of the I.P. or the I.E.C. to take action in certain cases as provided in Articles IV and VIII.)\nSec. 3. All charges against a member or members must be presented in writing; signed by the charging party; and specify the section or sections of this Constitution, the bylaws, rules, or working agreement allegedly violated. The charges must state the act or acts considered to be in violation, including approximate relevant dates or places.\nSec. 4. Charges against members must be submitted to the R.S. of the L.U. in whose jurisdiction the alleged act or acts took place within sixty (60) days of the time the charging party first became aware, or reasonably should have been aware, of the alleged act or acts. The charges shall be read out but not discussed at the next regular meeting of the L.U. following the filing of the charges. The R.S. shall immediately send a copy of such charges to the accused member at their last known address together with written notice of the time and place they shall appear before the trial board.\nSec. 5. The trial board shall proceed with the case not later than forty-five (45) days from the date the charges were read at the L.U. meeting or Executive Board meeting. The board shall grant a reasonable delay to the accused when it feels the facts or circumstances warrant such a delay. The accused shall be granted a fair and impartial trial. The accused must, upon request, be allowed an active I.B.E.W. member in good standing to represent them.\nSec. 6. When the trial board has reached a decision, it shall report its findings, and sentence, if any, to the next regular meeting of the L.U. Such report or action of the board shall not be discussed or acted upon by the L.U. The action of the ART. 25","80"],["trial board shall be considered the action of the L.U., and the report of the board shall conclude the case, or cases, except for the accused having the right to appeal to the I.V.P., then to the I.P., then to the I.E.C., and then to the I.C. However, the board may reopen and reconsider any case or cases when it feels the facts or circumstances justify doing so any time within thirty\n(30) days from the date the decision was rendered. The board shall reopen any case or cases when directed to do so by the I.V.P. or the I.P.\nSec. 7. If the accused willfully fails to stand trial—or attempts to evade trial—the trial board shall proceed to hear and determine the case just as though the accused were present. Trials of Officers and Representatives\nSec. 8. All charges against an officer, Examining Board member, steward, or representative of a L.U. must be presented in writing; signed by the charging party; and specify the section or sections of this Constitution, the bylaws, rules, or working agreement violated. The charges must state the act or acts considered to be in violation, including approximate relevant dates and places; and must be made within sixty (60) days of the time the charging party first became aware, or reasonably should have been aware, of the alleged act or acts. Such charges must be filed with the I.V.P. in whose district the L.U. is located where the alleged act or acts took place, or as directed by the I.P., should more than one district be involved. (This section shall not be construed to conflict with the power of the I.P. or the I.E.C. to take action in certain cases as provided in Articles IV and VIII.)\nSec. 9. The I.V.P. shall pass upon and determine such cases, with the accused having the right of appeal to the I.P., then to 81","ART. 25"],["the I.E.C., then to the I.C. Any such appeal, to be recognized, must be made within thirty (30) days from the date of the decision appealed from. No appeal from the I.V.P. shall suspend operation of any decision.\nSec. 10. The I.V.P. may require that all evidence, testimony, or statements be submitted to the I.V.P. in writing for review, decision, and sentence (if any) or they may hear the case in person. If the I.V.P. so decides, they may appoint a referee, who may or may not be a member, to take testimony and report to the I.V.P.\nSec. 11. The I.V.P. may reopen any case or cases when there is new evidence or testimony, facts, or circumstances, which they feel are sufficient to justify such being done. Appeals\nSec. 12. Any member penalized or otherwise disciplined by any L.U. trial board may appeal to the I.V.P. any time within forty-five (45) days after the date of the action of the L.U. trial board. A charging party may not appeal a L.U. trial board decision. A copy of any appeal must be filed with the L.U.\nSec. 13. No appeal for revocation of an assessment shall be recognized unless the member has first paid the assessment, which they can do under protest. When the assessment exceeds fifty dollars ($50.00), payments of not less than forty dollars ($40.00) in monthly installments must be made until the assessment is paid or until a final decision on the appeal is made, whichever occurs first. The first monthly installment must be made within fifteen (15) days from the date of the decision rendered and monthly installments continued thereafter or the appeal will not be considered. A member who has been ART. 25","82"],["assessed by a L.U. trial board, who is appealing the assessment and making the required monthly payments in accordance with this section, retains their good standing status until the appeal process in this article has been exhausted.\nSec. 14. When a decision has been rendered by the I.V.P., it shall become effective immediately.\nSec. 15. No appeals from decisions of the I.V.P., or from the I.P., or from the I.E.C., shall be recognized unless the party or parties appealing have complied with the decision from which they have appealed. However, this section may be waived by the party making the decision if good and sufficient reasons are furnished and they are requested to do so.\nSec. 16. Appeals to the I.P., the I.E.C., and the I.C., to be considered, must be made within thirty (30) days from the date of the decision appealed from. (Appeals to the I.E.C. and to Conventions must be filed with the I.S.T.) If no appeal is made within thirty (30) days from the date that any decision is rendered, such decision shall be considered final. A charging party may not appeal a decision of the I.V.P., the I.P., or the I.E.C.\nSec. 17. When an appeal is taken above the I.V.P., only the evidence submitted in the original case of appeal shall be considered. In cases where parties claim they have new and important evidence affecting a case in which a decision has been rendered, they may submit this within thirty (30) days to the authority who rendered the first decision, with a request that the case be reopened. Such authority shall decide whether the matter submitted justifies reopening the case. 83","ART. 25"],["ARTICLE XXVI","JURISDICTION","Sec. 1. The charter issued this organization by the American Federation of Labor states that it was granted “for the purpose of a thorough organization of the trade.” There must be a systematized knowledge of the science of electricity in all of its various applications of electron transfer and electromagnetism. This requires a thorough understanding of the many means of production, transference, control, and utilization of electricity and of the foundation or preparatory work to be performed. It is quite necessary, therefore, that the jurisdiction of the I.B.E.W. be recognized as one covering:\n(a) The manufacture, assembling, construction, installation or erection, repair or maintenance of all materials, equipment, apparatus, and appliances required in the production of electricity and its effects.\n(b) The operation, inspection, and supervision of all electrical equipment, apparatus, appliances, or devices by which the energy known as electricity is generated, utilized, and controlled.\n(c) The manufacture, assembling, construction, installation or erection, repair or maintenance of all materials, equipment, apparatus, and appliances required in the transmission of data, voice, sound, video, and other emerging technologies (including fiber optics, high speed data cable, etc.).\nSec. 2. Electrical workers shall be organized under five\n(5) general branches of the I.B.E.W., namely: Outside and Utility Workers; Inside Electrical Workers; Communications Workers; Railroad Electrical Workers; and Electrical Manufacturing Workers. ART. 26","84"],["Sec. 3. Keeping in mind progress for the I.B.E.W., and that all electrical work be done by its members, it is impractical to classify or divide jurisdiction of work in every detail between the various branches in this organization to meet all situations in all localities. Therefore, the classifications and divisions outlined below are necessarily of a general nature, and L.U.’s whose jurisdiction with other L.U.’s of the I.B.E.W., or whose agreements are harmonious and conducive to the progress of the I.B.E.W., shall not be disturbed. But when harmony and progress do not prevail, or when disputes arise, the I.P. shall determine what L.U. will do certain work or jobs, consistent with the progress and best interests of the I.B.E.W. in obtaining and controlling the work in question. Outside and Utility Workers\nSec. 4. These shall include: foremen, linemen, electrical rail grinders, groundmen, and helpers; outside electrical inspectors, cable splicers, technicians, trimmers, maintenance men, and clerical workers; aerial and underground cable men and combination trouble men working for distributing companies; load dispatchers, metermen, station attendants, and switchboard operators in lighting and power stations; telephone switchboard operators and trouble men working for distributing companies; fire and police operators, maintenance and battery men, signalmen, and electrical layout men; and operators of electrical apparatus when generating, furnishing, or supplying electricity. All employees of utility employers generating or producing or transmitting or distributing electricity, gas, or water. They are to have jurisdiction over the following: The operation, maintenance, and repair of equipment owned or operated by utility employers; all electrical construc85","ART. 26"],["tion work outside of isolated plants and the property lines of any given property, but not electric signs, and not street electrical decorations, except when messenger or guy wire is necessary for support and when fed and controlled from the street. Series arc lamps and wiring when fed and controlled from the street; all line work consisting of wood, concrete, or metal (or substitutes therefor) poles or towers, including wires, cables, or other apparatus supported therefrom; and line work in public, private, or amusement parks. All work necessary to the assembling, installation, erection, operation, maintenance, repair, control, inspection, and supervision of all electrical apparatus, devices, wires, cables, supports, insulators, conductors, ducts, and raceways when part of distributing systems outside of buildings, railroads, and outside the directly related railroad property and yards; installing and maintaining the catenary and trolley work on railroad property and bonding of rails; all underground ducts and cables when they are installed by and are part of the system of a distributing company, except in power stations during new construction, including ducts and cables to adjacent switch racks or substations; and all outdoor substations and electrical connections up to and including the setting of transformers and connecting of the secondary buses thereto. Renewable electrical energy sources such as solar photovoltaic, geothermal, wind, biomass, wave, etc., and other distributed energy installations such as fuel cells, microturbines, etc. Inside Electrical Workers\nSec. 5. These shall include: wiremen; technicians; fixture men; crane men; crane repair men; signal men; load dispatchART. 26","86"],["ers; trouble men; switchboard operators and erectors; operators of electrical apparatus when generating, supplying, or furnishing electricity for other than distributing companies; inside cable splicers; and picture machine operators when the machines are used for educational or advertisement purposes other than theatrical. Inspectors, shop men, bridge operators, crane operators, meter testers and installers, inside battery men, fire and burglar alarm installers and repair men, marine electrical workers, glass tube benders, and pumpers. They shall have jurisdiction over the following: All electrical signs; all street electrical decorations when no messenger or guy wire is necessary for support; installation, construction, inspection, operation, maintenance, and repair of all electrical work in isolated plants and within property lines of any given property, and beginning at the secondary side of the transformer, except line work consisting of poles and towers, including wires or cables and other apparatus supported therefrom and except all outdoor substations as defined in Section 4 hereof. When aerial wires or cables are used to provide electric current for buildings or structures within the property lines of any given property, the inside men’s jurisdiction shall start immediately after the first point of attachment of such aerial wires or cables to such buildings or structures. Renewable electrical energy sources such as solar photovoltaic, geothermal, wind, biomass, wave, etc., and other distributed energy installations such as fuel cells, microturbines, etc. Communications Workers\nSec. 6. These shall include the following divisions and classifications: 87","ART. 26"],["(a) Radio, television, and recording engineers, technicians, operators, installers, inspectors, maintenance and repairmen and service men engaged in the application of electricity to the transmission and transference of voice, sound, and vision for commercial, educational, and entertainment purposes, excepting employees of common carrier companies. They shall have jurisdiction over the following work: The installation, operation, inspection, maintenance, repair, and service of radio, television, recording, voice, sound, and vision production and reproduction apparatus, equipment, and appliances used for domestic, commercial, educational, and entertainment purposes.\n(b) Telephone and other workers, employed by common carrier communications companies, engaged in the erection, installation, operation, maintenance, repair, and service work associated with telephone and intercommunication electrical apparatus used in the transmission, transference, production, and reproduction of voice, sound, and vision in the public or private communications services supplied by common carriers. They shall have jurisdiction over the following work: The erection, installation, operation, maintenance, repair, and service of such telephone and intercommunication facilities, beginning at the first point of distribution or the first terminal inside of building or property lines. Railroad Electrical Workers\nSec. 7. Railroad electrical workers are those employed by railroad companies, including wiremen; technicians; fixture men; armature winders; meter men; electrical inspectors; switchboard operators; generator, motor, and substation attendants; electric crane operators; cable splicers; signal ART. 26","88"],["men and signal maintainers; power and telephone linemen and repairmen; ground men; electrical rail grinders; rail bonders; electrical bridge operators; battery men; radio and telecommunications workers; inside and outside electrical maintenance workers; and all other electrical workers employed by railroad companies. They shall have jurisdiction over all electrical and communications work on the property or right-of-ways owned or operated by the railroad companies. It is hereby provided, however, that under no circumstances shall they do any construction or reconstruction work where building trades mechanics are doing work in connection with it. Any dispute will be referred to the I.P. for decision. Electrical Manufacturing Workers\nSec. 8. These shall include: All employees of companies engaged in the manufacture of products, components, equipment, apparatus, machines, devices, and appliances used in the production, transmission, conversion, control, distribution, measurement, and utilization of electricity. They shall have jurisdiction over the following: All work performed by such employees in the manufacture, testing, rebuilding, and repair of these products on the premises of the company.\nSec. 9. All government workers may be organized under any of the above general branches of the I.B.E.W., as stated in Section 2.","89","ART. 26"],["ARTICLE XXVII","AMENDMENTS TO THIS CONSTITUTION","Sec. 1. This Constitution and the rules herein can be amended in three ways:\n(a) By referendum, on petition of fifteen (15) L.U.’s of which no two (2) L.U.’s may be from the same state or province. Petitions may be submitted at any time; however, in convention years, all petitions for referendum must be received prior to March 1st. All petitions must be submitted to the I.S.T. Proposed amendments, before being submitted by the I.S.T. for vote, must have the approval of the I.E.C. A vote on any proposal taken by referendum shall be returned to the I.S.T. by each L.U. voting, within sixty (60) days from the date submitted. A majority of those voting shall be necessary to sustain any proposal. (L.U.’s may cast the vote of their members, if they so decide.) After receiving from the L.U.’s a record of votes cast for or against any proposal, the I.S.T. shall prepare for publication in the next issue of the I.B.E.W.’s official publication a report of the exact votes for and against the proposed amendment. Amendments adopted by referendum shall become effective thirty (30) days after adoption.\n(b) If the I.E.C. deems an amendment is necessary, it may have the I.S.T. submit the same to the L.U.’s for vote.\n(c) By the majority vote represented at a regular session of the I.C., amendments adopted by the I.C. shall become effective thirty (30) days after adoption.\n(d) If circumstances beyond the control of the I.B.E.W. would make it impracticable, impossible, inadvisable, or unsafe to conduct the business of the I.B.E.W. in accordance with this Constitution, including the conduct of the I.C., the I.E.C. shall have the authority to suspend and/or amend provisions of this Constitution on a temporary basis, as necessary in the ART. 27","90"],["judgment of the I.E.C. and in consultation with the I.P. and the I.S.T., to enable the business of the I.B.E.W. to continue.\nSec. 2. The I.P. shall appoint a Law Committee consisting of eleven (11) delegates elected to the I.C., at least one from each I.V.P. district. These shall meet in the I.O. fifteen (15) days prior to the opening of the I.C. This committee shall consider all proposed amendments to be submitted to the I.C., and the committee shall have a published report ready for the first day’s session of the I.C. Only proposed amendments and resolutions approved by L.U.’s and recommendations of International Officers shall be considered. All amendments and resolutions approved by L.U.’s must be submitted to the I.S.T. forty-five (45) days prior to the opening of the I.C. Amendments and resolutions recommended by the International Officers may be submitted to the I.S.T. any time prior to the opening of the I.C.\nSec. 3. If any section of this Constitution or part thereof should be held inoperative or invalid by a tribunal of competent jurisdiction, the remainder of this Constitution, or the application of said section or part thereof to persons and circumstances, other than those to which it has been held invalid, shall not be affected thereby. The I.E.C. shall have the authority to suspend the operation of such invalid section or part thereof in the event it is declared inoperative or invalid by a tribunal of competent jurisdiction. It is further authorized in those circumstances to substitute an appropriate and legal section for the invalid or inoperative section. The said revised section shall be reported to the next succeeding I.C. for its approval or disapproval. The I.E.C. is also empowered to direct the I.S.T. in compiling and editing the new Constitution to make such changes as are necessary to correlate the subject matter. 91","ART. 27"],["Sec. 4. This Constitution was adopted in St. Louis, Mo., Nov.\n1891. It was amended in Chicago, Ill., Nov. 1892; Cleveland, Ohio, Nov. 1893; Washington, D.C., Nov. 1895; Detroit, Mich., Nov. 1897; Pittsburgh, Pa., Oct. 1899; St. Louis, Mo., Oct. 1901; Salt Lake City, Utah, Sept. 1903; Louisville, Ky., Sept. 1905; Chicago, Ill., Sept. and Oct. 1909; Rochester, N.Y., Sept. 1911; Boston, Mass., Sept. 1913; St. Paul, Minn., Sept. and Oct. 1915; by referendum in Feb. 1916; Atlantic City, N.J., Sept. 1917; and by referendum in April 1918 and in March\n1919. It was again amended in New Orleans, La., Sept. 1919; St. Louis, Mo., Sept. and Oct. 1921; Montreal, Quebec, Aug. 1923; Seattle, Wash., Aug. 1925; Detroit, Mich., Aug. 1927; Miami, Fla., Sept. 1929; and by referendum in March 1930. It was altered, amended, and revised in Washington, D.C., July 1930 and amended by referendum in April 1931, March 1933, March 1935, May 1935, July 1935, March 1937, and Dec. 1940. It was amended in St. Louis, Mo., Oct. 1941, and by referendum in Sept. 1943 and Dec. 1943. It was amended in San Francisco, Calif., Sept. 1946; and by referendum in April 1947 and July 1947. It was again amended in Atlantic City, N.J., Sept. 1948; Miami, Fla., Oct. 1950; and by referendum in June 1951, Jan. 1952, and Oct. 1952. It was further amended in Chicago, Ill., Aug. and Sept. 1954; and by referendum in July 1955, Nov. 1955, and Aug. 1957. It was amended in Cleveland, Ohio, Sept. and Oct. 1958. Amended March 1959 by the Executive Council as authorized by the 1958 Convention. It was amended in Montreal, Quebec, Sept. 1962; St. Louis, Mo., Sept. 1966; and Seattle, Wash., Sept. 1970. Amended June 1972 by the Executive Council as authorized in Seattle, Wash., Sept. 1970. Amended in Kansas City, Mo., Sept. 1974. Amended in Atlantic City, N.J., Oct. 1978; amended April 1981 by the Executive Council; amended in Los Angeles, Calif., Sept. 1982; and amended June 1985 by the Executive ART. 27","92"],["Council. Amended in Toronto, Ontario, Sept. 1986; amended June 1988 by the Executive Council. Amended in St. Louis, Mo., Oct. 1991. Amended in Philadelphia, Pa., Sept. 1996. Select Committee recommendations adopted by referendum in March 1998. Amended in San Francisco, Calif., Sept.\n2001. Amended in Cleveland, Ohio, Sept. 2006. Amended in Vancouver, British Columbia, Sept. 2011. Amended in St. Louis, Mo., Sept. 2016. Amended by I.E.C. proposed amendment submitted to vote of local unions, April 2021. Amended in Chicago, Ill., May 2022.","93","ART. 27"],[],["INDEX","A Abbreviations for Names Admissions Fees","of Members Affiliation of L.U.’s With Other Bodies Agreements Between L.U.’s and Employers National—Power of I.P. to Enter Into Alternates to I.B.E.W. Convention Amalgamation of Local Unions Amendments to Constitution By I.C. Vote By I.E.C. Recommendation","By Referendum Appeals Members from L.U. to I.V.P. Members or L.U. from I.V.P. to","I.P., or I.E.C., or I.C. Apprentices Arrears Local Union in Members in","Assessment L.U. Payment by Members Penalties Attorney—For I.B.E.W. Audit—Yearly","B Beneficiaries Benefits Death","95","Page","Article","Section","1–2","I","4","36 67 65–68 44","XII XX XX XV","1–3 6 1–11 4","44–45 19 5–7 39 90–93 90 40 90 90","XV IV II XIII XXVII XXVII VIII XXVII XXVII","6, 9–10 3(l) 10–11 3 1–4 1(c) 8 1(b) 1(a)","82–83","XXV","12–14","83 46–47","XXV XV","15–17 14","37 36–37 68–69","XII XII XXI","7
