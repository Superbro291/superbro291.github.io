 – Officers of Local Unions","page":61},{"label":"Article XVII – Duties of Local Union Officers","page":66},{"label":"Article XVIII – Dues–Assessments–Funds","page":74},{"label":"Article XIX – Qualifications of Members","page":75},{"label":"Article XX – Admission of Members","page":75},{"label":"Article XXI – Members in Arrears","page":78},{"label":"Article XXII – Reinstatement of Members","page":79},{"label":"Article XXIII – Traveling Cards","page":80},{"label":"Article XXIV – Withdrawal Cards—Participating and Honorary","page":84},{"label":"Article XXV – Misconduct, Offenses, and Penalties","page":86},{"label":"Article XXVI – Jurisdiction","page":94},{"label":"Article XXVII – Amendments to This Constitution","page":100},{"label":"Index (A–Z topics)","page":105}]}]</script>
<script>
const OFFLINE = false;
const WEB = true;
const DOCS = JSON.parse(document.getElementById('data').textContent);
const BY = Object.fromEntries(DOCS.map(d => [d.id, d]));
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SUGGEST = ['overtime','per diem','travel','holiday','shift','steward','referral','show up','foreman','grievance'];

// ---------- text helpers ----------
const fold = s => s.toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ');
function terms(q){
  q = fold(q).trim(); if(!q) return [];
  const out=[]; q.replace(/"([^"]+)"|(\S+)/g,(m,a,b)=>{ const t=(a||b).trim(); if(t) out.push(t); });
  return [...new Set(out)];
}
// multi-word search: use the exact phrase when it appears anywhere, otherwise require every word
function smartTerms(q){
  const p=fold(q).trim().replace(/"/g,'');
  if(p.includes(' ') && !/"/.test(q) && DOCS.some(d=>d.idx.some(t=>t.includes(p)))) return [p];
  return terms(q);
}
function termRe(ts){
  if(!ts.length) return null;
  const parts = ts.slice().sort((a,b)=>b.length-a.length).map(t =>
    t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['’‘]").replace(/"/g,'["“”]').replace(/ /g,'\\s+'));
  return new RegExp(parts.join('|'),'gi');
}
function highlight(text, re){
  if(!re) return esc(text);
  let out='', last=0; re.lastIndex=0; let m;
  while((m=re.exec(text))){ if(!m[0].length){re.lastIndex++;continue;}
    out+=esc(text.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>'; last=m.index+m[0].length; }
  return out+esc(text.slice(last));
}
const pretty = t => t.replace(/^[\uf0a7\uf0b7\uf0d8\uf076\uf0fc]\s*/gm,'▪ ').replace(/^o\s/gm,'◦ ');
const isHead = t => t.length<90 && (/^(ARTICLE|Article)\s+[IVXLC\d]+\b/.test(t) || (/[A-Z]{3}/.test(t) && t===t.toUpperCase()));

// search index: folded text per page
for(const d of DOCS){ d.idx = d.pages.map(p => fold(p.join(' '))); }

function searchAll(q){
  const ts=smartTerms(q); if(!ts.length) return null;
  const res=[];
  for(const d of DOCS){
    const hits=[];
    d.idx.forEach((txt,i)=>{ if(ts.every(t=>txt.includes(t))) hits.push(i); });
    if(hits.length) res.push({d,hits});
  }
  // search results: PLA first (it overrides the CBA on the Micron job), then its travel pay change, then the rest
  const ORDER=['pla','travel-pay','cba','veca','bylaws','constitution'];
  res.sort((a,b)=>ORDER.indexOf(a.d.id)-ORDER.indexOf(b.d.id));
  return {ts,res};
}
function snippet(d, i, ts){
  const raw = d.pages[i].join(' ').replace(/\s+/g,' ');
  const f = fold(raw);
  let pos = -1; for(const t of ts){ const p=f.indexOf(t); if(p>=0 && (pos<0||p<pos)) pos=p; }
  const a=Math.max(0,pos-70), b=Math.min(raw.length,pos+150);
  return (a>0?'…':'')+raw.slice(a,b)+(b<raw.length?'…':'');
}

// ---------- home ----------
function renderList(){
  const groups=[]; for(const d of DOCS){ let g=groups.find(x=>x.name===d.group); if(!g) groups.push(g={name:d.group,docs:[]}); g.docs.push(d); }
  $('#list').innerHTML = groups.map(g=>`<div class="group"><h2>${esc(g.name)}</h2><div class="cards">${
    g.docs.map(d=>`<a class="card" href="#${d.id}"><span class="tab"></span><span><div class="t">${esc(d.title)}</div><div class="s">${esc(d.sub)} · ${d.pages.length} pages</div></span><span class="arrow">›</span></a>`).join('')
  }</div></div>`).join('');
  $('#chips').innerHTML = SUGGEST.map(s=>`<button type="button" class="chip">${esc(s)}</button>`).join('');
  $('#foot').textContent = OFFLINE
    ? 'Offline copy. Works with no signal. Text was copied out of the original PDFs; if anything looks off, check the original.'
    : 'Text was copied out of the original PDFs so it can be searched. If anything looks off, open the original PDF from inside the document.';
}
let shown={};
function renderResults(){
  const q=$('#gq').value; const r=searchAll(q);
  $('#gclear').classList.toggle('hidden',!q);
  if(!r){ $('#results').classList.add('hidden'); $('#list').classList.remove('hidden'); $('#ghint').classList.remove('hidden'); return; }
  $('#ghint').classList.add('hidden'); $('#list').classList.add('hidden'); $('#results').classList.remove('hidden');
  const re=termRe(r.ts); const total=r.res.reduce((n,x)=>n+x.hits.length,0);
  if(!total){ $('#results').innerHTML=`<p class="rsum">No pages contain “${esc(q.trim())}”.</p><p class="hint">Try fewer words, or a shorter word (for example “travel” instead of “traveling”).</p>`; return; }
  $('#results').innerHTML = `<p class="rsum">Found on ${total} page${total>1?'s':''} in ${r.res.length} document${r.res.length>1?'s':''}</p>` +
    r.res.map(({d,hits})=>{
      const n=shown[d.id]||5;
      return `<div class="rgroup"><h3>${esc(d.title)} <span class="count">· ${hits.length} page${hits.length>1?'s':''}</span></h3>${d.id==='pla'?'<div class="prio">Takes priority over the CBA</div>':''}${
        hits.slice(0,n).map(i=>`<button type="button" class="hit" data-doc="${d.id}" data-page="${i}"><span class="pg">Page ${i+1}</span>${highlight(snippet(d,i,r.ts),re)}</button>`).join('')
      }${hits.length>n?`<button type="button" class="more" data-more="${d.id}">Show ${hits.length-n} more in this document</button>`:''}</div>`;
    }).join('');
}

// ---------- document ----------
let cur=null, marks=[], mi=-1;
function openDoc(id, page, q){
  const d=BY[id]; if(!d) return showHome();
  cur=d; $('#home').classList.add('hidden'); $('#doc').classList.remove('hidden');
  document.title = d.title+' · Local 291 Contract Library';
  $('#dq').value = q||'';
  const toc = d.outline.length ? `<details class="toc"><summary>Jump to a section (${d.outline.length})</summary><ol>${
    d.outline.map(o=>`<li><button type="button" data-goto="${o.page-1}"><span>${esc(o.label)}</span><span class="p">p. ${o.page}</span></button></li>`).join('')}</ol></details>` : '';
  const acts = WEB ? `<div class="actions"><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="pdfs/${d.pdf}" download>Download original PDF</a></div>` : (dl ? pdfBtn(d) : '');
  $('#dbody').innerHTML = `<div class="dhead"><div class="g">${esc(d.group)}</div><h1>${esc(d.title)}</h1><div class="s">${esc(d.sub)} · ${d.pages.length} pages</div>
    ${d.scanned?'<div class="note">This one is a scanned copy. The text was read by computer, so a word here and there may be off. The original PDF is the official version.</div>':''}
    ${acts}${toc}</div><div id="pages"></div>`;
  renderPages();
  window.scrollTo(0,0);
  if(page!=null) requestAnimationFrame(()=>{ const first=[...marks].findIndex(m=>m.closest('.page').dataset.i==page); if(first>=0) setMark(first); else goPage(page); });
}
function renderPages(){
  const d=cur, ts=smartTerms($('#dq').value), re=termRe(ts);
  $('#dclear').classList.toggle('hidden',!$('#dq').value);
  $('#pages').innerHTML = d.pages.map((p,i)=>`<section class="page" id="pg-${i}" data-i="${i}"><div class="plabel">Page ${i+1} of ${d.pages.length}</div>${
    p.length ? p.map(t=>{ t=pretty(t); return `<p${isHead(t)?' class="h"':''}>${highlight(t,re).replace(/→\s+page (\d+)$/,(m,n)=>`<button type="button" class="pjump" data-goto="${n-1}">→ page ${n}</button>`)}</p>`; }).join('') : '<p class="empty">(This page is blank or is a picture with no text.)</p>'
  }</section>`).join('');
  marks=[...document.querySelectorAll('#pages mark')]; mi=-1;
  $('#dnav').classList.toggle('hidden',!ts.length);
  $('#dcount').textContent = ts.length ? (marks.length ? `${marks.length} match${marks.length>1?'es':''} · tap ▼ to step through` : 'No matches in this document') : '';
}
function setMark(i){
  if(!marks.length) return; mi=(i+marks.length)%marks.length;
  marks.forEach(m=>m.classList.remove('on')); const m=marks[mi]; m.classList.add('on');
  const y=m.getBoundingClientRect().top+window.scrollY-($('.bar').offsetHeight+40);
  window.scrollTo({top:y});
  $('#dcount').textContent=`Match ${mi+1} of ${marks.length} · page ${+m.closest('.page').dataset.i+1}`;
}
function goPage(i){ const el=document.getElementById('pg-'+i); if(el){ const y=el.getBoundingClientRect().top+window.scrollY-($('.bar').offsetHeight+8); window.scrollTo({top:y}); } }
function showHome(){ cur=null; $('#doc').classList.add('hidden'); $('#home').classList.remove('hidden'); document.title='Local 291 Contract Library'; }

// ---------- routing ----------
let pending=null;
function route(){
  const h=location.hash.slice(1);
  if(BY[h]){ const p=pending; pending=null; if(!cur||cur.id!==h||p) openDoc(h, p?p.page:null, p?p.q:''); }
  else showHome();
}
function go(id, page, q){
  pending={page,q};
  if(location.hash==='#'+id) route(); else location.hash=id;
}
window.addEventListener('hashchange',route);

// ---------- events ----------
let t1; $('#gq').addEventListener('input',()=>{ clearTimeout(t1); shown={}; t1=setTimeout(renderResults,180); });
$('#gform').addEventListener('submit',e=>{ e.preventDefault(); $('#gq').blur(); renderResults(); });
$('#gclear').addEventListener('click',()=>{ $('#gq').value=''; renderResults(); $('#gq').focus(); });
$('#chips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(b){ $('#gq').value=b.textContent; renderResults(); }});
$('#results').addEventListener('click',e=>{
  const h=e.target.closest('.hit'); if(h){ go(h.dataset.doc,+h.dataset.page,$('#gq').value); return; }
  const m=e.target.closest('.more'); if(m){ shown[m.dataset.more]=(shown[m.dataset.more]||5)+20; renderResults(); }
});
$('#back').addEventListener('click',()=>{ location.hash='home'; showHome(); window.scrollTo(0,0); });
let t2; $('#dq').addEventListener('input',()=>{ clearTimeout(t2); t2=setTimeout(renderPages,250); });
$('#dform').addEventListener('submit',e=>{ e.preventDefault(); $('#dq').blur(); renderPages(); if(marks.length) setMark(0); });
$('#dclear').addEventListener('click',()=>{ $('#dq').value=''; renderPages(); });
$('#next').addEventListener('click',()=>setMark(mi+1));
$('#prev').addEventListener('click',()=>setMark(mi-1));
$('#dbody').addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]'); if(g){ goPage(+g.dataset.goto); return; }
  const p=e.target.closest('[data-pdf]'); if(p) savePdf(BY[p.dataset.pdf]);
});

// ---------- downloads ----------
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.add('hidden'),4000); }
let dl=null;
const pdfBtn = d => `<div class="actions"><button type="button" class="btn" data-pdf="${d.id}">Download original PDF</button></div>`;
async function savePdf(d){
  if(!dl){ toast('Downloads are not available in this view.'); return; }
  try{
    toast('Getting the PDF…');
    const r=await fetch('pdfs/'+d.pdf); if(!r.ok) throw new Error('fetch');
    await dl.save({filename:d.pdf, data:await r.blob()}); toast('Saved.');
  }catch(e){ if(e&&e.code==='declined') return; toast('Could not save the PDF. Check your signal and try again.'); }
}
async function saveOffline(){
  try{
    const r=await fetch('offline.html'); if(!r.ok) throw new Error('fetch');
    await dl.save({filename:'Local291_Contract_Library.html', data:await r.blob()});
    toast('Saved. Open it from your Files or Downloads app any time, even with no signal.');
  }catch(e){ if(e&&e.code==='declined') return; toast('Could not save the offline copy. Try again with signal.'); }
}
if(!OFFLINE && window.claude && claude.use){
  claude.use('downloads').then(ns=>{
    if(!ns) return;
    dl=ns;
    if(cur && !document.querySelector('[data-pdf]')) document.querySelector('.dhead .s').insertAdjacentHTML('afterend', pdfBtn(cur));
    const b=document.createElement('button'); b.type='button'; b.className='btn'; b.textContent='Save offline copy (no signal needed)';
    b.addEventListener('click',saveOffline);
    const wrap=document.createElement('div'); wrap.className='actions'; wrap.appendChild(b);
    $('#foot').before(wrap);
