<style>
/* Layout: one narrow reading column. Home = grouped list of documents + search. Doc = sticky search bar, section list, then pages. */
:root{

}

  --bg:#11161d; --surface:#1a212b; --ink:#e8edf3; --muted:#9aa7b7; --line:#2c3644;

  --accent:#7fb0f0; --accent-ink:#0d1520; --mark:#8a6a00; --mark-on:#c26a00; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.55 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* header */
.top{padding:28px 0 16px}
.top .kicker{font-family:var(--display);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.top h1{font-size:40px;line-height:1.05;margin-top:2px}
.top p{margin:8px 0 0;color:var(--muted);font-size:16px}

/* search box */
.search{position:relative;display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;height:54px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:0 44px 0 16px;font-size:18px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input:focus{border-color:var(--accent);outline:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:24px;cursor:pointer;border-radius:8px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer}

/* doc list */
.group{margin-top:28px}
.group h2{font-size:20px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.cards{display:grid;gap:10px}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-decoration:none;color:inherit}
.card:active{transform:scale(.99)}
.card .tab{flex:none;width:8px;align-self:stretch;border-radius:4px;background:var(--accent)}
.card .t{font-weight:700;font-size:19px;line-height:1.25}
.card .s{color:var(--muted);font-size:15px;margin-top:2px}
.card .arrow{margin-left:auto;font-size:26px;color:var(--muted);flex:none}

/* results */

.hit{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;cursor:pointer;font-size:16px}
.hit .pg{display:inline-block;font-weight:700;color:var(--accent);margin-right:6px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px;color:var(--accent);font-weight:700;cursor:pointer}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* doc view */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 10px;border-bottom:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:20;max-width:90vw}
.foot{color:var(--muted);font-size:14px;margin-top:36px;border-top:1px solid var(--line);padding-top:14px}

<script id="data" type="application/json">[{"id":"cba","pdf":"IBEW291_Inside_Wireman_Agreement_2025-2029.pdf","group":"IBEW Local 291","title":"Inside Wireman Agreement (CBA)","sub":"Local 291 & Idaho NECA · Dec 1, 2025 – Nov 30, 2029","pages":[["INSIDE WIREMAN AGREEMENT Between Local Union 291, International Brotherhood of Electrical Workers And Western Division, Idaho Chapter, National Electrical Contractors Association, Inc.","Covering all Inside Electrical Work in Ada, Adams, Boise, Canyon, Elmore, Gem, Owyhee, Payette, Valley and Washington Counties in Idaho And Malheur County in the State of Oregon","Effective December 1, 2025 through November 30, 2029"],["TABLE OF CONTENTS – INSIDE WIREMAN AGREEMENT Heading Parties to Agreement Equal Employment Opportunity Basic Principles\nARTICLE I: Standard CIR Effective Date Changes Grievances/Disputes\nARTICLE II: Employer Rights/Union Rights Definition of Employer Management Rights Foreman Call-Out By Name Workman’s Compensation Insurance Surety Bond Requirements Union Recognition Non-Resident Employees Favored Nations Management Working With the Tools Loaning of Employees Acting as a Contractor Electrical Installation Union Right to Discipline Members Appointment of Stewards Union Job Access Picket Language Tool List Union Security Age Ratio Annulment/Subcontracting Worker Qualifications Promotion of Union Work\nARTICLE III: Hours/Wages/Working Conditions Workday/Workweek/Four Ten Hour Days Overtime/Holidays Payday/Payment of Wages Direct Deposit Classifications/Wages Travel Time Union Dues Deduction Ratio of Foreman to Journeyman/General Foreman Shift Work","Section(s)","Page 4 4 4","2","1.01 1.02 1.05","4 5 5","2.01 2.02 2.03 2.04 2.05 2.07 2.09 2.10 2.11 2.12 2.13 2.14 2.15 2.16 2.17 2.18 2.20 2.23 2.24 2.25 2.26 2.27","6 6 7 7 7 7 8 8 8 8 9 9 9 9 10 10 10 11 11 11 11 12","3.01 3.02 3.04 3.04 3.05 3.06 3.09 3.10 3.12","12 13 13 14 14 16 17 17 18"],["Maintenance and Modernization Wage Modifications Usage of Personal Car Improper Workmanship Meal Breaks Hazard Pay Weather Protection Display of IBEW Emblem Employee Eligibility Forms (I-9)\nARTICLE IV: Referral Procedure Referral Procedure Temporary Employees Geographical Area/Definitions Out of Work List Re-Registration Repeated Discharge Referral Exceptions Referral Appeals Committee Inspection of Referral Procedure Reverse Layoff Furloughs\nARTICLE V: Apprenticeship and Training\nARTICLE VI: Fringe Benefits NEBF Health and Welfare Vacation Pension Annuity Administrative Maintenance Fund Statement\nARTICLE VII: NEIF\nARTICLE VIII: LMCC\nARTICLE IX: NLMCC\nARTICLE X: Safety Safety Laws OSHA Reporting Forms\nARTICLE XI: Substance Abuse\nARTICLE XII: Code of Excellence\nARTICLE XIII: Separability Clause Signatures","3.20 3.21 3.22 3.23 3.24 3.26 3.27 3.28 3.29","19 19 19 20 20 20 20 21 21","4.01 4.06 4.08 4.11 4.12 4.14 4.15 4.16 4.18 4.21 4.23","21 22 21 22 23 23 23 23 23 24 25 25-28","6.01 6.02 6.03 6.08 6.09","28 29 29 29 30 31 31 32 33 34 34 34 34 35 35 36","7.01 8.01 9.01 10.11 10.13 10.14 11.01 12.01 13.01","3"],["INSIDE WIREMAN AGREEMENT Between Western Division, Idaho Chapter, NECA and Local Union 291, IBEW","Parties to Agreement Agreement by and between the Western Division, Idaho Chapter of the National Electrical Contractors Association (NECA) and Local Union No. 291 IBEW It shall apply to all firms who sign a Letter of Assent to be bound by the terms of this Agreement. As used hereinafter in this Agreement, the term Chapter shall mean the Western Division, Idaho Chapter, NECA and the term \"Union\" shall mean Local Union No 291, IBEW. The term \"Employer\" shall mean an individual firm who has been recognized by an assent to this Agreement.","Equal Employment Opportunity It is agreed by both parties that equal employment opportunities shall be extended to all qualified persons working under the terms of this Agreement without regard to age, race, creed, color, religion, gender, sexual orientation, gender identity, national origin, genetic information, disability, or veteran status.","Basic Principles The Employer and the Union have a common and sympathetic interest in the Electrical Industry. Therefore, a working system and harmonious relations are necessary to improve the relationship between the Employer, the Union and the Public. Progress in the industry demands a mutuality of confidence between the Employer and the Union. All will benefit by continuous peace and by adjusting any differences by rational, and common- sense methods. The Employer furnishes the employment and the Union supplies the manpower under the terms of this Agreement. Now, therefore, in consideration of the mutual promises and agreements herein contained, the parties hereto agree as follows:\nARTICLE I STANDARD CIR EFFECTIVE DATE/CHANGES/GRIEVANCES/DISPUTES","Effective Date 4"],["Section 1.01. This Agreement shall take effect December 1, 2025, and shall remain in effect until November 30, 2029, unless otherwise specifically provided for herein. It shall continue in effect from year to year thereafter, from December 1 through November 30 of each year, unless changed or terminated in the way later provided herein.","Changes\nSection 1.02(a). Either party or an Employer withdrawing representation from the Chapter or not represented by the Chapter, desiring to change or terminate this Agreement must provide written notification at least 90 days prior to the expiration date of the Agreement or any anniversary date occurring thereafter. (b). Whenever notice is given for changes, the nature of the changes desired must be specified in the notice, or no later than the first negotiating meeting unless mutually agreed otherwise. (c). The existing provisions of the Agreement, including this Article, shall remain in full force and effect until a conclusion is reached in the matter of proposed changes. (d). Unresolved issues or disputes arising out of the failure to negotiate a renewal or modification of this agreement that remain on the 20th of the month preceding the next regular meeting of the Council on Industrial Relations for the Electrical Contracting Industry (CIR) may be submitted jointly or unilaterally to the Council for adjudication. Such unresolved issues or disputes shall be submitted no later than the next regular meeting of the Council following the expiration date of this agreement or any subsequent anniversary date. The Council's decisions shall be final and binding. (e). When a case has been submitted to the Council, it shall be the responsibility of the negotiating committee to continue to meet weekly in an effort to reach a settlement on the local level prior to the meeting of the Council. (f). Notice of a desire to terminate this Agreement shall be handled in the same manner as a proposed change.\nSection 1.03. This Agreement shall be subject to change or supplement at any time by mutual consent of the parties hereto. Any such change or supplement agreed upon shall be reduced to writing, signed by the parties hereto, and submitted to the International Office of the IBEW for approval, the same as this Agreement.\nSection 1.04. During the term of this Agreement, there shall be no stoppage of work either by strike or lockout because of any proposed changes in this Agreement or dispute over matters relating to this Agreement. All such matters must be handled as stated herein.","Grievances/Disputes\nSection 1.05. There shall be a Labor-Management Committee of three representing the Union and three representing the Employers. It shall meet regularly at such stated times as it may decide. However, it shall also meet within 48 hours when notice is given by either party. It shall select its own Chairman and Secretary. The Local Union shall select the Union representatives and the Chapter shall select the management representatives.","5"],["Section 1.06. All grievances or questions in dispute shall be adjusted by the duly authorized representative of each of the parties to this Agreement. In the event that these two are unable to adjust any matter within 48 hours, they shall refer the same to the Labor-Management Committee.\nSection 1.07. All matters coming before the Labor-Management Committee shall be decided by a majority vote. Four members of the Committee, two from each of the parties hereto, shall be a quorum for the transaction of business, but each party shall have the right to cast the full vote of its membership and it shall be counted as though all were present and voting.\nSection 1.08. Should the Labor-Management Committee fail to agree or to adjust any matter, such shall then be referred to the Council on Industrial Relations for the Electrical Contracting Industry for adjudication. The Council's decisions shall be final and binding.\nSection 1.09. When any matter in dispute has been referred to conciliation or arbitration for adjustment, the provisions and conditions prevailing prior to the time such matters arose shall not be changed or abrogated until agreement has been reached or a ruling has been made.\nSection 1.10. Any grievance not brought to the attention of responsible opposite parties to this Agreement in writing within 45 working days of its occurrence shall be deemed to no longer exist.","ARTICLE II Employer Rights/Union Rights Definition of Employer\nSection 2.01. Certain qualifications, knowledge, experience and financial responsibility are required of everyone desiring to be an Employer in the electrical industry; therefore, \"Employer,\" as used herein, is defined to mean a person, firm or corporation having met all qualifications of the State of Idaho (or the State of Oregon if located in Malheur County) to be an Electrical Contractor, maintaining an established place of business with a business telephone open to the public during all business hours, and providing suitable financial status to meet payroll requirements. An Employer desiring to operate under the terms of this Agreement shall furnish proof of the qualifications required under this Section.","Management Rights\nSection 2.02. The Union understands the Employer is responsible to perform the work required by the owner. The Employer shall, therefore, have no restrictions except those specifically provided for in the collective bargaining agreement in planning, directing, and controlling the operation of all his work, in deciding the number and kind of employees to properly perform the work, in hiring and laying off employees, in transferring employees from job to job within the Local Union's geographical jurisdiction, in determining the need and number as well as the person who will act as Foreman, in requiring all employees to observe the Employer's and/or owner's rules and regulations not inconsistent with this Agreement, in requiring all employees to observe all safety regulations, and in discharging employees for proper cause.","6"],["Foreman Call-Out By Name\nSection 2.03. The employer shall have the right to call a Foreman by name provided:\nA) The employee has not quit his previous employer within the past two weeks.\nB) The employer shall notify the business manager in writing of the name of the individual who is to be requested for employment as a Foreman. Upon such request, the business manager shall refer said Foreman provided the name appears on the highest priority group. All Foremen called by name shall be required to attend a Code of Excellence Job Class within 90 days of appointment, or have attended such class within the past 12 months.\nC) When an employee is called as a Foreman, he must remain as a Foreman for 1,000 hours or must receive a reduction in force.","Workman’s Compensation Insurance\nSection 2.04. For all employees covered by this Agreement the individual Employer shall carry Workman's Compensation Insurance with a company authorized to do business in Idaho and/or Oregon, Social Security and other protective insurance as may be required by the laws of these States, and shall furnish satisfactory proof of same to the Union. He shall also make payments to the Idaho and/or Oregon Unemployment Compensation Commission for all employees covered by this Agreement.","Surety Bond Requirements\nSection 2.05. Each individual Employer signatory to this Agreement and any other Agreement(s) with Local Union 291, IBEW shall furnish a Surety Bond or cash deposit in the amount of $20,000 total to secure payment of all amounts due on account of payroll and fund deduction, contribution and reporting obligations of the Employer pursuant to ARTICLE III, Sections 3.05; ARTICLE V, Section 5.11; and ARTICLE VI, Sections 6.01, 6.02, 6.08, and 6.09 of this Agreement and the Trust Funds established pursuant thereto. The bond shall be chargeable only in the amount of the unpaid deduction or contributions and shall be chargeable at the time of the delinquency of the Employer as specified in this Agreement. The surety issuing the bond shall be a company authorized to do business in the State of Idaho. The bond shall provide that it may not be terminated without thirty (30) days prior written notice to the Employer and the Local Union. Additionally, bond renewals must be in the office of the Local Union not less than thirty (30) days prior to the expiration date of the bond in force. In event the bond is insufficient to provide for payment of all amounts secured thereby, all obligations secured thereby shall be paid pro-rata. A copy of the bond shall be furnished to the offices of both parties to this Agreement. The IBEW recognizes that this Surety Bond or cash deposit in the amount prescribed above satisfies any other Surety Bonding requirements an individual Employer may have in all other Agreements with Local Union 291, IBEW.","Union Recognition\nSection 2.07(a). The Employer agrees that if a majority of its employees authorize the Union to represent them in collective bargaining, the Employer will recognize the Union, its agents, representatives or successors as the exclusive collective bargaining agent for all employees performing electrical construction work within the jurisdiction of the Union on all present and future jobsites. 7"],["(b). The Employer understands that the Local Union's jurisdiction -- both trade and territorial -- is not a subject for negotiations but rather is determined solely within the I.B.E.W. by the International President and, therefore, agrees to recognize and be bound by such determinations.","Non-Resident Employees (Portability)\nSection 2.09. An employer signatory to a collective bargaining agreement or to a letter of assent to an agreement with another IBEW Local Union, who signs an assent to this Agreement, may bring up to four bargaining unit employees employed in that Local Union's jurisdiction into this Local's jurisdiction and up to two bargaining unit employees per job from that Local's jurisdiction to this Local's jurisdiction for specialty or service and maintenance work. All charges of violations of this section shall be considered as a dispute and shall be processed in accordance with the provisions of this agreement for the handling of grievances with the exception that any decision of a local labor-management committee that may be contrary to the intent of the parties to the National Agreement on Employee Portability, upon recommendation of either or both the appropriate IBEW International Vice President or NECA Regional Executive Director, is subject to review, modification, or rescission by the Council on Industrial Relations.","Favored Nations\nSection 2.10. The Union agrees that if, during the life of this Agreement, it grants to any other Employer in the Electrical Contracting Industry on work covered by this Agreement, any better terms or conditions than those set forth in this Agreement, such better terms or conditions shall be made available to the Employer under this Agreement and the Union shall immediately notify the Employer of any such concession.","Management Working With the Tools\nSection 2.11. Individuals classified as Management may perform work covered by this Agreement under the following conditions: (1) no more than two officers or directors if the Employer is a corporation, or two partners if the company is a partnership, or the owner if a sole proprietorship, may work with the tools; and (2) after the first 40 hours worked in a week (one pay period) all hours worked by management during that week (one pay period) must be at least matched by workmen (journeyman and/or apprentices) employed under the referral procedure or apprenticeship section of this Agreement.","Loaning of Employees\nSection 2.12. The Employer agrees not to loan any employees to any other Employer without consultation with the Union, and only then when applicants possessing the proper qualifications are not available under the referral procedure.","8"],["Acting as a Contractor\nSection 2.13. No member of the IBEW, while he remains a member of the IBEW and employed under the terms of this Agreement, shall himself become a contractor for the performance of any electrical work. For the purpose of this section, “electrical contracting” includes the performance of such work, marketing, solicitation of work, negotiating work with potential customers, and/or distributing any written or verbal information inferring the ability to operate as an electrical contractor.","Electrical Installation\nSection 2.14. Workmen shall install all electrical work in accordance with State and Municipal rules and Code requirements, contract specifications, and in a safe and workmanlike manner.","Union Right to Discipline Members\nSection 2.15. The Union has the right to discipline its members for violations of its laws, rules and agreements.","Appointment of Stewards\nSection 2.16. The Union shall have the right to appoint a Steward at any job or shop where workmen are employed under the terms of this Agreement. The Business Manager of the Union shall notify the Employer in writing of the appointment and of the identity of such Steward when he is appointed. Such Steward shall see that the Agreement and working conditions are observed by both the Employer and the employee on the job involved. The Steward shall confine his duties to the electrical construction industry and shall be allowed sufficient time to adequately perform his duties. No Steward shall be authorized to cause any work stoppage. No Steward shall be discriminated against by the Employer for making a complaint or giving evidence with respect to an alleged violation of any provisions of this Agreement. When a workman discovers an alleged violation to this Agreement, he is to report such alleged violation to the Steward and immediately return to work. The Steward is to immediately resolve the problem. The workman, after he has reported the alleged violation, will in no way pursue any further discussion or take further action on the matter. Any questions not resolved on reference to the Employer and subsequently to the Business Manager shall be referred to the LaborManagement Committee for processing in accordance with applicable provisions of this Agreement. The Employer shall notify the Business Manager when a Steward is being considered for termination. Prior to a Steward’s being laid off or terminated, the parties are encouraged to discuss the issues. At least two working days notice shall be given. Where a Union Steward has been appointed on the job, the work shall be arranged so that he is included any time there are four or more men working. For purposes of equal distribution of overtime, alternate stewards shall be appointed.\n(b) All stewards appointed by the local union shall hold a Code of Excellence card or acquire one at the next available Code of Excellence class..","9"],["Union Job Access\nSection 2.17. The representative of the Union Hall shall be allowed access to any shop or job at any reasonable time where workmen are employed under the terms of this Agreement.","Picket Language\nSection 2.18(a). This Agreement does not deny the right of the Union or its representatives to render assistance to other labor organizations by removal of its members from jobs when necessary and when the Union or its proper representatives decide to do so; however, no removal shall take place until notice is first given the Employer involved. (b). When such removal takes place, the Union or its representatives shall direct the workmen on such jobs to carefully put away all tools, materials, equipment or any other property of the Employer in a safe manner. The Union will be financially responsible for any loss to the Employer due to neglect in carrying out this provision, but only when a safe place is provided for these by the Employer.","Tool List\nSection 2.20(a). The journeyman shall provide himself with the following supply of tools: Crescent Wrench 10\" Hand Hammer Level-small, Pencil","Flashlight Knife National Electrical Code-current Tool Pouch","Offset Level (no-dog) Socket set up to 3/4\" sockets Padlock Allen wrenches up to 3/8\" (folding type) Pliers (side cutters, diagonals, Tool Box (adequate to carry these Electrical Tester, Fluke T5-600, needle nose, and two (2) 10\" tools) Ideal 61-746, or similar Category adjustable) III voltmeter Screwdrivers (exc. \"Yankee\" style) Rule, not to exc. 25' Wire Strippers, small Square-small (b). A new apprentice in his first six months must furnish himself with the following tools as specified in J.A.T.C. rules: Hand Hammer Knife Socket set up to 3/4\" sockets Pencil Pliers (pipe type and side cutters) Rule not to exc. 25' Screwdriver (exc. mechanical) Tool Box (adequate to carry these tools)\nSection 2.21(a). The Employer shall furnish all other necessary tools or equipment, and safe locked storage for men's tools on all jobs covered by this Section. Workmen will be held responsible for the tools and equipment issued to them providing the Employer furnishes the necessary lockers, tool boxes, or other safe places for storage. 10"],["The Contractor, Steward or Business Manager has the right to inspect the employee's tool box in the presence of the employee at any time. (b). The Employer shall replace an employee's tools if the Employer's safe lockup is broken into and the employee's tools are stolen if a documented report is made to the police. A list of each employee's tools is to be furnished to the Employer upon request.","Union Security\nSection 2.23. All employees covered by the terms of this Agreement shall be required to become and remain members of the Union as a condition of employment from and after the eighth day following the date of their employment or the effective date of this Agreement, whichever is later. (Note: This clause is not applicable where prohibited by law.) Age Ratio\nSection 2.24. On all jobs requiring five (5) or more journeymen, at least every fifth journeyman, if available, shall be fifty (50) years of age or older.","Annulment/Subcontracting\nSection 2.25. The Local Union is a part of the International Brotherhood of Electrical Workers and any violation or annulment by an individual Employer of the approved Agreement of this or any other Local Union of the IBEW, other than violations of Paragraph 2 of this Section, will be sufficient cause for the cancellation of this Agreement by the Local Union after a finding has been made by the International President of the Union that such a violation or annulment has occurred. The subletting, assigning or transfer by an individual Employer of any work in connection with electrical work to any person, firm or corporation not recognizing the IBEW or one of its Local Unions as the collective bargaining representative of his employees on any electrical work in the jurisdiction of this or any other Local Union to be performed at the site of the construction, alteration, painting or repair of a building, structure or other work, will be deemed a material breach of this Agreement. All charges of violations of Paragraph 2 of this Section shall be considered as a dispute and shall be processed in accordance with the provisions of this Agreement covering the procedure for the handling of grievances and the final and binding resolution of disputes.","Worker Qualifications\nSection 2.26. Certain qualifications, technical knowledge, and work experience are required of anyone classified as an applicant for employment under this Agreement. Therefore, “applicant for employment” is defined to mean a person who can document such qualifications by possessing a current Idaho State Electricians License and / or prove compliance with all applicable State Licensing requirements 11"],["Promotion of Union Work\nSection 2.27. The policy of the members of the Local Union is to promote the use of materials and equipment manufactured, processed or repaired under economically sound wage, hour and working conditions by their fellow members of the International Brotherhood of Electrical Workers.","ARTICLE III – Hours/Wages/Working Conditions Hours: (Workday/Workweek)\nSection 3.01(a). Eight hours between the hours of 7:00 a.m. and 3:30 p.m. with not less than one-half (1/2) hour or more than one (l) hour for lunch, with the lunch period between the hours of 12:00 noon and 1:00 p.m., shall constitute a workday. Forty (40) hours within five (5) such workdays, Monday through Friday inclusive, shall constitute a workweek. (b). Any change in starting time and quitting time may be advanced or retarded one hour on a regularly scheduled eight (8) hour day by mutual consent of the parties to this Agreement. Lunch may be advanced or retarded one hour on an 8-hour or 10-hour day. (c). At the customer’s request, a 4-day 10-hour work week may be implemented by the contractor. The work week can either be Monday through Thursday or Tuesday through Friday, but not both on the same job (see modified language below), between the hours of 6:00 a.m. and 6:30 p.m. Prior to implementing a 4-day 10-hour work schedule the contractor shall notify the Local Union. (d). A modified 4-day, 10-hour work week may be implemented by the contractor. The work week can be Monday through Thursday and/or Tuesday through Friday, between the hours of 6:00 a.m. and 6:30 p.m. Upon implementing a 4-day10-hour work schedule the contractor shall notify the local union of the intended schedule. Implementing an overtime schedule shall only commence on the beginning of the workweek. All overtime shall be based on a 5 day, 8 hour shift schedule. (e). When a man is directed by the Employer or representative to work during his regular lunch period, he shall receive the overtime rate for such period and he shall be allowed time for eating his lunch later not exceeding 30 minutes, without any loss of time.\n(f) Breaks All employees shall be allowed two (2) fifteen (15) minute breaks during their regular workday. The first break shall be before the established lunch period, and the 2nd break shall be after the established lunch period. Management shall designate times and locations for breaks.","12"],["Overtime/Holidays\nSection 3.02(a). Overtime: All work performed outside the regularly scheduled hours Monday through Friday as in Section 3.01(a) and all day Saturday shall be paid for at one and one-half (1 1/2) times the straight time rate. (b). Sundays and Holidays: All work performed on Sundays and the following holidays: New Years Day, Memorial Day, Independence Day, Labor Day, Veterans Day, Thanksgiving Day and Christmas Day (or days celebrated as such), shall be paid for at double the straight-time rate. During a week which includes an above mentioned Holiday, when work is available, and when mutually agreed to by the parties, employees may elect to work the non- Holiday days for ten (10) hours a day outside of the Overtime provisions as set forth in Section 3.02(a) for that week only. Any work outside ten (10) hours will be paid at the Overtime rate. The above listed holidays shall be observed on the same day as observed by the Federal Government unless otherwise specifically agreed to by the parties to this Agreement. It is understood that when holidays fall on a Tuesday or Thursday, the Monday preceding or the Friday following will be a day not subject to claims of a lockout or work stoppage. The decision on whether or not to view it as a regular working day is to be decided by the Employer and the Employees. A mutually acceptable arrangement is encouraged, and the matter shall not be reason for grievances or claims of damage by either party. (c). Overtime shall be figured on the straight-time rate of pay. There shall be no pyramiding of overtime rates and double the straight-time rate of pay shall be the maximum compensation for any hour worked. (d). When workmen perform work under the overtime provisions of this Agreement, those same provisions shall apply until a break of at least eight (8) hours is given. (e). The Employer, upon request of the Business Manager, shall allow the Business Manager to examine the employees' time cards.\n(f) PTO. For the 2025-2029 Agreement term, Labor may allocate $0.25 per hour for each holiday to be a Paid Holiday at 8 hours, following the holidays listed in Section 3.02(a). These 8 hours will be considered hours paid, not hours worked. (only NEBF shall be paid on PTO)\nSection 3.03. No work shall be performed on Labor Day except in case of emergency and even then reasonable efforts shall be made to gain permission from the Business Manager of the Union.","Payday/Payment of Wages\nSection 3.04(a). Wages shall be paid weekly not later than quitting time on Friday. Not more than three (3) days wages shall be withheld at any one time, and no more than seven (7) consecutive days shall be paid in one payroll period. In the event the employee is not paid off, waiting time at the regular straight-time rate shall be charged until payment is made, but waiting time is not to exceed eight (8) hours in any one 24-hour period. This provision shall not apply if a good faith effort was made by the Employer to make a timely payment of wages. The company name and address shall be printed on the payroll check stubs. Any errors in payroll resulting in a loss of owed monies shall be corrected within three business days. 13"],["(b). Any worker laid off by the Employer shall be paid his wages immediately. In the event he is not paid off, waiting time at the regular straight-time rate shall be charged until payment is made. (c). Workmen to be laid off shall be given a minimum notice of such layoff according to the following schedule: Zone 1 (Free Zone), adequate time prior to quitting time to gather up necessary tools and belongings and paid in full by quitting time that same day; Zone 2 and Zone 3, two hours notice previous to quitting time and paid in full by quitting time that same day. Sufficient time for gathering tools and belongings shall be allowed during this period. In the event proper notice is not given, the employee will receive his regular pay plus the appropriate pay according to the above schedule from the time of notification and shall be paid in full not later than the regular quitting time that same day. After 4:30 p.m., overtime shall apply. (d). Workmen directed to report to a shop or to a job and do not start work due to weather conditions, lack of material, or causes beyond their control but within the control of the Employer, shall receive two (2) hours pay unless notified before one (1) hour prior to starting time. (e). Workmen who intend not to show up for work, or who intend to be late for work, are required to notify their Employer in advance. This shall be interpreted to mean that such notification shall be made at a reasonable hour and between one hour and one-half hour before the regular starting time insofar as reasonable and possible. (f). Each employee shall, prior to leaving the employment of an Employer, clear any financial indebtedness owed to the Employer.","Payment at Time of Discharge (g). Any employee discharged for cause shall be paid in full at the time of discharge. Exceptions to this requirement may be made if immediate payoff is not feasible due to the shop being closed (shop hours are interpreted to be 8:00 a.m. to 5:00 p.m., Mountain Time, Monday through Friday), or holidays recognized by this Agreement, or if the work site location is outside of Zone 1 (Free Zone). If not paid off immediately, the employee may pick up his/her check at the shop the following regular work day after 1:00 p.m. or request that payment be made by mail to an address provided by the employee. If by mail, the envelope shall be postmarked no later than the second regular work day following discharge and sent by certified mail.","DIRECT DEPOSIT (h). Employer and Employees may mutually agree to allow for direct electronic deposit of wages on a weekly basis to the bank or credit union of the employee’s choice. This manner of payment, once adopted, may not be changed except upon 14-day advance written notification between the employee and Employer with notification copied to the Union.","Classifications/Wages\nSection 3.05(a). The minimum hourly rate of wages shall be as follows effective 12/01/2025: Journeyman Wireman Journeyman Technician","$45.33 $45.33","Foreman (1): Journeyman Wireman Rate +10% Foreman (2): Journeyman Wireman Rate +15% 14"],["Foreman (2) Requirements: a. Foreman Development Series Completion (non-compensable time). Documented company safety requirements, documented company project requirements. b. Three thousand (3,000) cumulative work hours as a Foreman for current employer. c. Oregon Journeyman license General Foreman (1): Journeyman Wireman Rate + 20% General Foreman (2): Journeyman Wireman Rate + 25% General Foreman (2) Requirements: a. Foreman Development Series Completion (non-compensable time). Documented company safety requirements, documented company project requirements. b. Three thousand (3,000) cumulative work hours as a Foreman for current employer. c. Oregon Journeyman license JW Cable Splicer JW Rate x 110% JW Welder JW Rate x 110% Welder current rate plus 10% of JW rate/hour NOTE: Scheduled Journeyman wage increases are as follows","Effective December 1st, 2026: $3.25 increase; Wage increase of $2.93 and Pension increase of $0.32 Effective December 1st, 2027: $3.50 increase; Wage increase of $3.15 and Pension increase of $0.35 Effective December 1st, 2028: $3.50 increase; Wage increase of $3.15 and Pension increase of $0.35 See Hazard Pay rates described in Section 3.26.","APPRENTICE WIREMAN – SIX (6) PERIODS Apprentice 1st Period Apprentice 2nd Period Apprentice 3rd Period Apprentice 4th Period Apprentice 5th Period Apprentice 6th Period","JW Rate x 49% JW Rate x 54% JW Rate x 59% JW Rate x 64% JW Rate x 74% JW Rate x 84%","(b). Pension/Annuity Contributions on Apprentices: Reference ARTICLE VI, Section 6.08 and 6.09 1st and 2nd Period apprentices shall not be contributed on into the Eighth District Electrical Pension Fund or the Eighth District Electrical Pension Fund Annuity Plan. In this regard, unindentured employees are treated the same as first and second period apprentices. 3rd through 6th Period apprentices shall have contributions into the Eighth District Electrical Pension Fund and the Eighth District Electrical Pension Fund Annuity Plan equal to their current percentage rate multiplied by the JW contribution rate.","15"],["Travel Time\nSection 3.06(a). On all jobs of one day's duration or less, the Employer shall pay for traveling time and furnish transportation from shop to job, job to job, and job to shop. All workmen traveling on company time and in company vehicles will be paid at their appropriate base rate from shop to job and job to shop. (b). On all jobs of more than one day's duration, unless otherwise directed, workmen shall report to the job prepared to begin work at the regular starting time and shall work eight (8) hours on the job, if required, or the regular shift hours when shift work is scheduled.","Travel/Zones/Travel Expense (c). Zone 1 (Free Zone) – All territory in Ada and Canyon Counties, and within a 15 mile radius of the Ontario, Oregon City Hall (excluding the Oregon Minimum Security Prison). Zone 2 – All territory outside of Ada and Canyon County, and outside of a 15 mile radius of the Ontario, Oregon City Hall but including the Oregon Minimum Security Prison, but within 75 miles of the Boise City Hall, $ 3.50 per hour worked. Zone 3 – All territory in the wage area beyond 75 miles from the Boise City Hall, $ 8.00 per hour worked. For the purpose of determining zone mileage, the Boise City Hall shall be considered the Employer's established headquarters. The zone boundaries as described above shall remain as described for all contractors from the time of bidding a job until the time of completion of that job. The Zone rate shall be paid at the above hourly rate. (d). On any job not exceeding $250,000.00 electrical (labor and materials included), with the exception of jobs in Zone 3, the free zone rate shall apply with the understanding that transportation is to be provided from a convenient and acceptable point (or points) in Zone 1 and/or on the general route to the job site. (e). Where camps are operated by the contractor and at his option with board and lodging satisfactory to the employee, offered at a cost of not to exceed $6.00 per day or fraction thereof, the employee may avail himself of such facilities with the understanding that he shall be required to pay that per diem cost for those days or portions of days that he actually receives any board and lodging. Also, the employee shall pay an additional cost necessary to retain possession of his quarters for such times as he may not be using same--such additional cost not to exceed $2.00 per day. (For example: an employee living in such camp Monday through Friday shall pay a total of $34.00 for the facilities even though he might leave on Friday or before breakfast Saturday morning and return Monday morning. If he took breakfast on Saturday morning before leaving, returning Monday morning, his weekly cost would be $38.00.)","16"],["Union Dues Deduction\nSection 3.09 (a). The Employer agrees to deduct and forward to the Financial Secretary of the Local Union-upon receipt of a voluntary written authorization-the additional working dues from the pay of each IBEW member. The amount to be deducted shall be the amount specified in the approved Local Union By-laws. Such amount shall be certified to the Employer by the Local Union upon request by the Employer. (b). The Employer agrees to deduct (upon receipt of a voluntary written authorization) a designated amount from the pay of each IBEW member to be forwarded on a monthly basis to the Idaho Central Credit Union and credited to the account of the employee. Upon receiving such written authorization from the employee, the Employer shall allow no more than one pay period to elapse before beginning the deduction. The amount of the desired deduction is to be specified by the employee in the written authorization. An employee shall not be allowed to make more than one change in the amount, or in any other aspect of the deduction arrangement, with an individual Employer in any six-month period. Monies deducted are to be forwarded on a monthly basis to the Idaho Central Credit Union no later than the fifteenth (15th) day of the following month. (c). Employers failing to meet the remittance and reporting procedure as set forth herein and established by the Local Union shall be subject to having this Agreement terminated upon seventy-two (72) hours prior written notice being served by the Union upon said defaulting Employer.","Ratio of Foreman to Journeyman\nSection 3.10 (a). When the third (3rd) journeyman comes on the job, one of the journeymen shall be designated as Foreman by the Employer. A foreman may supervise up to ten (10) journeymen* exclusive of himself. A Foreman may work with the tools and direct one apprentice. (b). On jobs requiring two (2) Foremen, one shall be designated as General Foreman and may direct a crew of not more than six (6) journeymen*. A General Foreman shall not work with the tools or perform the work of a journeyman. *A fifth year Apprentice with a current Idaho State Journeyman license shall be included in this ratio. (c). When three (3) Foremen are required, the General Foreman shall not direct a crew. A General Foreman shall not supervise more than six (6) Foremen. General Foremen is to give instructions to job Foremen only. (d). Any dispute regarding the manner in which a Foreman or General Foreman executes his supervisory or job management responsibilities shall be handled as a grievance against the Employer. (e). All Foremen, General Foremen and Stewards are required to hold a valid first aid card and a valid CPR card. Foremen and General Foremen are required to hold a valid OSHA 30 card. Those not holding such cards are to obtain them at the first opportunity available to them as a condition of holding such a position. 17"],["(f). On jobs having a Foreman, workmen are not to take directions or orders or to accept the layout of any job from anyone except the Foreman. This does not deny the Employer or his representative(s) the right to give directions, orders or layout of work through the proper channels.","General Foreman (g). When a shop employs more than eight (8) journeymen on jobs not under the direction of Foremen, one may be designated as either General Shop Foreman at General Foreman's scale or a Shop Foreman at Foreman's scale. A General Shop Foreman may direct other Foremen as well as unsupervised journeymen. A Shop Foreman may not supervise Foremen. General Shop Foremen or Shop Foremen shall not work with the tools except for incidental repairs or assisting temporarily on the jobs (h). Any shop employing eight (8) journeymen or less on jobs not supervised by Foremen may appoint a General Shop Foreman at General Foreman's scale or a Shop Foreman at Foreman's scale with the understanding that such a Foreman may work with the tools.","Shift Work\nSection 3.12. When so elected by the contractor, multiple shifts of eight (8) hours for at least five (5) days' duration may be worked. When two (2) or three (3) shifts are worked: The first shift (day shift) shall consist of eight (8) consecutive hours worked between the hours of 8:00 A.M. and 4:30 P.M. Workmen on the \"day shift\" shall be paid at the regular hourly rate of pay for all hours worked. The second shift (swing shift) shall consist of eight consecutive hours worked between the hours of 4:30 P.M. and 1:00 A.M. Workmen on the \"swing shift\" shall be paid at the regular hourly rate of pay plus 10% for all hours worked. The third shift (graveyard shift) shall consist of eight (8) consecutive hours worked between the hours of 12:30 A.M. and 9:00 A.M. Workmen on the \"graveyard shift\" shall be paid at the regular hourly rate of pay plus 15% for all hours worked. The Employer shall be permitted to adjust the starting hours of the shift by up to two (2) hours in order to meet the needs of the customer. If the parties to the Agreement mutually agree, the shift week may commence with the third shift (graveyard shift) at 12:30 A.M. Monday to coordinate the work with the customer's work schedule. However, any such adjustment shall last for at least five (5) consecutive days’ duration unless mutually changed by the parties to this agreement. An unpaid lunch period of thirty (30) minutes shall be allowed on each shift. All overtime work required before the established start time and after the completion of eight (8) hours of any shift shall be paid at one and one-half times the \"shift\" hourly rate.","18"],["There shall be no pyramiding of overtime rates and double the straight rate shall be the maximum compensation for any hour worked. There shall be no requirement for a day shift when either the second or third shift is worked.","Maintenance and Modernization\nSection 3.20. Night maintenance and modernization work in occupied premises may be scheduled Monday after 3:30PM thru Saturday at 8:00AM. A worker's refusal to work under this section of the agreement shall not be grounds for termination. The Business Manager of the Union shall be notified of all such work before it is commenced and when it is completed. This section shall not supersede Article III, section 3.12 \"Shift Work\". This work shall be paid at 5% above the normal day shift rate of pay. The union can, upon notice, require any shop to work under “Shift Language” where proven violations occur. Night Maintenance and Modernization is defined as; An occupied space where daytime access is identified by the customer or general contractor as an owneroccupied area that cannot be worked on during normal working hours. Only one shift per day is worked Project must be Competitively Bid The removal and replacement of a fixture or device in a like for like manner. This article will not be used anytime there is; Removal, replacement, or additions of any Electrical Panels or Switchboards. Removal, replacement, or additions of any raceways and or branch circuitry not directly related to the system being maintained or modernized.","Wage and Hour Modifications\nSection 3.21. Where the Union deems it necessary to protect the jurisdiction of the International Brotherhood of Electrical Workers, the Union will, with reasonable notification prior to the bidding process or letting of a contract for a particular project, consider a modification to Article III Sections 3.01(a) (Workday/Workweek) and 3.05(a) Wages as outlined in the current collective bargaining agreement. Should the Union consent to a modification of the labor agreement for a particular project, the modification shall apply only to the project in question until its completion. With the exception of the agreed-upon modifications, all terms and conditions of the current Agreement shall remain in full force and effect.","Usage of Personal Car\nSection 3.22(a). No workman shall use his automobile in any manner detrimental to the best interest of other members. No workman shall use his automobile to transport the Employer's tools or materials, with the exception of contractor supplied hard hat and /or safety glasses. (b). When it becomes necessary during the day to transfer a man or men from one job to another, transportation shall be furnished by the Employer. Mileage shall be paid at the IRS Standard Mileage Rate in effect on June 1 of each contract year to each employee who chooses to use his car. 19"],["Improper Workmanship\nSection 3.23. The journeyman shall be required to make corrections on improper workmanship for which he is responsible unless the errors were made by order of the Employer or Employer's representative. Employers shall notify the Union of workmen who fail to adjust improper workmanship. The Union assumes responsibility for the enforcement of this provision within such limits as the Labor Management Committee finds proper in cases of disputes.","Meal Breaks\nSection 3.24. If workmen are directed to work beyond the normal eight (8) hour shift, or the normal ten (10) hour shift on a “four tens” schedule, the following meal provisions shall apply after the first ten (10) hours on an 8 hour shift or 11 hours on a 10 hour shift: There shall be a mandatory fifteen (15) minute break and a $20 per diem in lieu of a hot meal. Every four (4) hours afterwards (beginning with the fifteenth hour on an 8 hour shift or the sixteenth hour on a normal 10 hour shift), a hot meal on a mandatory half-hour non-paid lunch will be provided with no option for cash in lieu of the meal.","Hazard Pay\nSection 3.26(a). All work on energized towers shall be paid for at double the regular rate, with a minimum of ten dollars ($10.00) for any such work. On any other towers all work not over 32 feet from the base shall be paid for at the regular rate. (b). Work over 32 feet shall be paid for at double the regular rate. It is understood that if a suitable scaffold and/or man-lift with toe boards and handrails is provided and a safe access to such scaffold is provided, the additional pay provisions shall not apply. (c). Work performed from a standard manufactured bucket truck manufactured equipment, and/or mechanical lift shall not be subject to the premium pay provisions as long as all applicable safety requirements are met. Workmen will not be terminated for refusal to work when in fear of heights or when equipment may place them in jeopardy. (d). On work in the following categories, workmen including the foreman supervising such work will be paid at time and one half the regular rate: (1) When workmen are under compressed air or where gas masks are required;\n(2) When working tunnels or shafts where danger of falling rocks or other debris exists; and (3) When working from suspended or swinging scaffolds or boson’s chairs when lifelines are required by Idaho Safety Code No. 2 and 3.","Weather Protection\nSection 3.27. Protection from unfavorable weather and exposure shall be provided by the Employer as follows: when workmen are eating a meal at the job site, and when workmen are being transported by the Employer. 20"],["Display of IBEW Emblem\nSection 3.28. The IBEW emblem may be displayed on any job where there is no objection.","Forms I-9\nSection 3.29. It is agreed by both parties that the Employment Eligibility Verification Form (Form I-9) required by the Immigration and Control Act of 1986 may be completed in its entirety and maintained on file in the Local Union Office.\nARTICLE IV","Referral Procedure\nSection 4.01. In the interest of maintaining an efficient system of production in the Industry, providing for an orderly procedure of referral of applicants for employment, preserving the legitimate interests of the employees in their employment status within the area and of eliminating discrimination in employment because of membership or non-membership in the Union, the parties hereto agree to the following system of referral of applicants for employment.\nSection 4.02. The Union shall be the sole and exclusive source of referral of applicants for employment.\nSection 4.03. The Employer shall have the right to reject any applicant for employment.\nSection 4.04. The Union shall select and refer applicants for employment without discrimination against such applicants by reason of membership or non-membership in the Union and such selection and referral shall not be affected in any way by rules, regulations, bylaws, constitutional provisions or any other aspect or obligation of Union membership policies or requirements. All such selection and referral shall be in accordance with the following procedure.\nSection 4.05. The Union shall maintain a register of applicants for employment established on the basis of the Groups listed below. Each applicant for employment shall be registered in the highest priority Group for which he qualifies.","Journeyman Wireman – Journeyman Technician GROUP I","All applicants for employment who have four or more years' experience in the trade, are residents of the geographical area constituting the normal construction labor market, have passed a Journeyman Wireman's examination given by a duly constituted Inside Construction Local Union of the IBEW or have been certified as a Journeyman Wireman by any Inside Joint Apprenticeship and Training Committee, or have at least twelve thousand (12,000) hours experience in the trade, and, who have been employed in the trade for a period of at least one year in the last four years in the geographic area covered by the collective bargaining Agreement.","21"],["Group I status shall be limited to one Local Union at one time. An applicant who qualifies for Group I in a local union shall be so registered electronically and remain on Group I in that local union unless and until the applicant designates another local union as his or her Group I local union. If an applicant qualifies for Group I status in a local union other that his or her home local union and designates that local as his or her Group I local union, the business manager of the new Group I status local union shall by electronic means notify the business manager of the applicant’s former Group I status local union. GROUP II","All applicants for employment who have four or more years' experience in the trade and who have passed a Journeyman Wireman's examination given by a duly constituted Inside Construction Local Union of the IBEW or have been certified as a Journeyman Wireman by any Inside Joint Apprenticeship and Training Committee or have at least twelve thousand (12,000) hours experience in the trade.","GROUP III All applicants for employment who have two or more years' experience in the trade; are residents of the geographical area constituting the normal construction labor market; and who have been employed for at least six months in the last three years in the geographical area covered by the collective bargaining agreement. GROUP IV","All applicants for employment who have worked at the trade for more than one year.","Section 4.06. If the registration list is exhausted and the Local Union is unable to refer applicants for employment to the Employer within 48 hours from the time of receiving the Employer's request, Saturdays, Sundays and holidays excepted, the Employer shall be free to secure applicants without using the Referral Procedure but such applicants, if hired, shall have the status of \"temporary employees.\"\nSection 4.07. The Employer shall notify the Business Manager promptly of the names and Social Security numbers of such \"temporary employees,\" and shall replace such \"temporary employees\" as soon as registered applicants for employment are available under the Referral Procedure.\nSection 4.08. \"Normal construction labor market\" is defined to mean the following geographical area plus the commuting distance adjacent thereto, which includes the area from which the normal labor supply is secured: All of the counties of Ada, Adams, Boise, Canyon, Elmore, Gem, Owyhee, Payette, Valley, and Washington in the State of Idaho, and Malheur County in the State of Oregon. The above geographical area is agreed upon by the parties to include the areas defined by the Secretary of Labor to be the appropriate prevailing wage area under the Davis-Bacon Act to which this Agreement applies.\nSection 4.09. \"Resident\" means a person who has maintained his permanent home in the above-defined geographical area for a period of not less than one year or who, having had a permanent home in this area, has temporarily left with the intention of returning to this area as his permanent home.\nSection 4.10. \"Examination\" shall include experience rating tests if such examination shall have been given prior to the effective date of this procedure, but from and after the date of this procedure, shall include only written 22"],["and/or practical examinations given by a duly constituted Inside Construction Local Union of the IBEW. Reasonable intervals of time for examinations are specified as ninety (90) days. An applicant shall be eligible for examination if he has four years' experience in the trade.\nSection 4.11. The Union shall maintain an \"Out of Work List\" which shall list the applicants within each Group in chronological order of the dates they register their availability for employment.","Re-Registration\nSection 4.12. An applicant who has registered on the \"Out of Work List\" must renew his application every thirty\n(30) days or his name will be removed from the \"List.\"\nSection 4.13. An applicant who is hired and who receives, through no fault of his own, work of forty (40) hours or less shall, upon re-registration, be restored to his appropriate place within his Group.\nSection 4.14 (a). Employers shall advise the Business Manager of the Local Union of the number of applicants needed. The Business Manager shall refer applicants to the Employer by first referring applicants in Group I, in the order of their place on the \"Out of Work List\" and then referring applicants in the same manner successively from the “Out of Work List” in Group II, then Group III, and then Group IV. Any applicant who is rejected by the Employer shall be returned to his appropriate place within his Group and shall be referred to other employment in accordance with the position of his Group and his place within his Group.","Repeated Discharge\nSection 4.14 (b). An Applicant who is discharged for cause two times within a 12-month period shall be referred to the neutral member of the Appeals Committee for a determination as to the applicant’s continued eligibility for referral. The neutral member of the Appeals Committee shall, within three business days, review the qualifications of the applicant and the reasons for the discharges. The neutral member of the Appeals Committee may, in his or her sole discretion: (1) require the applicant to obtain further training from the JATC before again being eligible for referral; (2) disqualify the applicant for referral for a period of four weeks, or longer, depending on the seriousness of the conduct and/or repetitive nature of the conduct; (3) refer the applicant to an employee assistance program, if available, for evaluation and recommended action; or (4) restore the applicant to his/her appropriate place on the referral list.\nSection 4.15. The only exceptions which shall be allowed in this order of referral are as follows: (a). When the Employer states bona fide requirements for special skills and abilities in his request for applicants, the Business Manager shall refer the first applicant on the register possessing such skills and abilities. (b). The age ratio clause in the Agreement calls for the employment of an additional employee or employees on the basis of age. Therefore, the Business Manager shall refer the first applicant on the register satisfying the applicable age requirements provided, however, that all names in higher priority Groups, if any, shall first be exhausted before such overage reference can be made. 23"],["Section 4.16. An Appeals Committee is hereby established composed of one member appointed by the Union, one member appointed by the Employer or the Association, as the case may be, and a Public Member appointed by both these members.\nSection 4.17. It shall be the function of the Appeals Committee to consider any complaint of any employee or applicant for employment arising out of the administration by the Local Union of Sections 4.04 through 4.15 of this Agreement. The Appeals Committee shall have the power to make a final and binding decision on any such complaint which shall be complied with by the Local Union. The Appeals Committee is authorized to issue procedural rules for the conduct of its business, but it is not authorized to add to, subtract from, or modify any of the provisions of this Agreement and its decisions shall be in accord with this Agreement.\nSection 4.18. A representative of the Employer or of the Association, as the case may be, designated to the Union in writing, shall be permitted to inspect the Referral Procedure records at any time during normal business hours.\nSection 4.19. A copy of the Referral Procedure set forth in this Agreement shall be posted on the Bulletin Board in the offices of the Local Union and in the offices of the Employers who are parties to this Agreement.\nSection 4.20. Apprentices shall be hired and transferred in accordance with the apprenticeship provisions of the Agreement between the parties.","Reverse Layoff\nSection 4.21. When making reductions in the number of employees due to lack of work, Employers shall use the following procedure: (a). Temporary employees, if any are employed, shall be laid off first. Then employees in Group IV shall be laid off next, if any are employed in this Group. Next to be laid off are employees in Group III, if any are employed in this group, then those in Group II, and then those in Group I. (b). Paragraph (a) will not apply as long as the special skills requirement as provided for in Section 4.15(a) is required. (c). Supervisory employees covered by the terms of this Agreement will be excluded from layoff as long as they remain in a supervisory capacity. When they are reduced to the status of Journeyman, they will be slotted in the appropriate group in paragraph (a) above.\nSection 4.22 An employer shall have the right to recall for employment any former employee that the employer has laid off, provided that: The former employee is in the highest level Group on the referral list containing applicants available for work, regardless of the individual’s position on the list; or, if the former employee is a CW/CE, he or she is available for assignment regardless of the individual’s position on the list; The recall is made within 45 days from the time of layoff; The former employee has not quit his most recent employer under this agreement within the two weeks prior to the recall request; And the former employee is not an apprentice.","24"],["Furloughs\nSection 4.23 Employees “furloughed” shall not be counted in the required ratios set forth in this agreement and any addendums or variances associated to this agreement. Employers are required to lay-off any employee who has not been employed for 21 consecutive calendar days including weekends and holidays, but not including military leave, bona fide vacation, medical, or family leave. Note “bona fide vacation” is defined as not filing for unemployment benefits.\nARTICLE V – Standard Inside Apprenticeship and Training\nSection 5.01. There shall be a local Joint Apprenticeship and Training Committee (JATC) consisting of a total of either 6 or 8 members who shall also serve as Trustees to the local apprenticeship and training trust. An equal number of members (either 3 or 4) shall be appointed, in writing, by the local chapter of the National Electrical Contractors Association (NECA) and the local union of the International Brotherhood of Electrical Workers (IBEW). The local apprenticeship standards shall be in conformance with national guideline standards and industry policies to ensure that each apprentice has satisfactorily completed the NJATC required hours and course of study. All apprenticeship standards shall be registered with the NJATC before being submitted to the appropriate registration agency. The JATC shall be responsible for the training of apprentices, journeymen, installers, technicians, and all others (unindentured, intermediate journeymen, etc.)\nSection 5.02. All JATC member appointments, re-appointments and acceptance of appointments shall be in writing. Each member shall be appointed for a (3 or 4) year term, unless being appointed for a lesser period of time to complete an unexpired term. The terms shall be staggered, with one (1) term from each side expiring each year. JATC members shall complete their appointed term unless removed for cause by the party they represent or they voluntarily resign. All vacancies shall be filled immediately. The JATC shall select from its membership, but not both from the same party, a Chairman and a Secretary who shall retain voting privileges. The JATC will maintain one (1) set of minutes for JATC committee meetings and a separate set of minutes for Trust meetings. The JATC should meet on a monthly basis, and also upon the call of the Chairman.\nSection 5.03. Any issue concerning an apprentice or an apprenticeship matter shall be referred to the JATC for its review, evaluation and resolve; as per standards and policies. If the JATC deadlocks on any issue, the matter shall be referred to the Labor-Management Committee for resolution as outlined in Article One of this agreement; except for trust fund matters, which shall be resolved as stipulated in the local trust instrument.\nSection 5.04. There shall be only one (1) JATC and one (1) local apprenticeship and training trust. The JATC may, however, establish joint subcommittees to meet specific needs, such as residential or telecommunications 25"],["apprenticeship. The JATC may also establish a subcommittee to oversee an apprenticeship program within a specified area of the jurisdiction covered by this agreement. All subcommittee members shall be appointed, in writing, by the party they represent. A subcommittee member may or may not be a member of the JATC.\nSection 5.05. The JATC may select and employ a part-time or a full-time Training Director and other support staff, as it deems necessary. In considering the qualifications, duties and responsibilities of the Training Director, the JATC should review the Training Director’s Job Description provided by the NJATC. All employees of the JATC shall serve at the pleasure and discretion of the JATC.\nSection 5.06. To help ensure diversity of training, provide reasonable continuous employment opportunities and comply with apprenticeship rules and regulations, the JATC, as the program sponsor, shall have full authority for issuing all job training assignments and for transferring apprentices from one employer to another. The employer shall cooperate in providing apprentices with needed work experiences. The local union referral office shall be notified, in writing, of all job training assignments. If the employer is unable to provide reasonable continuous employment for apprentices, the JATC is to be so notified.\nSection 5.07. All apprentices shall enter the program through the JATC as provided for in the registered apprenticeship standards and selection procedures. An apprentice may have their indenture canceled by the JATC at any time prior to completion as stipulated in the registered standards. Time worked and accumulated in apprenticeship shall not be considered for local union referral purposes until the apprentice has satisfied all conditions of apprenticeship. Individuals terminated from apprenticeship shall not be assigned to any job in any classification, or participate in any related training, unless they are reinstated in apprenticeship as per the standards, or they qualify through means other than apprenticeship, at sometime in the future, but no sooner than two years after their class has completed apprenticeship, and they have gained related knowledge and job skills to warrant such classification.\nSection 5.08. The JATC shall select and indenture a sufficient number of apprentices to meet local manpower needs. The JATC is authorized to indenture the number of apprentices necessary to meet the job site ratio as per\nSection 5.12.\nSection 5.09. Though the JATC cannot guarantee any number of apprentices; if a qualified employer requests an apprentice, the JATC shall make every effort to honor the request. If unable to fill the request within ten (10) working days, the JATC shall select and indenture the next available person from the active list of qualified applicants. An active list of qualified applicants shall be maintained by the JATC as per the selection procedures.\nSection 5.10. To accommodate short-term needs when apprentices are unavailable, the JATC shall assign unindentured workers who meet the basic qualifications for apprenticeship. Unindentured workers shall not remain employed if apprentices become available for OJT assignment. Unindentured workers shall be used to meet job site ratios except on wage-and-hour (prevailing wage) job sites.","26"],["Before being employed, the unindentured person must sign a letter of understanding with the JATC and the employer - agreeing that they are not to accumulate more than two thousand (2,000) hours as an unindentured, that they are subject to replacement by indentured apprentices and that they are not to work on wage and hour (prevailing wage) job sites. Should an unindentured worker be selected for apprenticeship, the JATC will determine, as provided for in the apprenticeship standards, if some credit for hours worked as an unindentured will be applied toward the minimum OJT hours of apprenticeship. The JATC may elect to offer voluntary related training to unindentured; such as Math Review, English, Safety, Orientation/Awareness, Introduction to OSHA, First-Aid and CPR. Participation shall be voluntary.\nSection 5.11. The employer shall contribute to the local health and welfare plans and to the National Electrical Benefit Fund (NEBF) on behalf of all apprentices and unindentured. Contributions to other benefit plans may be addressed in other sections of this agreement.\nSection 5.12. Each job site shall be allowed a ratio of one (1) apprentice for every one (1) Journeyman Wiremen. On any job requiring only one journeyman a ratio of two apprentices to one journeyman may be utilized. Number of Journeymen 1 2 3 etc.","Maximum Number of Apprentices/Unindentured 2 2 3 etc.","Fifth year apprentices with a current Idaho State Journeyman License shall not be counted in the ratio above. The first person assigned to any job site shall be a Journeyman Wireman. A job site is considered to be the physical location where employees report for their work assignments. The employer’s shop (service center) is considered to be a separate, single job site. All other physical locations where workers report for work are each considered to be a single, separate job site.\nSection 5.13. An apprentice is to be under the supervision of a Journeyman Wireman at all times. This does not imply that the apprentice must always be in sight of a Journeyman Wireman. Journeymen are not required to constantly watch the apprentice. Supervision will not be of a nature that prevents the development of responsibility and initiative. Work may be laid out by the employer’s designated supervisor or journeyman based on their evaluation of the apprentice’s skills and ability to perform the job tasks. Apprentices shall be permitted to perform job tasks in order to develop job skills and trade competencies. Journeymen are permitted to leave the immediate work area without being accompanied by the apprentice. Apprentices who have satisfactorily completed the first four years of related classroom training using the NJATC curriculum and accumulated a minimum of 6,500 hours of OJT with satisfactory performance, shall be permitted to work alone on any job site and receive work assignments in the same manner as a Journeyman Wireman. 27"],["An apprentice shall not, however, be the first person assigned to a job site and apprentices shall not supervise the work of others.\nSection 5.14. Upon satisfactory completion of apprenticeship, the JATC shall issue all graduating apprentices an appropriate diploma from the NJATC. The JATC shall encourage each graduating apprentice to apply for college credit through the NJATC. The JATC may also require each apprentice to acquire any electrical license required for journeymen to work in the jurisdiction covered by this agreement.\nSection 5.15 . The parties to this Agreement shall be bound by the Local Joint Apprenticeship and Training Trust Fund Agreement which shall conform to Section 302 of the Labor-Management Relations Act of 1947 as emended, ERISA, and other applicable regulations. The Trustees authorized under this Trust Agreement are hereby empowered to determine the reasonable value of any facilities, materials or services furnished by either party. All funds shall be handled and disbursed in accordance with the Trust Agreement.\nSection 5.16. All Employers subject to the terms of this Agreement shall contribute the amount of funds specified by the parties signatory to the local apprenticeship and training trust agreement. The current rate of contribution is: two and one-half percent (2.5%) of the gross monthly payroll. This sum shall be due the Trust Fund by the same date as is their payment to the NEBF under the terms of the Restated Employees Benefit Agreement and Trust.\nARTICLE VI Fringe Benefits","NEBF\nSection 6.01. It is agreed that in accord with the Employees Benefit Agreement of the National Electrical Benefit Fund (\"NEBF\"), as entered into between the National Electrical Contractors Association and the International Brotherhood of Electrical Workers on September 3, 1946, as amended, and now delineated as the Restated Employees Benefit Agreement and Trust, that unless authorized otherwise by the NEBF, the individual Employer will forward monthly to the NEBF’s designated local collection agent an amount equal to three percent (3%) of the gross monthly labor payroll paid to, or accrued by, the employees in this bargaining unit, and a completed payroll report prescribed by the NEBF. The payment shall be made by check or draft and shall constitute a debt due and owing to the NEBF on the last day of each calendar month, which may be recovered by suit initiated by the NEBF or its assignee. The payment and the payroll report shall be mailed to reach the office of the appropriate local collection agent not later than fifteen (15) calendar days following the end of each calendar month. The individual employer hereby accepts, and agrees to be bound by, the Restated Employees Benefit Agreement and Trust. An individual employer who fails to remit as provided above shall be additionally subject to having his agreement terminated upon seventy-two (72) hours notice in writing being served by the Union, provided the individual Employer fails to show satisfactory proof that the required payments have been paid to the appropriate local collection agent. 28"],["The failure of any individual Employer to comply with the applicable provisions of the Restated Employees Benefit Agreement and Trust shall also constitute a breach of this labor Agreement.","Health and Welfare\nSection 6.02. Each Employer shall contribute to the Eighth District Electrical Benefit Plan (the “Fund”) the sum of eight dollars and seventy cents ($8.70), for each hour worked by each employee of the Employer performing work covered by this Agreement. This amount represents an eight dollar and sixty ($8.60) base contribution as required by the Fund’s Trustees, plus a ten cent ($.10) contribution required to provide the Fund’s optional Short Term Disability program as elected by Local Union 291. An additional sum of one dollar and ten cents ($1.10) contribution shall be deposited in each employees PCA account (Personal Care Account) established by the Trustees and as elected by Local Union 291. Employer contributions and accompanying payroll reports will be forwarded monthly to such depository and on such forms as the Fund shall designate. Employer contributions and reports shall be delinquent if not received by the 15th day of each month. Employer and Union adopt and agree to be bound by all the terms and provisions of the Merger Agreement And Declaration Of Trust Of The Eighth District Electrical Benefit Fund, as amended (the \"Trust Agreement\") and all Rules and Regulations of the Benefit Plan and other actions adopted or taken by the Board of Trustees of the Fund pursuant to the powers granted to the Board of Trustees by the Trust Agreement. When an increase is required by the Eighth District Health Trustees, the amount of the increase shall be split 50/50 between the parties. Employer designates and appoints as its representatives on the Board of Trustees of the Fund, the Employer Trustees appointed in the manner provided in the Trust Agreement. Union designates and appoints as its representatives on the Board of Trustees of the Fund, the Union Trustees appointed in the manner provided in the Trust Agreement. The failure of any individual employer to comply with the applicable provisions of the Restated Employees Benefit Agreement and Trust shall also constitute a breach of this labor agreement.","Vacation\nSection 6.03. The employer shall grant a minimum of two (2) weeks
