fidential"],["ARTICLE 4 - UNION RECOGNITION AND EMPLOYMENT\nSECTION 1. PRE-HIRE RECOGNITION","Contractors recognize the Unions as the sole and exclusive bargaining representative for all craft employees working within the scope of this Agreement as described in Article 3.\nSECTION 2. UNION REFERRAL","(A) Contractors agree to recognize and be bound by the legal referral facilities maintained by the Unions and shall utilize those facilities pursuant to Sections (b) or (c) below, as appropriate.","(B) Contractors shall notify the appropriate Union having jurisdiction over work to be performed by the Contractor either in writing or by telephone when workers are required. The Unions shall dispatch a qualified worker consistent with the rules governing their hiring hall process.","(i) In the event the referral facilities maintained by the Unions are unable to fill the requisition of the Contractor for qualified workers within a forty-eight\n(48) hour-period after such requisition is made, Contractors may employ applicants for such requisition from any source, and not subject to the criteria set forth below under Section 2(C) for qualified employees of nonsignatory contractors.","(C)  Non-signatory Contractors (i.e. those who are not otherwise a direct party to a collective bargaining agreement with a Union) shall be permitted to use their qualified employees without following the referral mechanism in (b) above, provided the use of such employces shall not exceed a 1:1 ratio with Union hiring hall referrals, such that 1 qualified employee of a nonsignatory Contractor may be used for every hiring hall referral. Qualified employees for purposes of this provision are defined as employees who (i) have worked a total of at least 1,000 hours in the craft during the prior 3 years, (ii) were on the Contractor’s payroll for at least 60 of the 270 calendar days prior to the contract award, and (iii) have the ability to safely perform the basic functions of the applicable trade. This provision shall not serve to modify or diminish any applicable ratio requirements concerning the employment of Registered Apprentices. It is understood that the first employee per contractor by craft assignment to perform covered work shall be obtained through the Unions referral systems.","(D) Once assigned, employees working on the Project pursuant to Sections (B)(1),","(B)(ii) or (C) cannot be displaced by application of a Union’s hiring hall rules, with the exception","12 4888-7476-5718.1 / (17346-1004","Micron Confidential"],["of the application of documented layoff procedures set forth in a Schedule A collective bargaining agreement or applicable International Agreement.","(E) The Contractors shall have sole rights to determine the competency of all referrals; the number of employees required; the number of employees to be laid-off; and the sole right to reject any applicant referred by a Union.","(F) During a reduction-in-force, the Contractors have the right to retain the employees of their choice provided that the existing ratios resulting from the application of (C) above are maintained, and notwithstanding any documented layoff procedures set forth in a Schedule A collective bargaining agreement or applicable International Agreement.","(G) An employee who resigns or voluntarily quits work on the project and/or work site will not be eligible for employment with another contractor performing work on the Project for a period of fourteen (14) calendar days.","(H) ‘The parties to this Agreement further recognize that there are barriers to entry on construction projects for businesses operated by citizens who are socially and econornically disadvantaged. The parties therefore agree that they shall work collaboratively to identify and encourage such businesses to successfully bid and participate on Project work.","SECTION 3, NON-DISCRIMINATION IN REFERRALS","The Unions represent that their hiring halls and referral systems will be operated in a nondiscriminatory manner and in full compliance with all applicable federal, state and local laws and regulations, which require equal employment opportunities. Referrals shall not be affected in any way by the rules, regulations, bylaws, constitutional provisions or any other aspects or obligations of union membership, policies or requirements and shall be subject to such other conditions as are established in this Article. No employment applicant shall be discriminated against by any referral system or hiring hall because of the applicant’s union membership, or lack thereof. The Southwest Idaho Eastern Oregon Building and Construction Trades Council and the Unions will make best efforts to assist Contractors in achieving any goals set by law regarding the participation of minorities and women in the performance of Project work.","SECTION 4, MINORITY AND FEMALE REFERRALS FROM THE SURROUNDING GEOGRAPHIC AREA","In the event a Union either fails or is unable to refer qualified minority and female applicants in the numbers sufficient to meet any targets set by law, the Contractor may employ","qualified minority and female workers from any other available source.","13 4888-7476-5718.1 / 1417346-1004","Micron Confidential"],["SECTION 5. CROSS AND QUALIFIED REFERRALS","The Unions shall not knowingly refer to a Contractor an employee then employed by another Contractor working under this Agreement. The Local Unions will exert their utmost efforts to recruit sufficient numbers of skilled and qualified craft employees to fulfill the requirements of the Contractor(s). Toward that end, the parties agree to identify and promote through cooperative procedures, programs and efforts and ways to assist interested local residents, including economically disadvantaged residents, in pursuing careers in the construction industry through pre-approved apprenticeship programs and the parties further agree that any recognized job referral system shall give priority to qualified residents from the community, to the extent consistent with applicable law and rule or regulation of the Unions’ respective referral systems.\nSECTION 6. CRAFT FOREPERSONS AND GENERAL FOREPERSONS","The selection of craft forepersons and/or general forepersons and the number of forepersons required shall be solely the responsibility and within the sole discretion of the Contractor. In making these decisions, the Contractor(s) shall follow generally accepted practices in the industry. All forepersons shall take orders exclusively from the designated Contractor representatives. Craft forepersons shall be designated as working forepersons at the request of the Contractor and shall be paid wages pursuant to the applicable Schedule A collective bargaining","agreement.\nARTICLE 5 - WORKFORCE DEVELOPMENT, ANTI-DISCRIMINATION, DIVERSITY, EQUITY AND INCLUSION\nSECTION 1. ACCESS AND OPPORTUNITY.","(A) The parties recognize that an important objective of this Agreement is to meaningfully extend employment opportunities created by the Project to minorities, women and veterans through, among other means, supporting M/W/VBE owned businesses and committing to equitable hiring practices. Additionally, the parties recognize the EPC Prime Contractor’s M/W/VBE participation goals and have adopted strategies, contained herein, to bolster M/W/VBE","participation. The parties agree that these provisions are critical to addressing pressing workforce","14","4888-7476-S718.1 / (37346-1004","Micron Confidential"],["and economic development concems in the region surrounding the Project and that it is paramount that all parties demonstrate best efforts to fulfill the promise of these terms.","(B) The parties to this Agreement support the development of increased numbers of skilled minorities, women and veteran workers to meet the needs of this Project and the requirements of the industry generally. Toward that end, the parties agree to encourage and undertake meaningful efforts to support the referral and utilization of minorities, women and veterans on this Project,\nSECTION 2, ANTI-DISCRIMINATION AND TRAINING.","(A) The Contractors and Unions are committed to a safe, efficient Project free of discrimination and harassment and agree that they will not discriminate against any employee or applicant for employment on any unlawful basis, including, but not limited to, race, color, age, gender, ethnicity, sexual orientation, gender identity or expression, genetics, pregnancy or pregnancy-related condition, religion, creed, ancestry, national origin, disability, veteran’s status, or background, in any manner prohibited by law or regulation.","(B) The parties recognize the importance of training on diversity, anti-harassment, discrimination, retaliation and maintaining a respectful workplace. The EPC Prime Contractor shall require Contractors to provide mandatory training on these topics to any employee covered by this Agreement. The EPC Prime Contractor retains the right to require refresher and new training on the subjects covered by this section.","SECTION 3. SECTORAL PARTNERSHIPS.","(A) As part of their efforts to work together to develop workforce hiring and developmental strategies, the parties agree to identify sectoral partnerships, which would include strategic partners from regional and educational training entities and institutions of higher education to provide workforce training. These partners may include governmental organizations, educational institutions, training organizations, economic development organizations, worlcforce","15 4888-74 76-5718.1 / 17346-1004","Micron Confidential"],["development organizations, industry associations, community-based organizations, and carcer and technical education programs and organizations. The goals are to create equitable workforce pathways for economically disadvantaged individuals through outreach to new sources of talent and to provide avenues of input and a sense of ownership among community leaders.","SECTION 4. APPRENTICES.","(A) Recognizing the need to maintain continuing supportive programs designed to develop adequate numbers of competent workers in the construction industry, and to encourage diversity in craft entry opportunities, including opportunities for minorities, women, and economically disadvantaged individuals, Contractors shall employ apprentices in their respective crafts to perform such work as is within their capabilities and which is customarily performed by the craft in which they are indentured. Contractors may utilize apprentices registered in a U.S. Department of Labor Registered Apprenticeship Program in ratios set forth in the applicable Schedule A collective bargaining agreement.","(B) The parties recognize that although women make up 44% of the workforce, only about 10% are employed in the construction industry. Accordingly, the parties agree to identify, support, and/or launch community-specific apprenticeship readiness programs that focus on women.","(C) The Unions and Contractors will actively recruit qualified minorities, women and veterans to participate in, and obtain membership in the respective unions and apprenticeship programs to meet or exceed the goals set by this Agreement. The Unions and Contractors will actively recruit qualified applicants from the surrounding area of the Project, minorities, women and veterans and connect them with opportunities to participate in Union sponsored preapprenticeship, and/or other mutually approved training programs providing pathways into","apprenticeship as permissible under Federal State and local regulations. The Unions and","16 4888-7476-5718.1 / (17346-1004","Micron Confidential"],["Contractors further agree they will work cooperatively in conducting pre-apprenticeship recruitment and other pipeline programs with the goal of reaching underserved communities and their minority, women and veteran residents.","(D) The parties to this Agreement understand that apprentice availability and capability is often out of the control ofa union and/or contractor. With that understanding, the Unions signatory to this Agreement shall endeavor to maintain sufficient apprenticeship slots to meet Project needs. Likewise, Contractors will endeavor in good faith to satisfy the direction to engage apprentices under this Article. Consequently, neither the Unions nor Contractors who work in good faith to meet apprenticeship goals shall be liable for not meeting such goals.","(F) Contractors and Unions shall maintain documentation of their good-faith efforts to meet the apprenticeship goals in this Agreement for the duration of the project and shall submit such documentation to the EPC Prime Contractor every six months.","SECTION 5. HELMETS TO HARDHATS.","(A) The parties to this Agreement recognize a desire to facilitate the entry into the building and construction trades of veterans who are interested in careers in the building and construction industry. Accordingly, the Contractors and Unions agrec to utilize the services of the Center for Military Recruitment, Assessment and Veterans Employment (hereinafter “Center’) and the Center’s “Helmets to Hardhats” program to serve as a resource for preliminary orientation, assessment of construction aptitude, referral to apprenticeship programs or hiring halls, counseling and mentoring, support network, employment opportunities, and other needs as identified by the parties.","(B) The Unions and the Contractors agree to coordinate with the Center to create and","maintain an integrated database of veterans interested in working on this Project and of","17 4888-7476-5718.1 / 117346-1004","Micron Confidential"],["apprenticeship and employment opportunities for this Project. To the extent permitted by law, the","Unions will give credit to such veterans for bona fide, provable past experience.","SECTION 6. WORKFORCE DEVELOPMENT COMMITTEE.","(A) In recognition of the necessity for cooperation and communication between all parties to this Agreement in achieving the diversity goals of this Agreement, the prevention of disputes and misunderstandings, and the implementation of this Agreement, the Parties agree to establish a Workforce Development Committee comprised of: (a) three designees from the Unions who are signatory to this Agreement, (b) three designees selected by the EPC Prime Contractor, and (c) up to three neutral community stakeholders as approved by the EPC Prime Contractor and the Unions. The Committee may elect its own chair. The Committee may conduct business through mutually agreed subcommittees. Any Contractor employees who are designated by the union to participate in such committees or subcommittees do so as unpaid union volunteers and not the Contractor’s employees. The Workforce Development Committee will meet periodically. ‘The dates and times of these meetings will be determined by the parties but in no case shall they meet less once every","six months.","(B) During the course of the Project and at least one time every six months, EPC Prime Contractor will present to the Workforce Development Committee the prior six (6) month's data on the current utilization of women, veterans, and minorities in apprenticeships, workforce, and subcontracting. The Workforce Development Committee will (a) review and analyze workforce data for the purpose of monitoring progress on recruiting, retaining, and supporting underserved workers on the Project; and (b) discuss outreach and representation strategies to address barriers and increase opportunities for employment of workers from underserved communitics on the Project.","(C) Every six months, and as needed per the EPC Prime Contractor’s request, the Workforce Development Committee will provide recommendations and information to the EPC Prime Contractor, including the following:","(i) Report its findings to the EPC Prime Contractor;","18","4888-7476-5718.1 /117346- 1004","Micron Confidential"],["(ii) Provide suggestions and recommendations for reaching the Agreement’s goals, including but not limited to providing guidance on outreach and engagement of subcontractors; and","(ii) Facilitate connections to unions, non-union organizations, community based organizations, and workers and serve as a liaison, when appropriate, between the EPC Prime Contractor’s, Employers, subcontractors, unions, non-union organizations,","community organizations, and workers.","ARTICLE 6 - UNION REPRESENTATION","SECTION 1. LOCAL UNION REPRESENTATIVE","Each Union representing on-site Project employees shall be entitled to designate, in writing (copy to the EPC Prime Contractor), one representative, and the Business Manager, who shall be afforded access to the Project at reasonable times for the purpose of administering this Agreement on behalf of the Union’s members, and provided that such representative does not disrupt, interrupt or interfere with the work of any employee working at the Project site, and that said representative fully complies with the safety rules of the Project.\nSECTION 2. STEWARDS","For Unions whose members are performing work at the Project site, each such Union shall have the right to designate one (1) working journeyman as a job steward per Contractor per shift, and shall notify the Contractor in writing of the identity of the designated steward prior to the assumption of his/her duties as steward. Such designated steward shall not exercise any supervisory functions. Stewards will receive the regular rate of pay of their respective crafts and shall be eligible for overtime consistent with the appropriate collective bargaining agreement. The steward shall not cause any interference with work progress. Stewards shall have no right or ability to determine when overtime shall be worked, or who shall work overtime.\nSECTION 3. LAYOFF OF A STEWARD","Contractors agree to notify the appropriate Union 24 hours prior to the layoff of a Steward, except in cases of discipline or discharge for just cause. In any case in which a Steward is discharged or disciplined for just cause, the Union involved shall be notified immediately by the Contractor, or as soon thereafter as is practicable. Provided they are capable of doing the work,","Stewards shall be the last persons laid off prior to the foreman, if any.","19 4888-7476-5718.1 / 11734-1004","Micron Confidential"],["ARTICLE 7 - MANAGEMENT’S RIGHTS\nSECTION 1. RESERVATION OF RIGHTS .","The EPC Prime Contractor and Contractors retain full and exclusive authority for the management of their operations, except as expressly limited by specific provisions of this Agreement. The EPC Prime Contractor and Contractors shall direct their work forces at their prerogative, including but not limited to, the following rights: (a) to plan, control, and direct the work force and the operation of its work, including but not limited to, the determination of the number of employees to be hired and the qualifications thereof, (b) the promotion, hiring, lay-off, or transfer of employees, (c) the discipline, suspension, or discharge of employees, for cause, (d) the assignment and scheduling of work, (e) the promulgation and revision of employee policies and/or Project Site work and safety rules, (f) the requirement, timing, and number of employees to be utilized for overtime work, (g) regulation of the use of all equipment, and (h) to subcontract all or any portion of the Project work. No rules, customs, or practices which the Contractor determines limit or restrict productivity or efficiency of the individual employee, and/or joint working efforts with other employees, shall be permitted or observed.","SECTION 2. MATERIALS, METHODS & EQUIPMENT","There shall be no limitation or restriction upon the Contractor’s choice of materials, techniques, methods, technology or design, or regardless of source or location, upon the use and installation of equipment, machinery, package units, pre-cast, pre-fabricated, pre- finished or preassembled materials or products, tools or other labor-saving devices. Subject to Article 3, Sections 2 and/or 3, the on-site installation or application of such items shall be performed by the craft having jurisdiction over such work; provided, however, it is recognized that other personnel having special qualifications may participate, in a supervisory capacity, in the installation, check-off or testing or unusual equipment or facilities as designated by the Contractor. There shall be no restriction, other than as may be required by safety regulations, on the number of employces assigned to any crew.","ARTICLE 8 - WORK STOPPAGES AND LOCKOUTS\nSECTION 1. NO STRIKES-NO LOCKOUT","(A) There shall not be any strikes, sympathy strikes, picketing, work stoppages,","slowdowns, hand billing, demonstrations or other similar disruptive activity at the Project site for","any reason by any Union or employee against any Contractor while performing work at the Project","20 4888-7476-5718.1 / 17346-1004","Micron Confidential"],["while this Agreement is in effect. There shall be no other Union, or concerted or individual employee activity which disrupts or interferes with the operation of the existing free flow of traffic in the project area including the adjacent roadways providing ingress and egress to the job site. Failure of any Union or employee to cross any picket line established by any union, signatory or non-signatory to this Agreement or the picket or demonstration line of any other organization, at or on the adjacent roadways providing ingress and egress to the Project site, is a violation of this Article. There shall be no lockout at the Project by any Contractor. Contractors and Unions shall take all steps necessary to ensure the compliance with this Section | and to ensure uninterrupted construction and the free flow of traffic in the Project area for the duration of this Agreement.","(B) A Contractor may discharge any employee violating this Section 1, and any such employee will not be eligible thereafter for referral under this Agreement. Such discharge shall be subject to the grievance arbitration clause set forth in Subsection 3 of this Article.","SECTION 2. NOTIFICATION","If a Contractor contends that any Union has violated this Article, it will notify the appropriate Union(s) involved advising of such fact, with copies of the notification to the Union(s) and the Southwest Idaho and Eastern Oregon Building and Construction Trades Council. The Southwest Idaho and Eastern Oregon Building and Construction Trades Council shall use its best efforts to cause the employees, and/or the Union(s) to immediately cease and desist from any violation of this Article. Assuming it discharges its obligations under this provision, the Southwest Idaho and Eastern Oregon Building and Construction Trades Council shall not be liable for the unauthorized acts of a Union or its members.","SECTION 3. EXPEDITED ARBITRATION","Any Contractor or Union alleging a violation of Section | of this Article may utilize the expedited procedure set forth below (in lieu of, or in addition to, any actions at law or equity) that may be brought:","(A) A party invoking this procedure shall notify Robert Hirsch, who shall serve as Arbitrator under this expedited arbitration procedure. Copies of such notification will be simultancously sent to the alleged violator and the EPC Prime Contractor and the Southwest Idaho and Eastern Oregon Building and Construction Trades Council.","(B) The Arbitrator shall thereupon, after notice as to time and place to Contractor, EPC","Prime Contractor, the Union involved and the Southwest Idaho and Eastern Oregon Building and","21","4888-7476-5718.1 / 17346-1004","Micron Confidential"],["Construction Trades Council, hold a hearing within 48 hours of receipt of the notice invoking the procedure if it is contended that the violation still exists.","(C) All notices pursuant to this Article may be by telephone, email, hand delivery or fax, confirmed by overnight delivery, to the Arbitrator, Contractor and Union involved. The hearing may be held on any day, exclusive of Sundays. The hearing shall be completed in one session, which shall not exceed 8 hours in duration (no more than 4 hours being allowed to either side to present their case, and conduct their cross examination) unless otherwise agreed. A failure of any Union or Contractor to attend the hearing shall not delay the hearing of evidence by those present or the issuance of an award by the Arbitrator.","(D) The sole issue at the hearing shall be whether a violation of Section I, above, occurred. If a violation is found to have occurred, the Arbitrator shall issue a Cease and Desist Award restraining such violation and serve copies on the Contractor and Union involved and shall award liquidated damages to the EPC Prime Contractor in the sum of One-Hundred Thousand ($100,000.00) Dollars per day that the Union or Contractor is found to have violated this Article. The Arbitrator shall have no authority to consider any matter in justification, explanation or mitigation of such violation. The Award shall be issued in writing within 3 hours after the close of the hearing, and may be issued without an Opinion. If any involved party desires an Opinion, one shall be issued within 15 calendar days, but its issuance shall not delay compliance with, or enforcement of, the Award. The Arbitrator shall retain jurisdiction to determine compliance with this subsection (D).","(E) An Award issued under this procedure may be enforced by any court of competent jurisdiction upon the filing of this Agreement together with the Award. Notice of the filing of such enforcement proceedings shall be given to the Union or Contractor involved. In any court proceeding to obtain a temporary or preliminary order enforcing the arbitrator’s Award as issued under this expedited procedure the involved Union and Contractor waive their right to a hearing and agree that such proceedings may be ex parte, provided actual written notice is given to opposing counsel as soon as practical and prior to the hearing. Such agreement does not waive any party’s right to participate in a hearing for a final court order of enforcement or in any contempt","proceeding.","22 4888-7476-5718.1 / 117346-1004","Micron Confidential"],["(F) Any rights created by statute or law governing arbitration proceedings which are inconsistent with the procedure set forth in this Article, or which interfere with compliance therewith, are hereby waived by the Contractors and Unions to whom they accrue.","(G) The fees and expenses of the Arbitrator normally shall be equally divided between the involved Contractor(s) and Union(s); however, the Arbitrator shall have the authority to direct that the payment of some or all of the costs of a party or parties must be paid by the other party or parties.","SECTION 4. ARBITRATION OF DISCHARGES FOR VIOLATION","Procedures contained in Article 10 shall not be applicable to any alleged violation of this Article, with the single exception that an individual employee discharged tor violation of Section {, above, may have recourse to the procedures of Article 10 to determine only if the employee did, in fact, violate the provisions of Section 1 of this Article; but not for the purpose of modifying the discipline imposed where a violation is found to have occurred.","ARTICLE 9 - LABOR MANAGEMENT COMMITTEE\nSECTION 1. MEETINGS AND PURPOSE","In recognition of the necessity for cooperation and communication between all parties to this Agreement in achieving the diversity goals of this Agreement, the prevention of disputes and misunderstandings and the implementation of this Agreement, the Parties agree to establish a Labor Management Committee to: (a) promote harmonious relations among the Contractors and Unions; (b) enhance safety and safety awareness and productivity of construction operations; (c) discuss and avoid potential jurisdictional disputes; (d) discuss availability and utilization of apprentices; (c) discuss scheduling issues; and (f) review and discuss other matters unanimously approved by the Comittee pertaining to the Project. The Labor Management Committee is for information gathering and communication purposes only.","SECTION 2. COMPOSITION","The Labor Management Committee shall be comprised of: (a) three designees from the Unions who are signatory to this Agreement, and (b) three designees from the EPC Prime Contractor. The Committee may elect its own chair. The Committee may conduct business through mutually agreed subcommittees. Any Contractor employees who are designated by a Union to participate in such committees or subcommittees do so as unpaid union volunteers and","not the Contractor’s employees. The Labor Management Committee will meet periodically. The","no G2","4888-7476-5718.1 / £17346- 1004","Micron Confidential"],["dates and times of these meetings will be determined by the parties but in no case shall they meet less often than once per calendar quarter.","ARTICLE 10 - GRIEVANCE & ARBITRATION PROCEDURE\nSECTION 1. PROCEDURE FOR RESOLUTION OF GRIEVANCES","Any question, dispute or claim arising out of, or involving the interpretation or application of this Agreement (other than jurisdictional disputes under Article 11 or alleged violations of\nArticle 8, Section 1) shall be considered a grievance and shall be resolved pursuant to the exclusive procedure described below; provided, in all cases, that the question, dispute or claim arose during the term of this Agreement.","STEP 1:","When any employee covered by this Agreement feels aggrieved by a claimed violation of this Agreement, the employee shall, through the Local Union business representative or job steward, give notice of the claimed violation to the work site representative of the involved Contractor. To be timely, such notice of the grievance must be given within five (5) working days after the act, occurrence or event giving rise to the grievance was known or reasonably should have been known to the employee. Failure to abide by this deadline shall render the grievance untimely. The business representative of the Local Union or the job steward and the work site representative of the involved Contractor shall meet and endeavor to adjust the matter within five (5) working days after timely notice has been given. If they fail to resolve the matter within the prescribed period, the grieving party may, within five (5) working days of receiving notice that the matter has not been resolved thereafter pursue Step 2 of the grievance procedure by serving the involved Contractor and EPC Prime Contractor with written copies of the grievance setting forth a description of the claimed violation, the date of which the grievance occurred, and the provisions of the Agreement alleged to have been violated. Gricvances and disputes settled at Step | are nonprecedential, except as to the specific Local Union, employee and Contractor directly involved, unless the settlement is accepted in writing by the EPC Prime Contractor as creating a precedent. Should any signatory to this Agreement have a dispute (excepting jurisdictional disputes or alleged violations of Article 8, Section 1) with any other signatory to this Agreement, and if after conferring, a settlement is not reached within five (5) working days of receiving notice that the matter has not been resolved, the dispute shall be reduced to writing and proceed to Step 2 in the","same manner as outlined in the section for the adjustment of employee grievances.","24 4888-7476-5718.1 / 17346-1004","Micron Confidential"],["STEP 2","An International Representative of the Union, and representatives of the involved Contractor and EPC Contractor shall meet within seven (7) working days of service of the referral of a dispute to this second step to arrive at a satisfactory settlement thereof. Meeting minutes shall be kept by the Contractor. If the parties fail to reach an agreement, the dispute may be appealed in writing in accordance with provisions in Step 3.","STEP 3:","1. If the grievance shall have been submitted but not resolved in Step 2, any of the participating Step 2 entities may, within fourteen (14) calendar days after the initial Step 2 meeting, submit the grievance in writing (copies to other participants) to arbitration by requesting a list of arbitrators who are members of the National Academy of Arbitrators from the Federal Mediation and Conciltation Service, from which an Arbitrator shall be selected. The decision of the Arbitrator shall be final and binding on all parties, and the fees and expenses of such arbitrations shall be borne equally by the involved Contractor and Local Union.","2. Failure of the grieving party to adhere to the time limits set forth in this Article shall render the grievance null and void. These time limits may be extended only by written consent of the EPC Prime Contractor, involved Contractor and involved Local Union at the particular step where the extension is agreed. The Arbitrator shall have authority to make decisions only on the issues presented to it and shall not have the authority to change, add to, delete or modify any provision of this Agreement.","SECTION 2, PARTICIPATION BY OWNER","Owner and/or the EPC Prime Contractor shall be notified by the involved Contractor and","Local Union of all actions under this Article, and at its clection, may participate in full in all","proceedings at all Steps, including Step 3 arbitration.","ARTICLE 11 - JURISDICTIONAL DISPUTES\n(A) The assignment of work will be solely the responsibility of the Contractor performing the work involved; and such work assignments will be in accordance with the Plan for the Settlement of Jurisdictional Disputes in the Construction Industry (the “Plan) or any successor","Plan.","25 A888-7476-5718.1 / 117346-1006","Micron Confidential"],["(B) Each Contractor will conduct a pre-job conference with the Unions prior to commencing work. The EPC Prime Contractor and the Owner will be advised in advance of all such conferences and may participate if they wish. Contractors shall also submit a completed Pre Job Questionnaire (attached as Schedule D) to the EPC Prime Contractor before commencing work on the Project.","(C) If more than one Union signatory to this Agreement asserts jurisdiction over the same assigned work, such disputes shall be settled and adjusted according to the Plan or any other plan or method of procedure that may be adopted in the future by North America’s Building Trades Unions. Decisions rendered shall be confirmed in writing and shall be final, binding, and conclusive on the Contractors and Unions.","(D) There will be no strikes, sympathy strikes, work stoppages, slowdowns, picketing or other interference, interruption or disruptive activity of any kind arising out of any jurisdictional dispute, including while any jurisdictional dispute is being resolved or in protest of any award rendered by the Plan or any successor. The work shall proceed as assigned by the Contractor until finally resolved under the applicable procedure of this Article.","(E) No jurisdictional dispute shall excuse a violation of Article 8. Individuals violating this section shall be subject to immediate discharge.","(F) This jurisdictional dispute resolution procedure will only apply to work performed at the site of the Project.","ARTICLE 12 - WAGES AND BENEFITS\nSECTION 1. CLASSIFICATION AND BASE HOURLY RATE","All employecs covered by this Agreement shall be compensated at the wage rates set forth in the applicable Schedule A collective bargaining agreement or as established under the Davis- Bacon Act in the applicable wage decision, whichever rate is higher (hereinafter “Base Rate”).","In addition, Journeymen covered by this Agreement shall be entitled to an additional $10/hour incentive added to the Base Rate; and the Apprentice percentage rates set forth in the Schedule A collective bargaining agreements shall be calculated based on the incentivized Journeyman rate (.e. the Base Rate + $10/hour). Notwithstanding the previous sentence, it is expressly understood and agreed that the Journeyman and Apprentice incentive rates set forth in the previous sentence may be discontinued, increased or otherwise changed on thirty (30) days’","written notice by Owner or EPC Prime Contractor. Any such change(s) shall be reduced to a","26","4888-7476-5718.1 / 117346- 1004","Micron Confidential"],["memorandum signed by the Owner and/or EPC Contractor and acknowledged by the Unions to memorialize the change(s). The failure or refusal of the Unions to acknowledge any such memorandum shall not prevent the Owner’s or EPC Contractor’s change(s) from becoming","effective after tendering notice of the change(s) to the Unions.","SECTION 2. EMPLOYEE BENEFIT FUNDS","(A) Contractors agree to pay contributions on behalf of employees covered by this Agreement and for work performed subject to this Agreement to the Unions’ established employee benefit and industry funds in the amounts designated in the applicable Schedule A collective bargaining agreement. Unions and/or their related employee benefit funds may notify the EPC Prime Contractor, in writing, of any benefit fund contribution delinquency arising under this\nSection 2(A), in which case the EPC Prime Contractor shall withhold from any funds due to the affected Contractor the amount of that delinquency, up to the total amount due the Contractor, until any dispute regarding the delinquency has been resolved. The Owner and EPC Prime Contractor shall have no other obligation with respect to contributions owed by any Contractor. If notice of a delinquency is not received by the EPC Prime Contractor, the EPC Prime Contractor shall have no obligation to withhold, with respect to that delinquency, any part of a payment which is otherwise due. The collection of delinquent employee benefit contributions will in all other respects be governed by the applicable Schedule A collective bargaining agreement.","(B) Notwithstanding Section 2(A), above, Contractors who employ individuals pursuant to Article 4, Section 2(B)(1) or (C), and who maintain bona fide private benefit plans which satisfy the requirements of the Internal Revenue Code, may satisfy the above benefit obligation with respect to such employees by providing coverage under their private benefit plans or by electing to pay the applicable jointly trusteed funds designated in the applicable Schedule A collective bargaining agreement on their behalf, at the Contractor’s option. The total benefit payment to be made by a Contractor on behalf of such employees must equal the total supplement amount set forth in the applicable Schedule A collective bargaining agreement, and any shortfall must be paid by cash supplement to the employee.","(C) Contractors that contribute to jointly trusteed funds under this Section agree to be bound by the written terms of the legally established Trust Agreements specifying the detailed","basis on which payments are to be paid into, and benefits paid out of, such trust funds, but only","27","4888-7476-5718.1 / 117346-1004","Micron Confidential"],["with regard to work done on this Project and only for those employees to whom this Agreement","requires such benefit payments.","SECTION 3. MEAL SUBSIDY","Owner shall make available to employees working under this Agreement two (2) meals each workday at prices discounted to reflect a 60% subsidy by Owner. Notwithstanding the previous sentence, it is expressly understood and agreed that meal subsidies may be discontinued, increased or otherwise changed on thirty (30) days’ written notice by Owner or EPC Prime Contractor. Any such change(s) shall be reduced to a memorandum signed by the Owner and/or EPC Contractor and acknowledged by the Unions to memorialize the change(s). The failure or refusal of the Unions to acknowledge any such memorandum shall not prevent the Owner’s or","EPC Contractor’s change(s) from becoming effective after tendering notice of the change(s).","ARTICLE 13 - HOURS OF WORK. PREMIUM PAYMENTS. SHIFTS & HOLIDAYS","SECTION 1. WORK WEEK AND WORK DAY","The standard work week shall consist of no more than 40 hours of work, 8 hours per day, at straight time rates based on a five-day work week, Monday through Friday, with a ten (10) minute break in the morning occurring a half hour (1/2) unpaid lunch period, and a ten (10) minute break in the afternoon, as scheduled by the Contractor and consistent with industry practice. There shall be no other recognized break times. Contractors may elect to work four, 10 hour days at straight time rates, with a ten (10) minute break in the morning and afternoon and a half hour (1/2) unpaid lunch period each day.","SECTION 2. SHIFT WORK\n(A) The EPC Prime Contractor shall have the discretion to establish the number of","shifts, shift schedules, work hours, and starting times as needed to complete Project work in an efficient manner, including but not limited to the right to establish a regular workweek of between four (4) and six (6) days, ten (10) hours each day. Contractors shall provide not less than five work days’ notice to the Union of shift schedules and shift starting times, or such lesser notice as may be mutually agreed upon.","(B)  Shifts— The day shift shall start between the hours of 6:00 a.m. and 8:00 a.m. In","the event the EPC Prime Contractor establishes multiple shifts, the second shift shall start between","4888-7476-5718.1 / 117346-1004","Micron Confidential"],["3 p.m. and 6 p.m. and the third shift shall start between 11 p.m. and 2 a.m., subject to different times necessitated by the phasing plans on the project. Shift premiums shall paid in accordance with the applicable Schedule A collective bargaining agreement.","(C) In scheduled five day/eight hour shift work-weeks, Saturday may be scheduled as a “make-up” day at straight time to make up for a day lost (Monday through Friday) due to inclement weather; in scheduled four day/ten hour shift work weeks, Friday may be scheduled as a “make-up” day at straight time to make up for a lost day (Monday through Thursday) due to inclement weather, and if Friday is lost due to inclement weather, then Saturday may be used as a “make up” day to make up for the inability to have a make up day on Friday.","SECTION 3. OVERTIME","Overtime shall be paid at one and one-half (1 and1/2) times the straight time rate for all hours worked in excess of eight (8) per day during a scheduled five day/eight hour shift workweek; all hours worked in excess of ten (10) per day during a scheduled four day/ten hour shift work-week; and unless otherwise provided in this Agreement, all hours worked on Saturday. All hours worked on Sunday shall paid double the straight time rate. There will be no restriction upon the Contractor’s scheduling of overtime or the nondiscriminatory designation of employees who shall be worked. There shall be no pyramiding of overtime pay under any circumstances. The Contractor shall have the right to schedule work so as to minimize overtime.","SECTION 4. HOLIDAYS\n(A) Schedule -There shall be seven (7) recognized holidays on the Project, as follows:","New Year’s Day (January Ist)","Labor Day (1st Monday in September)","Martin Luther King Day (3rd Monday in January) Thanksgiving Day (4th Thursday in November) Memorial Day (Last Monday in May)","Christmas Day (December 75th)","Independence Day (July 4th)","(B) All said holidays shail be observed on the dates designated by federal law. In the absence of such designations, they shall be observed on the calendar date except those listed holidays which occur on Sunday shall be observed on the following Monday. Holidays falling on Saturday are to be observed on the preceding Friday.","(C) Payment — All hours worked on holidays shall be paid at double the straight time rate. No payment shall be made for holidays unless worked.","29 4888-74 76-57 18.1 / 117346-1006","Micron Confidential"],["SECTION 5. REPORTING PAY","(A) | Employees who report to the work location at the Contractor’s request pursuant to regular schedule and who are not provided with work or whose work is terminated early by a Contractor shall receive minimum reporting pay in accordance with the amounts and practices in the applicable Schedule A collective bargaining agreement.","(B) When an employee who has completed his/her scheduled shift and left the Project site, is “called back” to perform special work of a casual, incidental or irregular nature, the employce shall receive pay for actual hours worked, with a minimum guarantee as may be required by the applicable Schedule A collective bargaining agreement.","(C) When an employee leaves the job or work location of their own volition or is discharged for cause or is not working as a result of the Contractor’s invocation of Section 7 below, they shall be paid only for the actual time worked. Except as specifically set forth in this Article there shall be no premiums, bonuses, hazardous duty, or other special payments of any kind except premiums for overtime work.","(D) There shall be no pay for time not actually worked except as specifically set forth in this Agreement.","SECTION 6. PAYMENT OF WAGES","Contractors shall be permitted, but not required, to pay wages via direct deposit in accordance with Idaho law. Employees working under this Agreement may be required to provide their employing Contractor with bank account and other information necessary to pay the employee via direct deposit. Paychecks shall be issued by union signatory contractors by the end of the scheduled workday on Thursday.","SECTION 7. EMERGENCY WORK SUSPENSION","The EPC Prime Contractor may, if necessary for the protection of life and/or safety of employees or others or for reasons deemed essential to the Project, suspend all or a portion of Project Work. In such instances, employees will be paid for actual time worked; provided, however, that when the EPC Prime Contractor requests that employees remain at the job site","available for work, employees will be paid for “stand-by” time at their regular hourly rate of pay.","A888-7476-5718.0 / L17346-1004","Micron Confidential"],["SECTION 8, TIME KEEPING","Contractors may utilize brassing or other systems to check employees in and out. Each employee must check in and out. The Contractor will provide adequate facilities for checking in and out in an expeditious manner.","SECTION 9. MEAL PERIOD","Contractor shall schedule an unpaid period of not more than % hour duration at the work location between the 3“ and 5\" hour of the scheduled shift for meals and rest. A Contractor may, for efficiency of operation, establish a schedule which coordinates the meal periods of two or more crafts. If an employee is required to work through the meal period, the employee shall be compensated in a manner established in the applicable Schedule A collective bargaining agreement.","SECTION 10. BREAK PERIODS","There will not be organized rest periods, coffee breaks or other non-working time other than that provided for in this Article 13 established during working hours. Individual coffee containers will be permitted at the employee’s work location.","SECTION 11. TRAVEL PAY","Contractors shall pay employees a $240 per workday travel per diem provided the employee has not resided within 75 miles from the work site for ninety (90) days prior to their start date on the Project. The per diem travel payment may be decreased, discontinued, increased or otherwise changed on thirty (30) days’ written notice by Owner or EPC Prime Contractor. Any such change(s) shall be reduced to a memorandum signed by the Owner and/or EPC Contractor and acknowledged by the Unions to memorialize the change(s). The failure or refusal of the Unions to acknowledge any such memorandum shall not prevent the Owner’s or EPC Contractor’s change(s) from becoming effective after tendering notice of the change(s) to the Unions.\nSECTION 12. RECORD KEEPING REQUIREMENTS","(A) All Contractors shall keep an accurate record showing the name, craft or classification, number of hours worked per day and the hourly rate of wage paid, including benefits, to each employee employed by the Contractor in connection with the Project. This record shall be retained for a minimum of two (2) years following completion of the Project, and made available for inspection by the EPC Prime Contractor and/or, if relevant, the state or federal","Department of Labor upon request.","4888-7476-5718.1 / 117346-1004","Micron Confidential"],["(B) Each Contractor shall file a statement each week and a final statement upon completion of their work on the Project, certifying that their employees have been paid wages in strict conformity with the provisions of this Agreement and, if wages remain unpaid, setting forth the amounts due and the names of the employees to whom they are due.","ARTICLE 14 - SAFETY PROTECTION OF PERSON AND PROPERTY\nSECTION 1. SAFETY REQUIREMENTS","(A) | The Owner or EPC Prime Contractor, in their sole discretion, may establish safety protocols tor the entire Project. Contractors will ensure that applicable OSHA requirements and other requirements set forth in contract documents and/or safety protocols are at all times maintained on the Project, and the employees and Unions agree to cooperate fully with these efforts.","(B) Employees must perform their work at all times in a safe manner and protect themselves and the property of Contractors and the Owner from injury or harm consistent with established safety protocols to be implemented by the EPC Prime Contractor. Employees covered by this Agreement shall at all times be bound by the safety, security and visitor rules as established by the Contractors and the EPC Prime Contractor for this Project. Such rules will be published and posted in conspicuous places throughout the Project. Strict compliance by all employees with such safety rules and protocols is required at all times. Any individual who violates such safety rules and protocols may be subject to immediate removal from the Project Site and/or discharge.\nSECTION 2, CONTRACTOR/PROJECT RULES & REGULATIONS","(A) The EPC Prime Contractor and/or Contractors shall establish such reasonable Project rules and regulations as are appropriate for the good order of the Project, provided they do not violate the terms of this Agreement. Such rules and regulation will be explained at the pre-job conference and posted at the Protect site and may be amended thereafter as necessary, provided that any rule or regulation that was not explained at the pre-job conference shall not be effective until the Unions have been given at least five (5) working days’ notice of such rule or regulation.","(B) Employees covered by this Agreement shall at all times be bound by the reasonable rules and regulations established by the EPC Prime Contractor or Contractors for the Project, including but not limited to: a requirement that visitors (with the exception of Union business representatives) execute a waiver of liability in order to gain access to the Project site; and a","requirement that the use of tobacco products will only be used in officially designated areas.","32 4888-7476-5718.1 / 17346-1004","Micron Confidential"],["(C) Failure of an employee to observe reasonable rules and regulations promulgated pursuant to this provision shall be grounds for discipline, including discharge. The fact that no order was posted prohibiting a certain type of misconduct shall not be a defense to an employee disciplined or discharged for such misconduct when the action taken is for cause.","(D) Such reasonable rules and regulations will be published and posted in conspicuous places throughout the Project.","(E) The EPC Prime Contractor reserves the right to issue additional rules, including but not limited to rules concerning installation of clean rooms. These rules will be explained at the pre-job conference/orientation and posted at the Project site and may be amended thereafter as necessary, provided that any such additional rule or amendment thereof that was not explained at the pre-job conference shall not be effective until the Unions have been provided with at least five\n(5) working days’ notice of such rule or amendment thereof.","(F) Failure of an employee to observe these reasonable rules and regulations shall be grounds for discipline, including discharge. The fact that no order was posted prohibiting a certain type of misconduct shall not be a defense to an employee disciplined or discharged for such misconduct when the action taken is for cause.","SECTION 3. INSPECTIONS","The Contractors and the EPC Prime Contractor retain the right to inspect incoming shipments of equipment, apparatus, machinery and construction materials of every kind, for any reason or no reason at all.","SECTION 4, SUBSTANCE ABUSE TESTING","(A) It is crucial to a sate working environment that all employees be free from the use of controlled substances. Therefore, all employees working on this Project will be subject to prehire, random, post-accident and reasonable suspicion testing in accordance with the Idaho Employer Alcohol and Drug-Free Workplace Act and any applicable federal regulations. The testing policy that will apply to the Project is attached as Schedule F,","(B) | Employees testing positive for drugs/alcohol will be discharged and prohibited from future employment on the Project.","(C) This Article shall supersede any inconsistent provision in any CBA of a Union","signatory to this Agreement.","4888-7476-5718.1 / $17346-1004","Micron Confidential"],["ARTICLE 15 - GENERAL TERMS","SECTION 1. TOOLS OF THE TRADES- EMERGENCY USE","There shall be no restrictions on the emergency use of any tools or equipment by any qualified employee or on the use of any tools or equipment for the performance of work within the employee’s jurisdiction and such use will not result in an increase or decrease in the employee’s regular rate of pay.\nSECTION 2. TEMPORARY SERVICES","Temporary services shall only be required upon the specific request of the EPC Prime Contractor, and when used shall be assigned to the appropriate trade claiming jurisdiction. This shall include temporary services that would otherwise be required to monitor the heating, cooling and ventilation of the Project. Temporary system coverage shall be provided by the appropriate Contractors’ existing employees during working hours in which a shift is scheduled for employees of this Contractor and EPC Prime Contractor and/or Contractors shall not be required to hire additional standby personnel in addition to existing employees working during such shifts. The EPC Prime Contractor may determine the need for temporary system coverage requirements during non-working hours. There shall be no stacking of trades on temporary services. In the event a temporary system is claimed by multiple trades, the matter shall be resolved in accordance with the provisions of Article 11.\nSECTION 3. INSURANCE","At the Owner’s election, the Project may be insured through (a) a Contractor Controlled Insurance Program (CCIP), (b) an Owner Controlled Insurance Program (OCIP), or (c) a combination thereof.","SECTION 4. FULL WORK DAY","Employees shall be at their staging area at the starting time established by the Contractor and shall be returned to their staging area by quitting time after performing their assigned functions under the supervision of the Contractor. The signatories reaffirm their policy of a fair day’s work for a fair day’s wage. In the event parking lot shuttles are made available for the convenience and voluntary use of employees, time spent riding the parking lot shuttles is non-work time and is","unpaid. Employees are in on employee time and out on Employer time.","4888-7476-5718.1 / 137346-1004","Micron Confidential"],["ARTICLE 16 - SAVINGS AND SEPARABILITY","SECTION 1. THIS AGREEMENT","In the event that the application of any provision of this Agreement is enjoined, on either an interlocutory or permanent basis, or otherwise found in violation of any law, the remainder of this Agreement shall remain in full force and effect. The parties will enter into negotiations for a substitute provision in conformity with the law and the intent of the parties for contracts to be awarded in the future.\nSECTION 2. THE BID SPECIFICATIONS","In the event that the Project documents, or other action, requiring that a successful bidder become signatory to this Agreement is enjoined, on either an interlocutory or permanent basis, or otherwise found in violation of law, such requirement shall be rendered, temporarily or permanently, null and void but the Agreement shall remain in full force and effect to the extent allowed by law. In such event, the Agreement shall remain in effect. The parties will enter into negotiations as to modifications to the Agreement to reflect the court action taken and the intent of the parties for contracts to be let in the future.","SECTION 3. NON-LIABILITY","In the event of an occurrence referenced in Section 1 or Section 2 of this Article, neither the Owner, the EPC Prime Contractor, any Contractor, nor any Union shall be liable, directly or indirectly, to any of the others for any action taken, or not taken, to comply with any court order, injunction or determination. Project documents will be issued in conformance with court orders in effect and no retroactive payments or other action will be required if the original court determination is ultimately reversed.","SECTION 4. NON-WAIVER","Nothing in this Article shall be construed as waiving the prohibitions of Article 8 as to signatory Contractors and signatory Unions.","ARTICLE 17 - FUTURE CHANGES IN SCHEDULE A AREA CONTRACTS\nSECTION 1. CHANGES TO AREA CONTRACTS","(A) To the extent applicable to the Project, the collective bargaining agreements appended hereto at Schedule A shall continue in effect until the Project is completed, or until the applicable collective bargaining agreements for the Unions signatory to this Agreement expire and","written notice is given to the EPC Prime Contractor and Owner that they have been renegotiated","35","4888-7476-5718.1 7 1 17346-1004","Micron Confidential"],["in good faith, with a listing of all mutually agreed upon changes to such agreements which are applicable to the Project, and their effective dates.","(B) Any provisions ina Schedule A collective bargaining agreement will not apply to Project work if such provisions are less favorable than those required of contractors for construction work, other than this Project, normally covered by those agreements; nor shall any provision be recognized or applied on this Project if it may be construed to apply exclusively, or predominantly, to work covered by this Agreement.","(C) Any disagreement between signatories or parties to this Agreement over the incorporation into Schedule A of provisions agreed upon in the renegotiation of area collective bargaining agreements shall be resolved tn accordance with the grievance and arbitration procedure set forth in Article 10 above.","SECTION 2. LABOR DISPUTES DURING AREA CONTRACT NEGOTIATIONS","The Unions agree that there will be no strikes, work stoppages, sympathy actions, picketing, slowdowns or other disruptive activity or other violations of Article 8 affecting the Project by any Union involved in the renegotiations of area collective bargaining agreements nor shall there be any lockout on the Project affecting a Union during the course of such renegotiations.","ARTICLE 18 - TERM & EXECUTION\nSECTION 1. TERM OF AGREEMENT","(A) | The term of this Agreement shall begin on the Effective Date and shall continue until the Project is complete. If the Owner exercises its right to terminate this Agreement, any designated Project work that has been undertaken under this Agreement during the term and is performed by a signatory Contractor will continue to be governed by this Agreement until completion.","(B) Additional site work that is not within the scope of Article 3 may be added to the scope of this Agreement at any time upon mutual agreement of the parties by a simple addendum describing the specific scope(s) of work and attached to this Agreement.","SECTION 2, EXECUTION OF AGREEMENT","By executing and delivering the Agreement to this other party, each party represents and warrants that it has obtained all the necessary approvals to execute this Agreement. This Agreement may be executed with separate counterpart signature pages referencing this Agreement.","Delivery of an executed counterpart of a signatory page to this Agreement by facsimile or","36 4888-7476-5718.1 / 17346-1004","Micron Confidential"],["electronic transmission shall be as effective as delivery of a manually executed counterpart of this","Agreement. IN WITNESS WHEREOF the parties have caused this Agreement to be executed and","effective as of the Zhi day of DAS » 2023.","i Mod ts i bem By: , EPC Prime Contractor . By: ‘","m4 Sourawest WAHO / EASTERN OREGON BUILDING AND CONSTRUCTION TRADES COUNCIL","37 4888-7476-5718,1 7 17346-1004","Micron Confidential"],["SOUTHWEST IDAHO/EASTERN OREGON BUILDING AND CONSTRUCTION TRADES COUNCIL AFFILIATES:","INTERNATIONAL UNION OF ELEVATORS CONSTRUCTORS, LOCAL NO. 38 By:","(Name & Title) SMART SHEET METAL WORKERS, LOCAL NO. 55 By:","(Name & Title)","INTERNATIONAL ASSOCIATION OF HEAT AND FROST INSULATORS AND ALLIED WORKERS, LOCAL NO. 69","By:","(Name & Title) INTERNATIONAL UNION OF PAINTERS AND ALLIED TRADES LOCAL NO. 77","(Name & Title) LABORS’ INTERNATIONAL UNION OF NORTH AMERICA, LOCAL NO. 155 By:","(Name & Title) ROOFERS, WATERPROOFERS AND ALLIED TRADES WORKERS UNION NO.189 By:","INTERNATIONAL BROTHERHOOD OF ELECTRICAL WORKERS UNION, LOCAL NO. 291","By:","(Name & Title)","UNITED ASSOCIATION OF JOURNEYMEN AND APPRENTICES OF THE PLUMBING AND PIPEFITTING INDUSTRY, LOCAL NO. 296","By:","(Name & Title)","38","4888-7476-5718.1 / 1 17346-1004","Micron Confidential"]],"outline":[{"label":"Article 1 – Preamble","page":5},{"label":"Article 2 – General Conditions","page":6},{"label":"Article 3 – Scope of the Agreement","page":9},{"label":"Article 4 – Union Recognition and Employment","page":13},{"label":"Article 5 – Workforce Development, Anti-Discrimination, Diversity, Equity and Inclusion","page":15},{"label":"Article 6 – Union Representation","page":20},{"label":"Article 7 – Management's Rights","page":21},{"label":"Article 8 – Work Stoppages and Lockouts","page":21},{"label":"Article 9 – Labor Management Committee","page":24},{"label":"Article 10 – Grievance & Arbitration Procedure","page":25},{"label":"Article 11 – Jurisdictional Disputes","page":26},{"label":"Article 12 – Wages and Benefits","page":27},{"label":"Article 13 – Hours of Work. Premium Payments. Shifts & Holidays","page":29},{"label":"Article 14 – Safety Protection of Person and Property","page":33},{"label":"Article 15 – General Terms","page":35},{"label":"Article 16 – Savings and Separability","page":36},{"label":"Article 17 – Future Changes in Schedule a Area Contracts","page":36},{"label":"Article 18 – Term & Execution","page":37}]},{"id":"travel-pay","pdf":"Micron_Travel_Pay_Change_2025.pdf","group":"Micron Boise Project","title":"Travel Pay / Per Diem Change","sub":"PLA Art. 13, Sec. 11 · Exyte notice dated May 2, 2025","pages":[["Exyte U.S., Inc. A Company of the Exyte Group","May 2, 2025 Response Required: Yes","For the Attention of Southwest Idaho, Eastern Oregon Building Trades Council","Subject:","Micron ID1 (Triton) Project\nArticle 13, Section 11 Travel Pay Changes","The Owner and Prime Contractor at Micron ID1 offer per diem pay to eligible workers. Per diem pay is provided to offer financial support to employees who must travel away from their primary residence for work purposes. This allowance helps to cover the additional costs incurred for lodging, meals, and incidental expenses during the period the employee is required to remain away from home. By providing per diem pay, the Owner and Prime Contractor aim to ensure that all employees are fairly compensated for the inconvenience and additional expenses associated with travel, fostering a balanced and supportive work environment that aligns with the principles of the Project Labor Agreement (“PLA”). In order to reduce ongoing confusion related to how and when the travel per diem for employees who do not live within 75 miles of the work site is paid, and to address concerns raised by various definitions of a workday both under the PLA and federal guidelines, the Owner and Prime Contractor are exercising their rights under Article 13, Section 11 Travel Pay, to decrease, discontinue, increase or otherwise change on thirty (30) days’ written notice the per diem travel payment. Accordingly, this letter serves as the required 30-Day Notice to change the current “$240 per workday travel per diem.” Effective thirty days from the above date, the per diem travel rate will be updated as specified below. The Owner and Prime Contractor’s intent is to address these questions definitively while ensuring all employees receive fair and equal treatment under the PLA. The Owner and EPC Contractor seek to clarify that workers who do not live within 75 miles of the work site are eligible for the travel pay for each day, up to 7 days per week, the worker is away from home. The Owner and EPC Contractor have agreed to reduce the daily rate to $170 per day away from home. Should employees leave the area to return home or for other reasons not related to the Project, they will not be eligible for per diem. It will be the employee’s responsibility to report their absence from the area. After reviewing this letter, each member organization should acknowledge the changes by placing its signature below. Please contact Exyte Labor Relations with any questions or concerns.","Exyte U.S., Inc., 1500 W Shoreline Drive, Suite 103, Boise, ID 83702 | www.exyte.net Page 1 of 5"],["Exyte U.S., Inc. A Company of the Exyte Group","On behalf of Exyte U.S., Inc.,","On behalf of Micron, Inc. //s//","//s// Mark Vokes Senior Project Director","Heather Baldwin Vice President, Procurement","//s// Emils Skulte Senior Director, Commercial- Prime Contract","On behalf of Southwest Idaho, Easter Oregon Business Trade Council SOUTHWEST IDAHO/EASTERN OREGON BUILDING AND CONSTRUCTION TRADES COUNCIL AFFILIATES: On behalf of: INTERNATIONAL UNION OF ELEVATORS CONSTRUCTORS, LOCAL NO. 38","By: _______________________________ (Name & Title) SMART SHEET METAL WORKERS, LOCAL NO. 55","By: ________________________________ (Name & Title) INTERNATIONAL ASSOCIATION OF HEAT AND FROST INSULATORS AND ALLIED WORKERS, LOCAL NO. 69","By: ________________________________ (Name & Title) INTERNATIONAL UNION OF PAINTERS AND ALLIED TRADES LOCAL NO. 77 Exyte U.S., Inc., 1500 W Shoreline Drive, Suite 103, Boise, ID 83702 | www.exyte.net Page 2 of 5"],["Exyte U.S., Inc. A Company of the Exyte Group","___________________________________ (Name & Title) LABORS’ INTERNATIONAL UNION OF NORTH AMERICA, LOCAL NO. 155","By: ________________________________ (Name & Title) ROOFERS, WATERPROOFERS AND ALLIED TRADES WORKERS UNION NO.189","By: ________________________________ (Name & Title) INTERNATIONAL BROTHERHOOD OF ELECTRICAL WORKERS UNION, LOCAL NO. 291","By: ________________________________ (Name & Title) UNITED ASSOCIATION OF JOURNEYMEN AND APPRENTICES OF THE PLUMBING AND PIPEFITTING INDUSTRY, LOCAL NO. 296","By: ________________________________ (Name & Title) INTERNATIONAL UNION OF OPERATING ENGINEERS, LOCAL NO. 302","By: ________________________________ (Name & Title) INTERNATIONAL BROTHERHOOD OF TEAMSTERS UNION, LOCAL NO. 483","By: ________________________________ (Name & Title)","Exyte U.S., Inc., 1500 W Shoreline Drive, Suite 103, Boise, ID 83702 | www.exyte.net Page 3 of 5"],["Exyte U.S., Inc. A Company of the Exyte Group","CEMENT MASONS, LOCAL NO. 555","By: ________________________________ (Name & Title) UNITED BROTHERHOOD OF CARPENTERS AND JOINTERS, LOCAL NO. 635","By: ________________________________ (Name & Title)","Exyte U.S., Inc., 1500 W Shoreline Drive, Suite 103, Boise, ID 83702 | www.exyte.net Page 4 of 5"],["Exyte U.S., Inc. A Company of the Exyte Group","ROAD SPRINKLER FITTERS UNION, LOCAL NO. 669","By: ________________________________ (Name & Title) INTERNATIONAL UNION OF IRON WORKERS, LOCAL NO. 732","By: ________________________________ (Name & Title) REINFORCING IRONWORKERS’ UNION, LOCAL NO. 847","By: ________________________________ (Name & Title) BRICKLAYERS AND ALLIED CRAFT WORKERS UNION, LOCAL NO. 1","By: ________________________________ (Name & Title)","Exyte U.S., Inc., 1500 W Shoreline Drive, Suite 103, Boise, ID 83702 | www.exyte.net Page 5 of 5"]],"outline":[]},{"id":"veca","pdf":"VECA_Meta_Incentive_Program.pdf","group":"Meta Kuna Project (VECA)","title":"Retention / Incentive Program","sub":"Meta KND 3&5, Kuna · Rev. 1, April 2026","pages":[["April 10, 2026","RETENTION / INCENTIVE PROGRAM Rev. 1 – Updates effective and applied to hours worked starting on April 13th, 2026","Re: Project:","Meta - KND 3&5","Site Location :","6990 Kuna-Mora Rd Kuna, ID 83634","Purpose: The incentive program described herein is designed to attract and retain participants for their contribution to the projects identified above, while taking account of the overall performance of VECA Electric and Technologies LLC (“VECA”) on said projects. VECA provides IBEW with permission to distribute the incentive details as listed below. Incentive Program Guidelines","Plan Period: This Retention Incentive Program began on January 19, 2026, is amended on April 13th, 2026, and is planned to run for the duration of the project.\no Qualification for both updated incentive programs will commence on 4/13/2026 and will be paid with payroll for week ending 4/19/2026.\no Any changes to this program will be at VECA’s discretion. Details:\no In compliance with the LOU regarding Incentive or Retention Bonuses signed 11/25/2025 and the Fair Labor Standards Act; qualified employees will be provided with an hourly and a daily additional incentive, details for each are described below.\n Hourly rate adder - $20/hr. over CBA Journey Wireman scale. The modified base scale will be subject to all normal, overtime, and double time calculations, regardless of how many hours are worked each day.\n• Other classifications General Foreman, Foreman, Apprentices, CWs, CEs, and Stockman classifications are to be paid according to the CBA percentages for each classification but based on the modified journeyman base wage.\n Full Day Worked Incentive – Additional O/T Premium Pay = When all scheduled hours are worked daily, regardless of the number of hours scheduled for any given work shift, additional premium pay will be paid for the first two hours of overtime as shown in the table per classification.\n• Additional premium pay will be paid as an additional percentage added to the standard overtime rates required by the CBA and the FSLA.\n• Base schedule for this project is 5x8s Monday-Friday and it is currently scheduled to work 6x10s Monday-Saturday.","_____________________________________________________________________________ 5614 – 7th Avenue South • Seattle, WA 98108-2644 www.veca.com • 206-436-5200 • 800-974-VECA • Fax 206-763-0505 Page 1 of 4"],["Hours worked Monday – Friday during regularly scheduled hours will be paid at CBA straight time, all hours worked outside of the regularly scheduled hours will be paid at one and one-half times the straight time rate as required by the CBA.\n• Hours worked on Saturday will be paid at one and one-half times the straight time rate as required by the CBA.\n• When all scheduled hours are worked on any given day the employee will qualify for “Additional O/T Premium Pay” paid as an additional one and one-half times the straight time rate as required by the CBA on their first two overtime hours. All other hours will be paid per the CBA.\no Incentives will be paid out weekly on the same days as payroll is distributed, following the week the employee qualifies for the incentive.\no Wages will be paid based on the current title/position and progression held by each employee (GF, F, JW, Apprentice, CWs, and CEs) as stipulated in the CBA and current wage sheet.\no Superintendents are not included in this program.\no Full Day Worked Incentive is for licensed electricians and trainees only and will not be paid to anyone working under the Stockman classification.\no Any previous incentives or wage adders are hereby terminated and replaced by this incentive program (except for amounts required under the CBA). Qualifications:\no Hourly rate adder – Applies to all hours worked.\no Full Day Worked Incentive – Additional O/T Premium Pay\n Employees must work all available regular and overtime hours daily; these will be established and communicated as needed by the project. While working overtime is not mandatory it is required to receive the daily “Additional O/T Premium Pay”.\n Failure to work all hours scheduled for each workday will disqualify employees from receiving “Additional O/T Premium Pay” for that day.","General Terms:\n• Workday(s) - Will be defined as Monday, Tuesday, Wednesday, Thursday, Friday, and Saturday.\n• Scheduled Hours – All work hours will be communicated a minimum of 8 hours prior to the next work period, either verbally or in writing by a direct supervisor or other supervising member of the field management team to any worker.\n• CBA required overtime to be paid regardless of incentive eligibility. This incentive is a separate, optional program tied to project staffing needs.\n• Traveling employees, as designated by VECA, receiving per diem will not be eligible for incentive pay.\n• VECA reserves its right to change the wording, modify, or cancel this incentive program, including but not limited to scheduled days, hours, and incentive value, by providing the participants with notice of the modification or cancelation.\no Employees will be provided with a minimum of 8 hours’ notice prior to changes to scheduled work hours.\no Minimum 24 hours’ notice will be provided prior to cancellation of the program, or changes to values or qualification requirements. Notification will be provided to the GC, IBEW L.U. 291, NECA, and all current employees working under this program.","_____________________________________________________________________________ 5614 – 7th Avenue South • Seattle, WA 98108-2644 www.veca.com • 206-436-5200 • 800-974-VECA • Fax 206-763-0505 Page 2 of 4"],["All applicable payroll taxes and union dues will apply as required by law and additionally defined by the current CBA and LOU regarding Incentive and Retention Bonuses and will be deducted as required. Apprentices in good standing attending their normally scheduled class according to the JATC provided calendar, but otherwise working all scheduled hours will still be eligible for additional premium pay on O/T hours worked as described above. Calculations Sheet","Full Day Worked Incentive – Additional O/T Premium Pay – Is an additional 150% (1.50 multiplier) premium overtime rate based on the CBA base rate + the hourly rate adder added to the base line O/T required by the CBA and is based on the classifications listed in L.U. 291 CBA. Monday – Friday: Bonus Calculations based on a 5x8s working 5x10s schedule\n• Example Calculations: [(ST rate + hourly rate adder) x 8 + (OT rate + hourly rate adder x 1.5) x 2] + Additional O/T Premium Pay.\no Journey Wireman = [($45.33 + $20) x 8 + ($68.00 + $30) x 2] + 150%/hr. additional O/T premium pay for each of the first two O/T hours worked, CBA base rate + $20/hr. x 1.50.\no Wireman Welder = [($49.86 + $22) x 8 + ($74.79 + $33) x 2] + 150%/hr. additional O/T premium pay for each of the first two O/T hours  District.........................................................................................Jerry Bellah 305 S Union Avenue Pueblo, Colorado 81003","Ninth District.................................................................................John J. O’Rourke 100 Bush Street, Suite 1950 San Francisco, California 94104 Form 40 1/23","(Listing continued on inside back cover)"],["This organization shall be known as the","INTERNATIONAL BROTHERHOOD OF ELECTRICAL WORKERS with jurisdiction over all electrical workers in the United States and Canada.","CONSTITUTION This Constitution, and all acts and proceedings, which in the future and in due course may be enacted, shall be binding on all local union officers and members. As amended at the 40th IBEW International Convention Chicago, Illinois—May 2022 © 2022 International Brotherhood of Electrical Workers All rights reserved.","“I.B.E.W.” and “International Brotherhood of Electrical Workers” are registered trademarks in the United States and Canada."],["Declaration of the","INTERNATIONAL BROTHERHOOD OF ELECTRICAL WORKERS Our cause is the cause of human justice, human rights, human security. We refuse, and will always refuse, to condone or tolerate dictatorship or oppression of any kind. We will find and expel from our midst any who might attempt to destroy, by subversion, all that we stand for. This Brotherhood will continue to oppose communism, Nazism, racism, sexism, fascism or any other subversive “ism.” We will support our God, our Nations, our Union.","ii"],["ORDER OF BUSINESS FOR LOCAL UNIONS 1.","Opening (See Ritual for Local Unions)","3.","Communications and Bills","2. 4. 5. 6. 7. 8. 9.","Roll Call of Officers and Reading of Minutes Reports of Executive Board and Officers Propositions for Membership Reports of Candidates","Balloting or Voting for Candidates","Obligation of Candidates (See Ritual for Local Unions) Reports of Delegates and Committees","10. Reports of Accidents, Sickness, or Death of Members","11. Roll Call of Members (This is optional with local unions.)\n12. Unfinished Business","13. New Business (Under this heading come matters relating to any election and installation of officers.)\n14. Good of the Union","15. Receipts and Expenses (See Constitution Article XVII)\n16. Closing (See Ritual for Local Unions)","iii"],["OBJECTS The objects of the International Brotherhood of Electrical Workers are:\n• To organize all workers in the entire electrical industry in the United States and Canada, including all those in public utilities and electrical manufacturing, into local unions,\n• To promote reasonable methods of work,\n• To cultivate feelings of friendship among those of our industry,\n• To settle all disputes between employers and employees by arbitration (if possible),\n• To assist each other in sickness or distress,\n• To secure employment,\n• To reduce the hours of daily labor,\n• To secure adequate pay for our work,\n• To seek a higher and higher standard of living,\n• To seek security for the individual,\n• And by legal and proper means to elevate the moral, intellectual and social conditions of our members, their families and dependents, in the interest of a higher standard of citizenship.","iv"],["Contents Article ....................................................................................... Page Ready Reference (for Monthly Per Capita Tax Payments)................................................................... vi I Name and Constitution.....................................................1 II International Convention.................................................2 III International Officers........................................................8 IV International President................................................. 16 V Imperative Mandate....................................................... 20 VI International Secretary-Treasurer............................... 21 VII International Vice Presidents.............................
