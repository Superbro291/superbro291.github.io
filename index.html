 vacation each year to every employee employed under the terms of this Agreement with a minimum of fifteen (15) days prior notice. Days off covered by the Family Medical Leave Act or personal sick days are not to be counted as vacation days. No more than twenty percent (20%) of the employees in any shop or on any job shall be granted their vacation at the same time unless agreed to by the individual Employer.","Pension\nSection 6.08. Each Employer shall contribute to the Eighth District Electrical Pension Fund (the \"Fund\") the sum of five dollars and sixty-two cents ($5.62) for each hour worked by each employee of the Employer performing work covered by this Agreement.(For exceptions, see ARTICLE, III Section 3.05 (b), and ARTICLE V, Section 5.11.) Employer contributions and accompanying payroll reports will be forwarded monthly to such depository 29"],["and on such forms as the Fund shall designate. Employer contributions and reports shall be delinquent if not received by the 15th day of each month. Employer and Union adopt and agree to be bound by all the terms and provisions of the Second Amended And Restated Agreement And Declaration Of Trust Of The Eighth District Electrical Pension Fund, as amended (the \"Trust Agreement\") and all Rules and Regulations of the Pension Plan and other actions adopted or taken by the Board of Trustees of the Fund pursuant to the powers granted to the Board of Trustees by the Trust Agreement. Employer designates and appoints as its representatives on the Board of Trustees of the Fund, the Employer Trustees appointed in the manner provided in the Trust Agreement. Union designates and appoints as its representatives on the Board of Trustees of the Fund, the Union Trustees appointed in the manner provided in the Trust Agreement. The failure of any individual employer to comply with the applicable provisions of the Restated Employees Benefit Agreement and Trust shall also constitute a breach of this labor agreement.","Annuity\nSection 6.09. Each Employer shall contribute to the Eighth District Electrical Pension Fund Annuity Plan (the \"Fund\") the sum of two dollars and fifty cents ($2.50) for each hour worked by each employee of the Employer performing work covered by this Agreement. (For exceptions, see ARTICLE, III Section 3.05 (b), and ARTICLE V, Section 5.11.) Employer contributions and accompanying payroll reports will be forwarded monthly to such depository and on such forms as the Fund shall designate. Employer contributions and reports shall be delinquent if not received by the 15th day of each month. Employees performing work covered by this Agreement who are participants in the Eighth District Electrical Pension Fund Annuity Plan (“Fund”) may elect to participate in Fund’s 401(k) Salary Reduction Program (the “Program”) by signing and delivering to the Employers and Fund Administrator an Elective Deferral Authorization (“Authorization”) form approved by the Fund. Employer shall reduce and withhold from the employee’s salary the amount per hour and during the payroll periods specified by the employee in the Authorization. The Authorization and any written modified Authorization shall be delivered to the Employer and Fund Administrator at least 15 days prior to the beginning of the specified payroll period. Employer shall remit and pay to the Fund or its designated depository the total of all reduced salary withheld pursuant to such Authorization on or before the 15th day of the calendar month after the calendar month in which such reduced salary was withheld. Employer’s payments shall be accompanied by such reporting forms as the Fund shall designate. Employer’s payments and reports shall be delinquent if not received by the Fund by the 15th day of each calendar month. Effective July 1, 2016, employees can self-contribute to this 401(k) program in five cent ($.05) increments during the first week after initial referral, and/or make elective deferral or contribution amount adjustments up to a selfcontributed cap subject to the maximum amount allowed by the IRS yearly limits during the first payroll periods in the months of June and January. Employer and Union adopt and agree to be bound by all the terms and provisions of the Second Amended And Restated Agreement And Declaration Of Trust Of The Eighth District Electrical Pension Fund, as amended (the 30"],["\"Trust Agreement\") and all Rules and Regulations of the Annuity Plan and other actions adopted or taken by the Board of Trustees of the Fund pursuant to the powers granted to the Board of Trustees by the Trust Agreement. Employer designates and appoints as its representatives on the Board of Trustees of the Fund, the Employer Trustees appointed in the manner provided in the Trust Agreement. Union designates and appoints as its representatives on the Board of Trustees of the Fund, the Union Trustees appointed in the manner provided in the Trust Agreement. The failure of any individual employer to comply with the applicable provisions of the Restated Employees Benefit Agreement and Trust shall also constitute a breach of this labor agreement.","Administrative Maintenance Fund Statement Statement. Effective June 1, 2017, all Employers signatory to this Agreement shall contribute six tenths of one percent (0.6%) of the rate of pay per hour for each hour worked by each Employee covered by this Agreement to the Administrative Maintenance Fund. The monies are for the purpose of administration of the Collective Bargaining Agreement, grievance procedures and all other management duties and responsibilities in this Agreement. The Administrative Maintenance Fund contribution shall be submitted with all other fringe benefits and/or contribution/payments covered in this Agreement, and payable by the 15th of each month. This fund shall be administered solely by the Chapter and will not be used to the detriment of the Local Union or the IBEW. Enforcement for delinquent payments to this fund shall be the sole responsibility of the Chapter and not the Local Union.\nARTICLE VII – National Electrical Industry Fund (NEIF) (NECA Members Only)\nSection 7.01. Each individual Employer shall contribute an amount not to exceed one percent (1%) nor less than .2 of 1% of the productive electrical payroll, as determined by each local Chapter and approved by the Trustees, with the following exclusions: 1. 2.","Twenty-five percent (25%) of all productive electrical payroll in excess of 75,000 man-hours paid for electrical work in any one Chapter area during any one calendar year, but not exceeding 150,000 man-hours. One hundred percent (100%) of all productive electrical payroll in excess of 150,000 man-hours paid for electrical work in any one Chapter area during any one calendar year.","(Productive electrical payroll is defined as the total wages including overtime paid with respect to all hours worked by all classes of electrical labor for which a rate is established in the prevailing labor area where the business is transacted). Payment shall be forwarded monthly to the National Electrical Industry Fund in a form and manner prescribed by the Trustees no later than fifteen (15) calendar days following the last day of the month in which the labor was performed. Failure to do so will be considered a breach of this Agreement on the part of the individual Employer.","31"],["ARTICLE VIII – Local Labor-Management Cooperation Committee (LMCC)\nSection 8.01. The parties agree to participate in the Labor-Management Cooperation Fund, under authority of\nSection 6(b) of the Labor Management Cooperation Act of 1978, 29 USC S175(a) andS302(c)(9) of the Labor Management Relations Act, 29 USC S186(c)(9). The purposes of this Fund include the following:\n1) to improve communications between representatives of Labor and Management;\n2) to provide workers and employers with opportunities to study and explore new and innovative joint approaches to achieving organizational effectiveness;\n3) to assist workers and employers in solving problems of mutual concern not susceptible to resolution within the collective bargaining process;\n4) to study and explore ways of eliminating potential problems which reduce the competitiveness and inhibit the economic development of the electrical construction industry;\n5) to sponsor programs which improve job security, enhance economic and community development, and promote the general welfare of the community and industry;\n6) to engage in research and development programs concerning various aspects of the industry, including, but not limited to, new technologies, occupational safety and health, labor relations, and new methods of improved production;\n7) to engage in public education and other programs to expand the economic development of the electrical construction industry.\n8) to enhance the involvement of workers in making decisions that affect their working lives; and\n9) to engage in any other lawful activities incidental or related to the accomplishment of these purposes and goals.\nSection 8.02. The Fund shall function in accordance with, and as provided in, it’s Agreement and Declaration of Trust and any amendments thereto and any other of its governing documents. Each Employer hereby accepts, agrees to be bound by, and shall be entitled to participate in the LMCC, as provided in said Agreement and Declaration of Trust.\nSection 8.03. Each employer shall contribute four cents ($.04) per hour worked. Payment shall be forwarded monthly, in a form and manner prescribed by the Trustees, no later than fifteen (15) calendar days following the last day of the month in which the labor was performed. The Idaho Chapter, NECA, or its designee, shall be the collection agent for this Fund.\nSection 8.04. If an Employer fails to make the required contributions to the Fund, the Trustees shall have the right to take whatever steps are necessary to secure compliance. In the event the Employer is in default, the Employer shall be liable for a sum equal to 15% of the delinquent payment, but not less than the sum of twenty dollars ($20), for each month payment of contributions is delinquent to the Fund, such amount being liquidated damages, and not a penalty, reflecting the reasonable damages incurred by the Fund due to the delinquency of the payments. Such amount shall be added to and become a part of the contributions due and payable, and the whole amount due shall bear interest at the rate of ten percent (10%) per annum until paid. The Employer shall also be liable for all costs of collecting the payment together with attorneys’ fees.","32"],["ARTICLE IX – National Labor-Management Cooperation Committee (NLMCC)\nSection 9.01. The parties agree to participate in the NECA-IBEW National Labor-Management Cooperation Fund, under authority of Section 6(b) of the Labor-Management Cooperation Act of 1978, 29 U.S.C. 175(a) and\nSection 302(c)(9) of the Labor-Management Relations Act, 29 U.S.C. 186(c)(9). The purposes of this Fund include the following:\n(1) To improve communication between representatives of labor and management;\n(2) To provide workers and employers with opportunities to study and explore new and innovative joint approaches to achieving organizational effectiveness;\n(3) To assist workers and employers in solving problems of mutual concern not susceptible to resolution within the collective bargaining process;\n(4) To study and explore ways of eliminating potential problems which reduce the competitiveness and inhibit the economic development of the electrical construction industry;\n(5) To sponsor programs which improve job security, enhance economic and community development, and promote the general welfare of the community of the industry;\n(6) To encourage and support the initiation and operation of similarly constituted local labor-management cooperation committees;\n(7) To engage in research and development programs concerning various aspects of the industry, including, but not limited to new technologies, occupational safety and health, labor relations, and new methods of improved production;\n(8) To engage in public education and other programs to expand the economic development of the electrical construction industry;\n(9) To enhance the involvement of workers in making decisions that affect their working lives; and\n(10) To engage in any other lawful activities incidental or related to the accomplishment of these purposes and goals.\nSection 9.02. The Fund shall function in accordance with, and as provided in, it’s Agreement and Declaration of Trust, and any amendments thereto and any other of its governing documents. Each Employer hereby accepts, agrees to be bound by, and shall be entitled to participate in the NLMCC, as provided in said Agreement and Declaration of Trust.\nSection 9.03. Each employer shall contribute one cent (1c) per hour worked under this Agreement up to a maximum of 150,000 hours per year. Payment shall be forwarded monthly, in a form and manner prescribed by the Trustees, no later than fifteen (15) calendar days following the last day of the month in which the labor was performed. The Idaho Chapter, NECA, or its designee, shall be the collection agent for this Fund.\nSection 9.04. If an Employer fails to make the required contributions to the Fund, the Trustees shall have the right to take whatever steps are necessary to secure compliance. In the event the Employer is in default, the Employer shall be liable for a sum equal to 15% of the delinquent payment, but not less than the sum of twenty dollars ($20), for each month payment of contributions is delinquent to the Fund, such amount being liquidated damages, and not a penalty, reflecting the reasonable damages incurred by the Fund due to the delinquency of the payments. Such amount shall be added to and become part of the contributions due and payable, and the whole amount due 33"],["shall bear interest at the rate of ten percent (10%) per annum until paid. The Employer shall also be liable for all costs of collecting the payment together with attorneys’ fees.","Article X – Safety Energized Circuits\nSection 10.11. On all energized circuits of 440 volts AC or 250 volts DC or over, as a safety measure, two or more journeymen must work together. The Employer shall furnish protective equipment for workmen working on energized circuits or equipment carrying above - referenced voltages, and shall furnish first aid kits on any truck assigned to such work.","Power Cable\nSection 10.12. All work of joining, splicing, terminating, insulating and placing of flameproof covering on all lead covered power cable and all power cable 5 KV rating or higher not done with a kit shall be performed by qualified cable splicers. At no time shall cable splicers be required to work on energized circuits. Journeyman cable splicers shall furnish hand tools.","Safety Laws\nSection 10.13. The contractor and employee shall comply with all applicable provisions of the State and Federal health, sanitation, and safety laws and regulations. The Employer shall assure that potable water is available to Employees at the job site.","OSHA Reporting Forms\nSection 10.14. The parties agree to recognize the Local Union’s Safety Committee, and agree to forward to the Local Union a copy of their OSHA 300 reporting results yearly when they are reported to OSHA.","ARTICLE XI - Substance Abuse\nSection 11.01. The dangers and costs that alcohol and other chemical abuses can create in the electrical contracting industry in terms of safety and productivity are significant. The parties to this Agreement resolve to combat chemical abuse in any form and agree that, to be effective, programs to eliminate substance abuse and impairment should contain a strong rehabilitation component. The local parties recognize that the implementation of a drug and alcohol policy and program must be subject to all applicable federal, state, and local laws and regulations. Such policies and programs must also be administered in accordance with accepted scientific principles, and must incorporate procedural safeguards to ensure fairness in application and protection of legitimate interests of privacy and confidentiality. To provide a drug-free workforce for the Electrical Construction Industry, each IBEW local union and NECA chapter shall implement an area-wide Substance Abuse Testing Policy. The policy shall include minimum standards as required by the IBEW and NECA. Should any of the required minimum standards fail to comply with federal, state, and/or local laws and regulations, they shall be modified by the local union and chapter to meet the requirements of those laws and regulations. 34"],["ARTICLE XII Code of Excellence\nSection 12.01. The parties to this Agreement recognize that to meet the needs of our customers, both employer and employee must meet the highest levels of performance, professionalism, and productivity. The Code of Excellence has proven to be a vital element in meeting the customers’ expectations. Therefore each IBEW local union and NECA chapter shall implement a Code of Excellence Program. The program shall include minimum standards as designed by the IBEW and NECA.","ARTICLE XIII Separability Clause\nSection 13.01 Should any provision of this Agreement be declared illegal by any court of competent jurisdiction, such provision shall immediately become null and void, leaving the remainder of the Agreement in full force and effect and the parties shall, thereupon, seek to negotiate substitute provisions which are in conformity with the applicable laws.","35"],["Inside Wireman Agreement Effective December 1, 2025 through November 30, 2029 Signed for Idaho Chapter,","Signed for Local Union 291,","Contractors Association:","Electrical Workers:","National Electrical","Darie Stith","International Brotherhood of","illas/2a Date","Western Division Chairman","Kelly Lamp","ason Taylor","Jeremy Redman Business Manager","NECA Manager","Subject to the Approval of the International President, IBEW","APPROVED","INTERNATIONAL OFFICE -1.B.E.W.","December 17, 2025 Kenneth Cooper, International President This approval does not make the International a party to this agreement.","36","Date","Local Union President","11-25-2025","Date","11/25/2025","11/23/2025 Date"]],"outline":[{"label":"Article I – Standard CIR","page":4},{"label":"Article II – Employer Rights/Union Rights","page":6},{"label":"Article III – Hours/Wages/Working Conditions","page":12},{"label":"Article IV – Referral Procedure","page":21},{"label":"Article V – Standard Inside Apprenticeship and Training","page":25},{"label":"Article VI – Fringe Benefits","page":28},{"label":"Article VII – National Electrical Industry Fund (NEIF) (NECA Members Only)","page":31},{"label":"Article VIII – Local Labor-Management Cooperation Committee (LMCC)","page":32},{"label":"Article IX – National Labor-Management Cooperation Committee (NLMCC)","page":33},{"label":"Article X – Safety","page":34},{"label":"Article XI – Substance Abuse","page":34},{"label":"Article XII – Code of Excellence","page":35},{"label":"Article XIII – Separability Clause","page":35}]},{"id":"bylaws","pdf":"IBEW291_Bylaws_2026.pdf","group":"IBEW Local 291","title":"Local 291 Bylaws","sub":"Approved March 10, 2026","pages":[["BYLAWS","OF","LOCAL UNION 291","INTERNATIONAL BROTHERHOOD","OF","ELECTRICAL WORKERS","BOISE, IDAHO","APPROVED: March 10, 2026"],["ORDER OF BUSINESS l. Opening.\n2. Roll Call of Officers and Reading of Minutes.\n3. Communications and Bills.\n4. Reports of Executive Board and Officers.\n5. Propositions for Membership.\n6. Reports on Candidates.\n7. Balloting or Voting on Candidates.\n8. Obligations of Candidates.\n9. Reports of Delegates and Committees.\n10. Reports of Accidents, Sickness or Death of Members.\n11. Roll Call of Members.\n12. Unfinished Business.\n13. New Business. (Under this heading comes matters relating to any election and installation of officers.)\n14. Good of the Union.\n15. Receipts and Expenses.\n16. Closing. NOTE: This sheet ORDER OF BUSINESS is not a part of the Local Union bylaws. It is attached to the bylaws to provide rules for the orderly conduct of Local Union meetings. Roll Call of Members is optional to the Local Union and may or may not be used as the Local Union decides."],["ARTICLE I Name - Jurisdiction - Objects\nSec. 1. This Organization shall be known as Local Union 291 of the International Brotherhood of Electrical Workers, Boise, Idaho. Local Union 291 shall have jurisdiction over all Outside, Inside, Radio-Television Service, Radio-Television Broadcasting, Teledata, Maintenance and Operation, Communications and Professional Technical and Clerical work as defined in Article XXVI, Section(s) 4, 5, and 6, of the IBEW Constitution when performed as follows:\n(a) Outside, Inside and Radio-Television Service work when performed in the following areas: State of Idaho (Counties) Ada Adams Washington","Boise Canyon","Elmore Gem","Owyhee Payette","Valley","State of Oregon (County) Malheur\n(b) Radio-Television Broadcasting work when performed by employees of: KTVB-TV, Tegna, Inc.\n(c) Teledata work when performed under the terms of the National Teledata Agreement.\n(d) Maintenance and Operation when performed by: J & J Services (Service Contract Act) Intralot Inc.\n(e) Communications work when performed by employees of: Directv Call Center Directv Installers/Technicians dispatched from the Nampa Idaho Warehouse\n(f) Professional Technical and Clerical work when performed by: Full time employees of the Idaho State Democratic Party. Employees of the Idaho State AFL-CIO","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 1"],["(g) All Power Line Clearance work when performed on Idaho Power Property in the following counties: Idaho: Ada, Adams, Boise, Canyon, Elmore, Gem , Owyhee, Payette Washington and Valley Oregon: Malheur, Baker, Grant and Harney However, the right of the International President to change this jurisdiction is recognized, as provided in the IBEW Constitution.\nSec. 2. The objects of this Local Union shall be to promote by all proper means the material and intellectual welfare of its members.\nSec. 3. Local Union 291 shall cover the \"A\" and \"BA\" types of membership.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 2"],["ARTICLE II Meetings\nSec. 1. Regular meetings shall be held once a month at the time and date as decided by the Local Union. The International Office shall be advised of the time, date, and location of regular Local Union meetings and also of any future changes. The membership shall be notified of any change in regular meeting dates.\nSec. 2. Special meetings may be called only by the Business Manager or the Executive Board. The members shall be notified in writing (by mail, email, leaflets, in the Union newspaper, or on accessible bulletin boards) of any special meeting. No business shall be transacted at any special meeting except that for which it has been called.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 3"],["ARTICLE III Officers - Elections - Duties\nSec. 1. The officers shall perform such duties as are stated in Article XVII of the IBEW Constitution. In addition, they shall perform such duties as are outlined in these bylaws and such duties as may be assigned to them by the Local Union and which are not in conflict with the IBEW Constitution and these bylaws.\nSec. 2. Failure of officers to perform their duties, the suspension or removal of any officer and the filling of any vacancies, shall be dealt with as stated in Article XVI of the IBEW Constitution.\nSec. 3. All officers and representatives and all employees shall be bonded to the extent required by the International or any applicable Federal or State law, whichever is greater. The bond shall be secured through the International and the premium shall be paid by the Local Union.\nSec. 4. (a) The officers shall be those provided for in Article XVI of the IBEW Constitution.\n(b) The President shall have such authority as provided for the Business Manager in these bylaws and the IBEW Constitution.\nSec. 5. The Executive Board shall consist of the President, Vice President, Recording Secretary and four (4) elected members.\nSec. 6. The Examining Board shall consist of four (4) elected members. There shall be at least one member of the Examining Board from the Inside Construction classifications and there shall be at least one member of the Examining Board from the Outside Construction classifications. The remaining seats shall be considered At-Large and maybe any member in good standing of the Local Union. Should no member be nominated from either designated group, the reserved seat will be considered At-Large for that election. Should a designated seat become vacant during an elected term, the seat may be filled by any member in good standing.\nSec. 7. (a) Nominations for officers shall be held in May 2028 and election of officers shall be held in June 2028 and every three (3) years thereafter, as stated in Article XVI of the IBEW Constitution. Notice shall be mailed to all members at least twenty (20) days prior to the meeting for nominations in election years.\n(b) No member shall be a candidate for more than one (1) office, except as provided in these bylaws and with approval of the International President. If nominated for more than one office, the member shall immediately declare for which office they will be a candidate. However, this shall not apply to offices which have been combined with the approval of the International President. IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 4"],["(c) Every candidate shall have the right once within thirty (30) days prior to the mailing of the ballots to inspect a list containing the names and last known addresses of all the members of the Local Union. Such list of members shall be maintained and kept by the Local Union. The membership list shall not be copied for the use of any candidate.\n(d) The Local Union shall comply with all reasonable requests of any bona fide candidate for Local Union Office to distribute their campaign literature to the membership at the candidate's expense. In handling all such requests, the Local Union shall comply with the IBEW Local Union Election Guide and with applicable Department of Labor Regulations under the Labor Management Reporting and Disclosure Act of 1959.\n(e) No member shall be eligible for office unless they have been a member of Local Union 291 in continuous good standing for at least two (2) years immediately prior to nomination.\n(f) No apprentice shall be eligible to hold office in the Local Union, except that a member who was previously eligible to hold office in the Local Union shall remain eligible if they entered an apprenticeship program for the purpose of upgrading their classification. Sec 8. (a) The election of officers shall be conducted by mail ballot. The Executive Board Shall decide the date for the mailing of the ballots, the last day on which ballots will be received, the date, time, and place when the ballots will be counted and similar information in the event a run-off election is necessary. This information shall be included in the notice of the nominations meeting and in the ballot package sent to the members.\n(b) The Executive Board may appoint an individual to perform certain tasks, including but not limited to procuring restricted access post office boxes, mail permits, or an outside impartial balloting company, prior to the nominations meeting. All disbursements related to these tasks shall be processed in accordance with the IBEW Constitution and these bylaws. Once the Election Judge is appointed, the individual appointed by the Executive Board shall inform the Election Judge of all advanced tasks performed and shall immediately turn over to the Election Judge all records, receipts, post office boxes, etc. for further processing.\n(c) At a general or specially called meeting of the Local Union at least eighty (80) days prior to the meeting of the Local Union when nominations are made, the President shall appoint an Election Judge and as many Tellers, as are required, who shall serve as an Election Board to conduct the election. No candidate for any office shall be eligible to serve on this board.\n(d) After nominations have been made and those nominated are found by the Election Judge to be qualified, the Election Judge shall have ballots prepared listing in IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 5"],["alphabetical order the names of all candidates for each respective office, beginning with President and continuing in the order named in the IBEW Constitution. The ballots shall not contain any number or other marks identifying the voter. If the Local Union retains an impartial outside balloting company to assist and/or conduct the mail ballot election, the Election Judge may, with the approval of the Local Union, authorize the outside balloting company to perform the tasks of printing, mailing, receiving, tabulating and/or counting the ballots.\n(e) Any candidate for office, or an IBEW member designated by the candidate as an observer, may be present at the preparation and mailing of ballot packages, the ballot pickup and the counting of the ballots. Observers must be members eligible to vote in the election.\n(f) The Financial Secretary shall furnish to the Election Judge, not less than ten\n(10) days before the date for the mailing of the ballots, an alphabetical list of the names and addresses of all members eligible to vote. All members in good standing and qualified shall be entitled to vote.\n(g) If not already arranged, the Election Judge shall select two (2) depositories: one (1) for receipt and storage of ballots and one (1) for ballot packages returned as undelivered. This shall not be the Local Union Post Office Box or the Local Union headquarters. (Cost of such depository shall be paid by the Local Union.) The Election Judge shall see that the address of such depository is placed on the preaddressed envelopes.\n(h) The Election Judge shall mail or cause to be mailed to all eligible voters, an official ballot and two (2) envelopes. One (1) envelope shall be smaller than the other and shall have the words OFFICIAL BALLOT stamped or printed on it. The larger envelope shall be preaddressed to the Election Board and shall contain a space in the upper left-hand corner where the member shall place their name and address.\n(i) Upon receiving their ballot, the member shall mark same and enclose it in the smaller envelope marked OFFICIAL BALLOT. This envelope shall be placed in the larger preaddressed envelope and mailed to the Election Board.\n(j) Write-in votes shall not be permitted.\n(k) No envelope received later than the time and date set by the Executive Board in the notice of the election shall be opened or counted by the Election Board. The Election Judge may extend the time for the receipt of ballots in the event of an extraordinary event beyond the control of the Local Union.\n(l) Prior to the counting of the ballots, the Election Board shall verify voter eligibility by comparing the return ballot envelopes to the voter eligibility list. A ballot challenged by either the Election Board, a candidate, or a candidate’s observer shall be set aside. Before removing the official ballot envelopes from the return ballot envelopes, IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 6"],["the Election Judge shall attempt to resolve the challenged ballots, recording all decisions in writing. Unresolved challenged ballots shall be set aside and not counted unless such ballots are deemed determinative of the outcome of the election.\n(m) The Election Board shall count the ballots or have an outside impartial balloting company count the ballots in the presence of the Election Board. The Election Board shall remove or cause the removal of the smaller envelope marked OFFICIAL BALLOT from the larger envelope. The OFFICIAL BALLOT envelopes shall then be mixed together to preserve ballot secrecy. The ballots shall then be removed from the OFFICIAL BALLOT envelopes and tabulated. If the challenged ballots are not determinative, the Election Judge shall certify the results in writing to the Executive Board immediately after the ballots have been counted. If the challenged ballots are determinative, the Election Judge shall, as soon as possible but no later than five (5) days from the counting of the ballots, investigate and rule upon the challenges. All challenged ballots determined to be eligible shall then be counted, and the Election Judge shall certify the results in writing to the Executive Board.\n(n) All election records including envelopes and ballots shall be preserved for one\n(1) year from the date of the election, after which they shall be destroyed unless a question has arisen in connection with the election.\n(o) The Election Judge shall have the authority to establish additional procedures and safeguards not inconsistent with the above rules and in conformance with the conduct of a fair election and applicable law. The Election Judge shall also have full authority to make rulings and decisions concerning disputes, controversies or unexpected occurrences that might arise in order to ensure a fair and orderly election process. These rulings or decisions shall not conflict with any provisions in the IBEW Constitution or these bylaws.\n(p) The election shall be decided for the candidate receiving the most votes for a specific office.\n(q) When a run-off election is necessary, such run-off election shall be held twenty-one (21) days after the regular election is held.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 7"],["ARTICLE IV Executive Board\nSec. 1. The duties of the Executive Board are outlined in Article XVII of the IBEW Constitution and these bylaws.\nSec. 2. It shall be the duty of the Executive Board to investigate all applications for membership and submit its report to the Local Union for action in accordance with\nArticle XX of the IBEW Constitution. The preceding sentence shall not apply to apprentices as covered elsewhere in these bylaws. The Executive Board shall also investigate and pass upon all traveling cards in full accordance with Article XXIII of the IBEW Constitution. The Executive Board shall make its final report to the Local Union within sixty (60) days after the application or traveling card has been presented for board consideration.\nSec. 3. Special meetings of the Executive Board may be called by its Chair or the Business Manager.\nSec. 4. The President shall serve as its Chair and the Recording Secretary shall serve as Secretary of the Executive Board.\nSec. 5. The Executive Board shall meet regularly between regular meetings of the Local Union at such time as it decides.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 8"],["ARTICLE V Examining Board\nSec. 1. The duties of the Examining Board shall be to examine all applicants for membership to determine their qualifications for the trade. They shall examine such qualifications of members as provided in Article XIX of the IBEW Constitution. This section shall not apply to apprentices as covered elsewhere in these bylaws.\nSec. 2. The Examining Board shall meet at least once quarterly for the examination of applicants when there are applicants to be examined. The Examining Board shall retain all records of examinations given for at least two (2) years. A copy of the examination shall be placed in the member’s permanent file.\nSec. 3. The Examiners shall furnish a report on the results of all examinations to the Executive Board and the Local Union.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 9"],["ARTICLE VI Business Manager\nSec. 1. The Business Manager shall perform such duties as are stated in Article XVII of the IBEW Constitution and these bylaws. Also, the Business Manager shall perform such other duties as may be assigned by the Local Union and which are not in conflict with the IBEW Constitution and these bylaws.\nSec. 2. The Business Manager shall report to the Executive Board and the Local Union when called upon, or when the Business Manager deems such necessary. The Executive Board and Local Union officers shall cooperate with the Business Manager in the performance of the duties of the office and shall not work in conflict with the Business Manager.\nSec. 3. When a Business Manager is employed, a cell phone shall be provided at the expense of the Local Union.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 10"],["ARTICLE VII Salaries\nSec. 1. Salaries shall be as follows: President Vice President Recording Secretary Treasurer Executive Board Members Examining Board Members","$45.00 per month $45.00 per month $45.00 per month $45.00 per month $45.00 per month $45.00 per month","Business Manager-Financial Secretary:","a weekly salary equal to62.5 hours at 120% of the Journeyman rate.","Assistant Business Manager:","a weekly salary equal to 60 hours at 110% of the Journeyman rate.","Organizer:","a weekly salary equal to 60 hours at 110% of the Journeyman rate.","Business Representative: BR1","a weekly salary equal to 40 times 60% of the straighttime hourly rate for Journeyman.","BR2","a weekly salary equal to 40 times 70% of the straighttime hourly rate for Journeyman","BR3","a weekly salary equal to 40 times 80% of the straighttime hourly rate for Journeyman.","BR4","a weekly salary equal to 40 times 90% of the straight-time hourly rate for Journeyman. a weekly salary equal to 40 times 100% of the straight-","BR5 IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 11"],["time hourly rate for Journeyman. BR6","a weekly salary equal to 40 times 110% of the straighttime hourly rate for Journeyman.","Part Time Business Reps: Part Time Business Reps on Union Business shall be paid for all hours worked at the straight time hourly rate equal to the hourly rate of one of the full-time Business Representative positions. In no event shall payment of wages exceed the basic hours of the workday or work week. If any position is filled by an outside classification, the Journeyman rate will be based on the Journeyman Lineman rate. If any position is filled by any other classifications, the Journeyman rate shall be the Inside Journeyman Wireman rate.\nSec. 2. Should any two (2) offices be combined, then the officer shall receive the salary of only one (1) office, whichever is higher.\nSec. 3. Receipts, vouchers, or other reasonable proof of claim shall support all disbursements for authorized expenditures made on behalf of the Local Union.\nSec. 4. The Local Union shall carry automobile casualty insurance on the automobile of the Business Manager and his assistants, when used for the business of the Local Union, to cover public liability and property damage.\nSec. 5. The Business Manager shall be allowed a two (2) week vacation and still be allotted their weekly salary. All vacation must be used in the year in which it is earned. Vacation hours shall not be exchanged for monetary values.\nSec. 6. In order for the President, Vice President, Recording Secretary, Treasurer, Executive Board Members, and Examining Board Members to receive their salary they must attend the regular Union Meeting, the Executive Board Members must attend their regular Executive Board Meeting, and the Examining Board Members must attend their regular Examining Board Meeting.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 12"],["ARTICLE VIII Committees and Delegates\nSec. 1. Committees and delegates shall be appointed in accordance with Article XVII of the IBEW Constitution.\nSec. 2. The delegates and alternates to the International Convention shall be nominated and elected in accordance with the nomination and secret ballot election procedure as set forth in these bylaws and Article II, Section 10, of the IBEW Constitution.\nSec. 3. The Business Manager shall, by virtue of the office, serve as a delegate to the International Convention. No candidate for office of Business Manager may be nominated for a Delegate at Large seat at the Convention in addition to being nominated for the office of Business Manager.\nSec. 4. The President shall, by virtue of the office, serve as a delegate to the International Convention. No candidate for office of President may be nominated for a Delegate at Large seat at the Convention in addition to being nominated for the office of President.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 13"],["ARTICLE IX Stewards\nSec. 1. Stewards shall be appointed where needed by the Business Manager. They shall work under the direction of the Business Manager and be subject to the Business Managers authority. The Business Manager may remove any Steward, as such, at any time.\nSec. 2. Duties of Stewards shall be:\n(a) To have a copy of the IBEW Constitution, these bylaws and the working agreement with them at all times.\n(b) To see that Union membership is encouraged and all workers at their respective shop or jobs have paid-up dues receipts or valid working cards of the Local Union.\n(c) To report any encroachment upon the jurisdiction of the Local Union.\n(d) To report to the Business Manager any violation of the bylaws or agreements.\n(e) To perform such other duties as may be assigned to them by the Business Manager.\nSec. 3. Stewards shall in no case cause a stoppage of work. In case of any trouble on a job or at a shop, Stewards shall immediately notify the Business Manager.\nSec. 4. The Business Manager shall not appoint any member as Steward who holds a position of superintendent, foreman, general foreman, or office personnel working for a contractor.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 14"],["ARTICLE X Assessments - Admission Fees - Dues\nSec. 1. All assessments imposed in accordance with the IBEW Constitution and these bylaws must be paid within the time required to protect the member's continuous good standing and benefits. Members shall not be required to pay assessments for welfare benefits in which they cannot participate.\nSec. 2. No money shall be collected from anyone working within the jurisdiction of this Local Union other than admission fees, dues (and agency fees where applicable) and assessments established in accordance with the IBEW Constitution and these bylaws.\nSec. 3. The admission fees shall be:\n(a) \"A\" or “BA” Membership","$10.00 for all members","(b) Each applicant for \"A\" membership shall pay an additional $2.00.\n(c) Approval of these admission fees is given by the International President with the understanding that if conditions in the jurisdiction of the Local Union do not justify such fees, then the International President will be free to change the amounts.\nSec. 4. All applications must be accompanied by ten percent (10%) or more of the admission fee. Full payment (satisfactory arrangements may be made with the Executive Board) and admission must be completed within ninety (90) days of making application, in accordance with Article XX of the IBEW Constitution.\nSec. 5. The monthly dues shall be:\n(a) \"A\" Members Construction: Journeyman Wireman Apprentice Wireman Journeymen All other construction Classifications Apprentices All other construction Classifications Groundman","Basic Dues","Working Dues","$3.70 plus 2.70 plus","3% of gross wages 3% of gross wages","3.70 plus","3% of gross wages","2.70 plus 3.70 plus","3% of gross wages 3% of gross wages","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 15"],["(b) \"A\" and \"BA\" Members All members employed under Professional and Industrial or Single Employer Agreements:","Basic Dues","3.70","Working Dues","and 1% of 160 hours per month","(c) Applicable International payments and all assessments to be paid in addition to the above dues.\n(d) Unemployed members and members working outside the jurisdiction of Local Union 291 shall pay basic dues only plus the International payments provided for in (c) above.\n(e) All members of the IBEW shall pay working dues as provided for above when working in the jurisdiction of Local Union 291.\n(f) Basic Dues and International payments are payable monthly in advance.\n(g) Working dues for the preceding month are due and payable not later than the regular meeting night of the month following the period worked.\n(h) All members working on Building and Construction Trades jobs shall maintain type \"A\" membership.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 16"],["ARTICLE XI Funds\nSec. 1. The funds of this Local Union are for the legitimate expenses required in its conduct and maintenance and shall not be diverted there from. Disbursements shall be made in accordance with Article XVIII of the IBEW Constitution and these bylaws.\nSec. 2. No money shall be loaned from the funds of this Local Union for any purpose, unless approved by the International President of the IBEW.\nSec. 3. The President shall appoint an auditing committee of three (3) members (or the President or the Executive Board, as the Local Union decides, shall employ a public accountant or a combination of quarterly audits by an auditing committee and a yearly audit by a public accountant) to audit the books and accounts of the Local Union every three (3) months. A report of the audit must be made to the membership. The President shall inspect the bank books of the Treasurer to ensure Local Union monies received by the Treasurer have been properly and promptly deposited in the Local Union's name. The fiscal year shall be the twelve-month period ending December 31.\nSec. 4. The following Fund(s) are hereby established: General Fund\nSec. 5. (a) Requests for donations to (voluntary gifts as of money, service or ideas made to a worthy cause) and/or sponsorships (the act of sponsoring an event or group either officially or financially) under $500.00 or less, must be submitted in writing and read at the regular meeting of the Local Union, and decided at that meeting by a majority vote of members present and voting. If over $500.00, donations and/or sponsorships must be submitted in writing and read at two (2) regular meetings of the local union and decided at the second meeting by a majority vote of the members present and voting. Requests for allocations (shares set aside for specific purpose for the local union) must be submitted in writing and read at the regular meeting of the Local Union and decided at that meeting by a majority vote of the members present and voting.\n(b) In the event the Sponsorship exceeding $500.00 is a recommendation from the Executive Board, the Executive Board meeting shall meet the requirement of the 1st meeting, and the motion may be taken up and voted upon at the regular Union Meeting in which the Executive Board makes its recommendation to the body.\nSec. 6. This Local Union shall assume all financial and legal responsibility for the duly elected officers and assistants to the Business Manager and Stewards and all members, when they are acting under the instructions of the business office when involved in litigation encountered in the performance of their official duties. This section shall not be construed as an attempt to authorize any payment in violation of any applicable State or Federal law. IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 17"],["ARTICLE XII Admission of Members\nSec. 1. Qualification and admission of members shall be in accordance with Articles XIX and XX of the IBEW Constitution.\nSec. 2. Apprentices may be accepted into membership at any time and should be offered membership on the first day they are assigned for employment or are working under a collective bargaining agreement. Notwithstanding the action of the Local Union. Apprentices must be admitted to membership in accordance with Article XV of the IBEW Constitution after they have worked one (1) year in the jurisdiction of this Local Union.\nSec. 3. (a) Instruction of apprentices shall be under the supervision of the apprenticeship committee, and apprentices shall attend such classes as directed by the committee.\n(b) The above provision shall not apply to apprentices where the Local is a party to a Joint Apprenticeship and Training Committee (JATC) when provided for in an agreement with the employer. The decision(s) of such joint committee shall be accepted by the Local Union.\n(c) An apprentice having been certified by the JATC as having successfully completed the prescribed apprenticeship program shall be immediately classified as a Journeyman without further examination by the Local Union.\nSec. 4. (a) Residential classifications shall work on residential wiring only. Voice-DataVideo classifications shall work on Voice-Data-Video work only.\n(b) A Residential Wireman or Voice-Data-Video Technician may request to take the prescribed course of study to be eligible to become a Journeyman Wireman. Upon satisfactory completion of the prescribed course of study and the payment of the difference in admission fees prevailing at the time they became a Residential Wireman or a Voice-Data-Video Technician, the member shall have their classification changed to Journeyman Wireman without further examination by the Local Union.\n(c) Residential Trainees shall be so classified and shall be registered and under the instruction and supervision of the Training Committee as provided for in an agreement with the employer.\n(d) The Residential Wireman, Residential Trainee and Voice-Data-Video Technician shall be made aware of and agree to these provisions prior to admission into the Union.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 18"],["ARTICLE XIII General Laws\nSec. 1. The Executive Board shall act as the Trial Board to hear charges and try members (except officers or representatives of a Local Union, Railroad Council, or System Council) for violation of the IBEW Constitution, these bylaws, or an approved working agreement. All charges against a member must be in writing and signed, specifying the provision(s) of the Constitution, bylaws, or working agreement allegedly violated. A brief factual written statement of the act(s) considered to be in violation, including relevant dates, places and names, should be given by the charging party. A copy of the charges must be furnished to the accused by the Recording Secretary with notice of when to appear before the Trial Board.\nSec. 2. A charged member may, upon request, have an IBEW member in good standing as Counsel. However, no lawyer, as such may serve as Counsel in a hearing of the Trial Board. No person not a member of the IBEW may be present at such hearing, except as a witness. If the accused fails to appear after having been notified in writing to appear, the Trial Board shall hear and determine the case just as though the accused were present. The Trial Board should dismiss all charges when a member files charges against another member and willfully fails to appear before the Trial Board to prosecute the case.\nSec. 3. A majority vote of the Trial Board shall be sufficient for a decision, which is to be in writing. The Trial Board report of its findings and sentence, if any, shall be reported to the next regular meeting of the Local Union. The action of the Trial Board shall be considered the action of the Local Union, and the report of the board shall conclude the case.\nSec. 4. All financial obligations (including but not limited to fines, assessments, and unpaid dues and fees) owed by the member under the IBEW Constitution or the bylaws of this Local Union shall constitute debts owed by the member to the IBEW or the Local Union and may be recovered through court action brought by the IBEW or the Local Union. If it is necessary for the Local Union to institute legal proceedings in order to recover any such debt, the individual member shall also be liable for all costs of said proceedings, together with a reasonable attorney's fee incurred by the Local Union, the amount thereof to be fixed by the Court.\nSec. 5. Each member shall keep the Financial Secretary informed of their correct address. The Financial Secretary, in turn, shall notify the International Secretary.\nSec. 6. The parliamentary rules of this Local Union shall be those stated in Article XV of the IBEW Constitution.\nSec. 7. The IBEW Constitution is hereby made a part of these bylaws. Where there is doubt concerning any section of these bylaws or where such might appear to be in IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 19"],["conflict with the IBEW Constitution, then the IBEW Constitution shall control and must be followed.\nSec. 8. Members shall be supplied with copies of the IBEW Constitution, these bylaws, and the working agreement upon request to the Local Union.\nSec. 9. The handling of jobs for unemployed members shall be under the full supervision and direction of the Business Manager. The Business Manager shall devise such means as are considered practical and fair in the distribution of available jobs to qualified members. Members shall not violate such established rules or plans.\nSec. 10. Members shall not work with a non-union workman, unless given permission to do so by the Executive Board or the Business Manager.\nSec. 11. The Business Manager or Shop Steward of the shop concerned shall have the authority to examine member's pay or check stub in order to verify the amount that such person is being paid under the Local Union's agreement.\nSec. 12. Members shall show their working cards or dues receipts upon request of the Business Manager or Stewards.\nSec. 13. All working agreements or amendments thereto shall be submitted to the members affected for ratification. Voting on such agreements or amendments shall be at each meeting affected.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 20"],["ARTICLE XIV Property of IBEW Local Union 291\nSec. 1. The Local Union's building and other property, located at 225 North Sixteenth Street, Boise, Idaho, 83702, shall be owned by and in the name of IBEW Local Union No. 291.\nSec. 2. The Local Union members shall, by majority vote of those present and voting, decide all issues concerning the building and other real property of the Local Union. A majority of the members voting shall constitute a quorum.\nSec. 3. To promote and carry out the aims and interests of the Local Union, no real property of the Local Union shall be sold, leased, encumbered, or disposed of, nor shall any real property be purchased or otherwise acquired, except by a majority of the Local Union members present and voting, following notice to all members, as provided in\nSection 4.\nSec. 4. All members of the Local Union shall be notified in writing of the nature of a resolution of the announced intention to dispose of or acquire real property at least fifteen\n(15) days before the date of the meeting. Said resolution shall be read at such regular or specially-called meeting. The members shall then vote on the resolution.\nSec. 5. All decisions concerning the disposition or acquisition of real property by the Local Union must be approved, in advance, by the International President.\nSec. 6. By virtue of the position, one secretarial staff member will hold the title of Building Manager. It will be the Building Managers duty to be the point of contact for any and all tenants regarding any issues relating to tenant spaces. (leases, maintenance, etc.) Any items needing action will be presented at the next official meeting of the building committee or, if immediate action is needed, an electronic agenda will be sent to all committee members for action.\nSec. 7. A Local Union Building Committee shall be established to manage the affairs of the property. The committee shall consist of the Local Union President, Business Manager, Building Manager and two (2) delegates as appointed by the president for two\n(2) year terms. The committee shall meet once every two (2) months and take action on all items brought before them. All actions of the committee will be reported to the membership at the next general membership meeting.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 21"],["ARTICLE XV Amendments\nSec. 1. These bylaws shall become effective upon approval by the International President.\nSec. 2. (a) These bylaws may be amended or changed by any such proposal being submitted in writing and read at two (2) regular meetings of the Local Union and decided at the second meeting by a majority vote of the members present and voting.\n(b) However, assessments, admission fees or dues shall be changed only by a majority vote by secret ballot of the members in good standing voting at a regular or special membership meeting. Changes shall be introduced at one Local Union meeting and acted upon at a second Local Union meeting. The proposal cannot be acted on at the time it was proposed. A written notice specifically stating the proposed assessments or changes in admission fees or dues shall be mailed to each member in good standing at the member's last-known home address at least twenty (20) days prior to the Local Union meeting at which the membership is to vote on the question.\nSec. 3. No assessments, amendments or changes shall become effective until approved by the International President, in accordance with the IBEW Constitution.","IBEW Local Union 291 Bylaws","Approved: March 10, 2026 Page 22"],["LOCAL UNION 291 RECORD OF AMENDMENTS District: Eighth Bylaws Retyped in Entirety: February 20, 1991","Location: Boise, Idaho","* * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * ** * * * * * * * * * * * * * * DATE\nARTICLES AND SECTIONS AMENDED * * * * * * * * * * * * * * * * * * * * * * * * T FUNDS  →  page 28","ARTICLE 13 - HOURS OF WORK. PREMIUM PAYMENTS. SHIFTS & HOLIDAYS  →  page 29","SECTION 1. WORK WEEK AND WORK DAY  →  page 29","SECTION 2. SHIFT WORK  →  page 29","SECTION 3. OVERTIME  →  page 30","SECTION 4. HOLIDAYS  →  page 30","SECTION 5. REPORTING PAY  →  page 31","SECTION 6. PAYMENT OF WAGES  →  page 31","SECTION 7. EMERGENCY WORK SUSPENSION  →  page 31","SECTION 8. TIME KEEPING  →  page 32","SECTION 9. MEAL PERIOD  →  page 32","SECTION 10. BREAK PERIODS  →  page 32","ARTICLE 14 - SAFETY PROTECTION OF PERSON AND PROPERTY  →  page 33","SECTION 1. SAFETY REQUIREMENTS  →  page 33","SECTION 2. CONTRACTOR/PROJECT RULES & REGULATIONS  →  page 33","SECTION 3. INSPECTIONS  →  page 34","SECTION 4. SUBSTANCE ABUSE TESTING  →  page 34","ARTICLE 15 - GENERAL TERMS  →  page 35","SECTION 1. TOOLS OF THE TRADES- EMERGENCY USE  →  page 35"],["TABLE OF CONTENTS","(Page numbers here match the pages in this app. The printed booklet numbers each page one lower.)","SECTION 2. TEMPORARY SERVICES  →  page 35","SECTION 3. INSURANCE  →  page 35","SECTION 4. FULL WORK DAY  →  page 35","ARTICLE 16 - SAVINGS AND SEPARABILITY  →  page 36","SECTION 1. THIS AGREEMENT  →  page 36","SECTION 2. THE BID SPECIFICATIONS  →  page 36","SECTION 3. NON-LIABILITY  →  page 36","SECTION 4. NON-WAIVER  →  page 36","ARTICLE 17 - FUTURE CHANGES IN SCHEDULE A AREA CONTRACTS  →  page 36","SECTION 1. CHANGES TO AREA CONTRACTS  →  page 36","SECTION 2. LABOR DISPUTES DURING AREA CONTRACT NEGOTIATIONS  →  page 37","ARTICLE 18 - TERM & EXECUTION  →  page 37","SECTION 1. TERM OF AGREEMENT  →  page 37","SECTION 2. EXECUTION OF AGREEMENT  →  page 37","SCHEDULE A - COLLECTIVE BARGAINING AGREEMENTS  (not included in this copy)","SCHEDULE B - DAVIS-BACON WAGE DECISION  (not included in this copy)","SCHEDULE C - LETTER OF ASSENT  (not included in this copy)","SCHEDULE D - PRE-JOB QUESTIONNAIRE  (not included in this copy)","SCHEDULE E - JURISDICTION OF UNIONS  (not included in this copy)","SCHEDULE F - DRUG TESTING POLICY  (not included in this copy)","SCHEDULE G  (not included in this copy)"],["MICRON BOISE EXPANSION PROJECT LABOR AGREEMENT","ARTICLE 1 - PREAMBLE","WHEREAS, Micron Semiconductor Idaho Manufacturing (Triton) LLC (hereinafter “Owner”) has hired EXYTE U.S., Inc. (hereinafter “EPC Prime Contractor”) for the project described herein (“Project”); and","WHEREAS, EPC Prime Contractor is required by the terms of its engagement with Owner to become a party to this Project Labor Agreement (hereinafter “Agreement”); and","WHEREAS, all parties to this Agreement acknowledge that the construction of the Project, as more fully defined in Article 3, is important to the development of the local, state, and national economies and the enhancement of national security, as intended by the Thornberry National Defense Authorization Act of 2021 (“CHIPS Act”), and that the use of a project labor agreement as it relates to the Project is in the public interest; and","WHEREAS, the parties to this Agreement recognize the need for the timely completion of the Project without interruption or delay; and","WHEREAS, this Agreement is intended to enhance this cooperative effort through the establishment of a framework for labor-management collaboration and stability, and aims to provide comprehensive and standardized mechanisms for the settlement of work disputes, including those relating to work jurisdiction, that may otherwise add time and cost to completion of the Project; and","WHEREAS, the Contractors and the Unions, both as defined in Article 2, Section 1, agree that the timely construction of this Project will require a substantial number of employees from construction and crafts possessing skills and qualifications that are vital to its completion; and that this may require the recruitment and employment of skilled workers who are not members of labor organizations, and/or who are from outside the Project’s locale; and","WHEREAS, the Contractors and the Unions will work together to furnish skilled, efficient craftworkers for the construction of the Project, and the Unions commit to make available skilled workers promptly, so worker absences do not lead to delays; and","WHEREAS, the partics are committed to supporting the development of an equity-driven worktorce that supports job creation and expands employment opportunities for economically","disadvantaged individuals; and","4888-7476-57 18.1 / (17346-1004","Micron Confidential"],["WHEREAS, the parties acknowledge that improving employment opportunities for local residents, minorities, women, and veterans is crucial to creating good-paying jobs that benefit American workers, including economically disadvantaged and underrepresented individuals and communities; and","WHEREAS, the parties commit that this Agreement will support the involvement of small and minority-owned businesses in the Project to achieve supplier diversity, and the Unions specifically agree to provide equitable training opportunities, including opportunities for preapprenticeship pathways to registered apprenticeship programs, employment placement, and advancement for entry level workers; and","WHEREAS, the parties recognize that safety is a foundational priority for this Project and commit to creating a culture focused on health and safety that includes tracking workplace illnesses and injuries on the project site, and training employees regarding Project satety specifics;","NOW, THEREFORE, in recognition of the special needs of the Project, and to maintain a spirit of harmony, labor-management peace, and stability during the term of this Agreement, the Parties enter into this Agreement, which incorporates the above recitals as essential to the Project.\nSECTION 1. PARTIES TO THE AGREEMENT","This Agreement is entered into this __—__— day of , 2023 (the “Effective","Date”), by and between the EPC Prime Contractor, its successors and assigns, on behalf of the Owner, and the signatory labor organizations on behalf of themselves and their members, with respect to the new Micron semiconductor manufacturing facility located in Boise, Idaho Expansion Project, as depicted in Schedule H (hereinafter “Project”).","ARTICLE 2 - GENERAL CONDITIONS\nSECTION L. DEFINITIONS","Throughout this Agreement:","(A) _ the term “Contractor” or “Contractors” shall include all construction contractors and subcontractors of whatever tier engaged in onsite construction work at the Project site who have agreed to be bound by this Agreement, including the EPC Prime Contractor when it performs construction work within the scope of this Agreement;","(B) the term “EPC Prime Contractor” is used where specific reference to the entity designated by the Owner as EPC Prime Contractor (and any successor or other or multiple EPC","Prime Contractor(s) designated by the Owner) is intended;","4888-7476-57 18.1 / 117346-1004","Micron Confidential"],["(C) the term “Union” or “Unions” shall include all labor organizations, as that term is defined in Section 2(5) of the National Labor Relations Act, who become signatory to this Agreement; and","(D) the term “construction” means: (i) new construction work related to the construction of Micron’s new semiconductor manufacturing facility as depicted in Schedule H on or after the Effective Date of this Agreement; and (ii) fit-up and systems work related to Micron’s semiconductor manufacturing facility. The term “construction” shall not mean modifications of existing facilities, systems and/or any site maintenance repair or operation, nor does the term “construction” include work excluded elsewhere in this Agreement.","SECTION 2. CONDITIONS FOR AGREEMENT TO BECOME AND REMAIN EFFECTIVE","This Agreement shall not become effective unless each of the following conditions are met:\n(1) the Agreement is signed by the Unions listed on the signature pages to this Agreement; (2) the Agreement is authorized and approved by the Owner; and (3) the Agreement is signed by the EPC Prime Contractor.","SECTION 3. ENTITIES BOUND & ADMINISTRATION OF AGREEMENT","(A) This Agreement shall be binding on the Southwest Idaho East Oregon Building and Construction Trades Council and its signatory affiliated unions (each “Union” and together “Unions”), the EPC Prime Contractor and all Contractors performing on-site Project work as defined in Article 3 and each of their successors and assigns hereto, but not to its or their parents, affiliates, or subsidiaries.","(B) This Agreement shall be administered by the EPC Prime Contractor on behalf of all Contractors. The EPC Prime Contractor shall require all Contractors who have been awarded contracts for work covered by this Agreement to accept and be bound by the terms and conditions of this Agreement by executing a Letter of Assent in the form annexed hereto at Schedule C prior to commencing work. All Contractors who subcontract the performance of Project work shall require their subcontractors, of whatever tier, to become bound by this Agreement by executing a “Letter of Assent” in the form annexed hereto at Schedule C prior to commencing work.","(C) The Owner is a beneficiary of and to this Agreement, but is not a Party and is not bound by this Agreement. The Owner and/or the EPC Prime Contractor have the absolute ri ght to select any qualified bidder for the award of contracts on this Project, without reference to the existence or non-existence of any agreement(s) between such bidder and any party to this","6 4888-74 76-57 18.1 / 117346-1004","Micron Conjidential"],["Agreement; provided only, however, that such bidder must sign the Letter of Assent in the form annexed hereto at Schedule C should it be designated the successful bidder.","(D) It is understood that the Owner controls access to the Project site, and may in its sole discretion terminate, delay and/or suspend any or all portions of the Project work at any time. Likewise, the Owner may permanently or temporarily remove any person or employee from the Project site at any time for reasons that are not arbitrary or capricious, and that are consistent with Owner’s policies.","SECTION 4. SUPREMACY CLAUSE","(A) — Except as set forth herein, this Agreement, together with the Schedules appended hereto, represents the complete understanding of all signatories and supersedes any national agreement, local agreement or other collective bargaining agreement of any type, including nonconstruction divisions of the local unions signatory hereto which would otherwise apply to this Project, in whole or in part;","(B) Where this Agreement is silent on a subject, that subject shall be governed by the applicable Schedule A collective bargaining agreement. Where a subject covered by the provisions, explicit or implicit, of this Agreement is also covered by a Schedule A collective bargaining agreement, the provisions of this Agreement shall prevail, except for work performed under the NTD Articles of Agreement, the National Stack/Chimney Agreement, the National Cooling Tower Agreement, the National Refractory Agreement, the IBB National Specialty Agreement for the United States (as it applies to welding) and the UA National Specialty Agreement for the United States (as it applies to welding), the National Agreement of the International Union of Elevator Constructors, and instrument calibration work and loop checking covered by the UA/IBEW Joint National Agreement for Instrument and Control Systems Technicians, as to which said agreements shall prevail except for the dispute resolution mechanisms contained therein, as to which this Agreement shall prevail.","(C) No practice, understanding or agreement between a Contractor and a Union which is not explicitly set forth in this Agreement shall be binding on this Project unless endorsed in writing by the EPC Prime Contractor.","SECTION 5. LIABILITY The hability of any Contractor and the liability of any Union under this Agreement shall","be several and not joint. The EPC Prime Contractor and any Contractor shall not be liable for any","A888-7476-57 18. / 117346-1004","Micron Confidential"],["violations of this Agreement by any other Contractor except that they shall use commercially reasonable means to ensure compliance with this Agreement and the Unions shall not be liable for any violations of this Agreement by any other Union, except that the Southwest Idaho Eastern Oregon Building and Construction Trades Council shall use commercially reasonable means to ensure compliance with this Agreement by all of its participating affiliated unions. Under no circumstances shall the Owner be liable to any Party or any other person or entity by reason of this Agreement.","SECTION 6. AVAILABILITY AND APPLICABILITY TO ALL SUCCESSFUL BIDDERS","The Unions agree that this Agreement will be made available to and will fully apply to any successful bidder for Project work without regard to whether that successful bidder performs work at other sites on either a union or non-union basis, without regard to whether employees of such successful bidder are, or are not, members of any of the Unions and without regard to whether the bidder has an existing contract with any Union or Unions. This Agreement shall not apply to the work of any Contractor performed at any location other than the Project site, as defined in Article 3.","ARTICLE 3 - SCOPE OF THE AGREEMENT\nSECTION 1. THE WORK.","(A) It is understood that by virtue of having become bound to this Agreement, neither the EPC Prime Contractor nor the Contractors will be obligated to sign any other local, area, or national collective bargaining agreement with any labor organization.","(B) Nothing contained herein shall be construed to prohibit, restrict, or interfere with the performance of any other operation, work, or function not covered by this Agreement but which may occur at the Project site or be associated with the development of the Project.","(C) This Agreement shall apply and is strictly limited to on-site construction activities related to the construction of Micron’s new semiconductor manufacturing facility located in Boise, Idaho Expansion Project as depicted in Schedule H. While this Agreement shall apply to the core and shell work related to the approximately 600,000 square feet of cleanroom space within Micron’s new semiconductor manufacturing facility; it shall not apply to the installation of tools and/or equipment within said cleanroom. This Agreement shall not apply to individuals or work","excluded in Sections 2 or 3 below or elsewhere in this Agreement.","4888-7476-5718.1 / (17346-1004","Micron Confidential"],["SECTION 2. EXCLUDED EMPLOYEES & WORK","(A) The following persons are not subject to the provisions of this Agreement, even","though performing work on the Project:","(i)","(ii)","(iii)","(iv)","(v)","(vi)","(vit)","(vi)","(ix)","(x)","Superintendents, supervisors, engineers, inspectors and testers, quality control/assurance personnel, timekecpers, mail carriers, clerks, office workers, messengers, safety and security personnel, non-manual employees, project design consultants, and all professional, engineering, administrative and management persons;","Employees of Owner who perform de minimis trade construction Project work;","Individuals and entities engaged in off-site work, including but not limited to manufacture, modifications, repair, maintenance, assembly, painting, handling, fabrication, or pre-fabrication of Project site components, materials, equipment, or machinery, or involved in deliveries to and from the Project site, except for off-site work performed at a location or facility dedicated solely to providing services for the Project site and deliveries from such dedicated site or facility;","Employees of the EPC Prime Contractor and entities directly contracted by the EPC Prime Contractor who are not engaged in trade construction Project work, including but not limited to transportation from, in, and/or on the Project site;","Employees or contractors of equipment manufacturers and suppliers, or factory technicians involved in on-site installation, start-up or warranty work;","Persons engaged in laboratory, geophysical, or other specialty testing, inspections, or surveying pursuant to a professional services agreement between the Owner, EPC Prime Contractor, or any of the Owner’s other professional consultants and such laboratory, testing, inspection, or surveying firm;","Persons engaged in ancillary Project work performed by third parties, such as utility companies, telephone companies, and railroads:","Employees of subcontractors and/or suppliers and/or independent haulers engaged in use of vehicles for delivery of and pick up of materials or supplies at the Project site, except for use of vehicles for staging, pick up, and movement of materials or supplies within the Project site after initial delivery and except as set forth in subsection (iii) of this Section;","Employees engaged in work performed by access control and security and surveillance system subcontractors or suppliers;","Persons engaged in the installation of artwork, signage, graphics and other theming specialty items, and work performed by employees of Artisans. “Artisans” shall be individuals or entities whom Owner may (or may not)","9","4888-74 76-57 18.1 / 17346-1004","Micron Confidential"],["employ directly to create unique, one-of-a-kind decorative elements, including architectural finishes, for incorporation into the new facility, provided that the design, illustration, and detailing of these one-of-a-kind decorative elements can only be fully completed in the field and can only be performed by that individual or entity; provided, however, this provision shall not exclude the finish trades from their traditional jurisdiction over painting, tile, marble, and terrazzo work.","SECTION 3. EXCLUDED ENTITIES AND WORK","(A) This Agreement shall not apply to the parents, affiliates, subsidiaries, or other joint or sole ventures of any Owner, EPC Prime Contractor, Contractor or subcontractor or principals thereof, that or who do not perform direct work at the Project site. It is agreed, for the purposes of this Agreement only, that this Agreement does not have the effect of creating any joint employment, single employer or alter ego status among the Owner, the EPC Prime Contractor, and/or any Contractor or subcontractor. Nothing contained herein shall be construed to prohibit or restrict the Owner or its employees trom performing on or off-site work related to the Project, provided that any employee of the Owner performing on-site manual labor for the Project that is more than de minimis or covered off site work that is more than de minimis shall be subject to the terms of this Agreement.","(B) The following categories of Project work are excluded from the scope of this Agreement, unless the EPC Prime Contractor or Owner decide to use and hire Project craft employees through Union hiring halls, in which case those employees only shall be covered by this Agreement:","(i) Any and all maintenance, repair, replacement, service, and/or operation of equipment, tools, and/or infrastructure that has been installed and placed into service;","(it) Grounds maintenance, such as snow removal, lawn care, landscaping, etc.;","(iil) Food services;","(iv) De minimis work self-performed by the Owner;","(v) | Work performed to obtain, retain, or pursuant to a warranty;","(vi) Work performed by specialty or technical contractors or suppliers who supply their own labor or use designated sub-contractors for specialty or technical systems that are proprietary or exclusive to the Owner or its designated contractors or suppliers;","(vii) Seismic work;","(vill) Off-site work of any kind, and the delivery of said work to the Project Site, except for off-site work performed at a location or facility dedicated solely","10","4888-7476-5718.1 / (17346-1004","Micron Confidential"],["(ix) (x) (x1) (xi) (x11) (xIV) (xv) (xvi) (xvii)","(xviit)","(xix)","(xx)","to providing services for the Project Site and deliveries from such dedicated site or facility;","Control systems, except cabling, trays, intermediate wire/tubing run up to Point of Use (“POU”) interconnect for the manufacturing process;","Chemical, slurry and blending systems, except for intermediate connections (i.e, headers and footers);","Bulk and specialty gases and gas systems, except for intermediate connections up to POU interconnectors;","Specialty drain systems;","Water filtration projects and treatment systems, except the construction of any wastewater treatment facility included in the EPC Prime Conttactor’s scope of work;","Life safety systems, except fire protection;","Specialty systems, technology systems, and equipment used in testing, verifying, and certifying systems;","Quality control and quality assurance;","Security;","Emergency repairs;","Construction of electrical transmission and distribution lines (including above-ground and below-ground lines), catenary and trolley facilities,","switch yards, substations, lighting (roadway and street lighting), traffic signals, and outside tele-data work; and","Construction work performed pursuant to the bid packages as set forth in Schedule G, which were awarded prior to the Effective Date of this Agreement.","SECTION 4. TERM OF AGREEMENT With the exception of Article 8, Section | which shall continue to apply to all Unions","signatory to this Agreement until the completion of the Project, as areas and systems of the Project","are inspected and construction tested by the EPC Prime Contractor or Contractors, and accepted","by the Owner, this Agreement will not have further force or effect on such items or areas, except","where inspections, additions, repairs, modifications, check-out and/or warranty work are assigned","in writing (copy to Union involved) by the EPC Prime Contractor for performance under the terms","of this Agreement.","11","4888-7476-57 18.1 / 17346-1004","Micron Con
